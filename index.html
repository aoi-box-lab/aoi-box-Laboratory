function sleep(ms){

async function fetchWithTimeout(url, options, timeoutMs){
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), timeoutMs);
    try{
        return await fetch(url, Object.assign({}, options||{}, {signal: controller.signal}));
    }finally{
        clearTimeout(timer);
    }
}

function shuffled(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
}

function initDB(){
    return new Promise((resolve, reject)=>{
        const req = indexedDB.open("YamabikoDB", 2);
        req.onupgradeneeded = (e)=>{
            const db = e.target.result;
            if(!db.objectStoreNames.contains("books")) db.createObjectStore("books",{keyPath:"id"});
            if(!db.objectStoreNames.contains("cache")) db.createObjectStore("cache",{keyPath:"key"});
        };
        req.onsuccess = (e)=>{
            maji_de_db = e.target.result;
            db_closing = false;
            maji_de_db.onversionchange = ()=>{
                db_closing = true;
                try{ maji_de_db.close(); }catch(_){}
                maji_de_db = null;
            };
            maji_de_db.onclose = ()=>{
                db_closing = true;
                maji_de_db = null;
            };
            resolve(maji_de_db);
        };
        req.onerror = (e)=>reject(e.target.error);
        req.onblocked = ()=>{
            showToast('他のタブでヤマビコが開かれています。そちらを閉じて再読み込みしてください。', 'warn', 12000);
        };
    });
}

async function ensureDB(){
    if(maji_de_db && !db_closing){
        try{
            maji_de_db.transaction(["books"],"readonly").abort();
            return maji_de_db;
        }catch(e){
            maji_de_db = null;
        }
    }
    await initDB();
    return maji_de_db;
}

async function safeDBOp(storeNames, mode, fn){
    await ensureDB();
    return new Promise((resolve, reject)=>{
        let tx;
        try{
            tx = maji_de_db.transaction(storeNames, mode);
        }catch(e){
            initDB().then(()=>{
                try{
                    const tx2 = maji_de_db.transaction(storeNames, mode);
                    fn(tx2, resolve, reject);
                }catch(e2){
                    reject(e2);
                }
            }).catch(reject);
            return;
        }
        fn(tx, resolve, reject);
    });
}

}

async function getAuthorEnglishNameFromWikipedia(jpName){
    if(/^[a-zA-Z0-9\s]+$/.test(jpName)) return null;
    try{
        const api = `https://ja.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(jpName)}&gsrlimit=5&prop=langlinks&lllang=en&format=json&origin=*&indexpageids=1`;
        const res = await fetchWithTimeout(CORS_PROXIES.aoi(api), {}, FETCH_TIMEOUT_API);
        const data = await res.json();
        const q = data && data.query;
        if(!q || !q.pages) return null;
        const ids = (q.pageids && q.pageids.length) ? q.pageids : Object.keys(q.pages);
        for(const id of ids){
            const p = q.pages[id];
            if(!p) continue;
            if(p.title && /曖昧さ回避|一覧|の作品|作品一覧/.test(p.title)) continue;
            const ll = p.langlinks;
            if(ll && ll[0] && ll[0]["*"]) return ll[0]["*"];
        }
    }catch(e){}
    return null;
}

async function fetchAozoraCatalog(){
    if(aozora_catalog_loading || aozora_catalog_ready) return;
    aozora_catalog_loading = true;
    showHeaderSpinner();

    try{
        const cached = await getCacheFromDB('aozora_catalog');
        if(cached && cached.value && cached.value.length > 100){
            aozora_catalog = cached.value;
            aozora_catalog_ready = true;
            aozora_catalog_loading = false;
            console.log(`[青空文庫] キャッシュから読み込み (${aozora_catalog.length}件)`);
            hideHeaderSpinner();
            return;
        }
    }catch(e){}

    console.log('[青空文庫] カタログ取得開始...');
    let catalog = null;
    let lastErr = '';

    for(const src of AOZORA_CATALOG_SOURCES){
        if(catalog) break;
        try{
            console.log(`[青空文庫] ${src.name} から取得中...`);
            const fetchUrl = src.proxy ? CORS_PROXIES[src.proxy](src.url) : src.url;
            const res = await fetchWithTimeout(fetchUrl, { cache: 'no-store' }, FETCH_TIMEOUT_BOOK);
            if(!res.ok){
                lastErr = `${src.name}: HTTP ${res.status}`;
                continue;
            }

            if(src.type === 'zip'){
                const buf = await res.arrayBuffer();
                if(buf.byteLength < 10000){
                    lastErr = `${src.name}: データが短すぎる (${buf.byteLength} bytes)`;
                    continue;
                }
                const zip = await JSZip.loadAsync(buf);
                let f = zip.file(AOZORA_CSV_FILENAME);
                if(!f){
                    const cn = Object.keys(zip.files).find(n=>n.endsWith('.csv'));
                    if(cn) f = zip.file(cn);
                }
                if(!f){
                    lastErr = `${src.name}: CSVが見つからない`;
                    continue;
                }
                const csv = await f.async('string');
                if(!csv || csv.length < 10000){
                    lastErr = `${src.name}: CSVが短すぎる`;
                    continue;
                }
                catalog = parseAozoraCSV(csv);
                console.log(`[青空文庫] ${src.name} 成功 (${catalog.length}件)`);
            } else if(src.type === 'json'){
                const text = await res.text();
                if(!text || text.length < 10000){
                    lastErr = `${src.name}: JSONが短すぎる`;
                    continue;
                }
                const json = JSON.parse(text);
                catalog = parseAozoraCardJson(json);
                console.log(`[青空文庫] ${src.name} 成功 (${catalog.length}件)`);
            }
        }catch(e){
            lastErr = `${src.name}: ${e.message}`;
            console.warn(`[青空文庫] ${src.name} 失敗:`, e.message);
        }
    }

    if(!catalog || !catalog.length){
        aozora_catalog_loading = false;
        hideHeaderSpinner();
        console.error('[青空文庫] 全ソース失敗:', lastErr);
        showErrorBanner(
            '青空文庫カタログの取得に失敗しました。',
            `最終エラー: ${lastErr}\n\n` +
            `【対処法】\n` +
            `青空文庫公式サイト (https://www.aozora.gr.jp/index_pages/person_all.html) から ` +
            `list_person_all_extended_utf8.zip をダウンロードし、解凍した ` +
            `list_person_all_extended_utf8.csv を、このHTMLファイルと同じフォルダに配置してください。`
        );
        return;
    }

    aozora_catalog = catalog;
    aozora_catalog_ready = true;
    aozora_catalog_loading = false;
    console.log(`[青空文庫] カタログ読み込み完了 (${catalog.length}件)`);
    try{ await saveCacheToDB('aozora_catalog', catalog); }catch(e){}
    hideHeaderSpinner();
    showToast(`青空文庫カタログ読み込み完了（${catalog.length}件）`, 'success', 5000);
}

function parseAozoraCSV(csv){
    const lines = csv.split('\n');
    const catalog = [];
    for(let i=1;i<lines.length;i++){
        const line = lines[i].trim();
        if(!line) continue;
        const cols = parseCSVLine(line);
        if(cols.length < 11) continue;
        const workId = (cols[0]||'').trim();
        const title = (cols[1]||'').trim();
        const personId = (cols[8]||'').trim();
        const personName = (cols[9]||'').trim();
        const cardUrl = (cols[10]||'').trim();
        let htmlUrl = '';
        for(let c=11;c<Math.min(cols.length,40);c++){
            const v = (cols[c]||'').trim();
            if(v && v.includes('/files/') && (v.endsWith('.html') || v.endsWith('.xhtml'))){
                htmlUrl = v;
                break;
            }
        }
        if(!workId || !title) continue;
        catalog.push({workId, title, personId, personName, cardUrl, htmlUrl});
    }
    return catalog;
}

function parseAozoraCardJson(json){
    const catalog = [];
    const arr = Array.isArray(json) ? json : (json.cards || json.data || []);
    for(const card of arr){
        try{
            const t = card.title || {};
            const workId = String(t.work_id || '').trim();
            const title = String(t.title || '').trim();
            const personId = String(t.person_id || t.author_num || '').trim();
            const personName = String(t.person_name || '').trim();
            if(!workId || !title) continue;
            catalog.push({
                workId,
                title,
                personId,
                personName,
                cardUrl: personId && workId ? `https://www.aozora.gr.jp/cards/${personId}/card${workId}.html` : '',
                htmlUrl: ''
            });
        }catch(e){}
    }
    return catalog;
}

function parseCSVLine(line){
    const result = [];
    let cur = '', inQ = false;
    for(let i=0;i<line.length;i++){
        const ch = line[i];
        if(inQ){
            if(ch === '"'){
                if(i+1 < line.length && line[i+1] === '"'){
                    cur += '"';
                    i++;
                } else {
                    inQ = false;
                }
            } else {
                cur += ch;
            }
        } else {
            if(ch === '"') inQ = true;
            else if(ch === ','){ result.push(cur); cur = ''; }
            else cur += ch;
        }
    }
    result.push(cur);
    return result;
}

async function searchAozora(query){
    if(!aozora_catalog_ready){
        if(!aozora_catalog_loading) fetchAozoraCatalog();
        let waited = 0;
        while(!aozora_catalog_ready && waited < 90000){
            await sleep(300);
            waited += 300;
        }
        if(!aozora_catalog_ready){
            throw new Error('青空文庫カタログの読み込みが完了していません。少し待ってから再度お試しください。');
        }
    }
    const q = query.toLowerCase();
    let results;
    if(search_mode_v === "author"){
        results = aozora_catalog.filter(it => (it.personName||'').toLowerCase().includes(q));
    } else {
        results = aozora_catalog.filter(it => (it.title||'').toLowerCase().includes(q));
    }
    return results.slice(0, 100);
}

/* ============================================================
   翻訳ヘルパ
   ============================================================ */
function splitTextRoughly(text, maxLen){
    const chunks = [];
    let rest = text;
    while(rest.length > maxLen){
        let cut = rest.lastIndexOf(". ", maxLen);
        if(cut < maxLen*0.5) cut = maxLen;
        chunks.push(rest.slice(0, cut+1));
        rest = rest.slice(cut+1);
    }
    if(rest.length) chunks.push(rest);
    return chunks;
}

function splitTextByBytes(text, maxBytes){
    const chunks = [];
    let cur = '';
    for(const ch of text){
        if(new Blob([cur+ch]).size > maxBytes){
            chunks.push(cur);
            cur = ch;
        } else {
            cur += ch;
        }
    }
    if(cur) chunks.push(cur);
    return chunks;
}

async function translateChunk(text, source, target){
    if(!text || !text.trim()) return {ok:true, text};

    for(const inst of shuffled(LINGVA_INSTANCES)){
        try{
            const url = `${inst}/api/v1/${source}/${target}/${encodeURIComponent(text)}`;
            const res = await fetchWithTimeout(url, {cache:'no-store'}, FETCH_TIMEOUT_TRANSLATE);
            if(!res.ok) continue;
            const data = await res.json();
            if(data && data.translation) return {ok:true, text:data.translation, endpoint:'Lingva'};
        }catch(e){}
    }

    try{
        const chunks = splitTextByBytes(text, 450);
        let combined = '', anyOk = false;
        for(const c of chunks){
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(c)}&langpair=${encodeURIComponent(source+'|'+target)}`;
            const res = await fetchWithTimeout(url, {cache:'no-store'}, FETCH_TIMEOUT_TRANSLATE);
            if(!res.ok) continue;
            const data = await res.json();
            if(data && data.responseData && data.responseData.translatedText){
                const t = data.responseData.translatedText;
                if(!/MYMEMORY WARNING|INVALID|QUERY LENGTH/i.test(t)){
                    combined += t;
                    anyOk = true;
                }
            }
            await sleep(150);
        }
        if(anyOk) return {ok:true, text:combined, endpoint:'MyMemory'};
    }catch(e){}

    for(const inst of shuffled(LIBRETRANSLATE_INSTANCES)){
        try{
            const res = await fetchWithTimeout(`${inst}/translate`, {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({q:text, source, target})
            }, FETCH_TIMEOUT_TRANSLATE);
            if(!res.ok) continue;
            const data = await res.json();
            if(data && data.translatedText) return {ok:true, text:data.translatedText, endpoint:'LibreTranslate'};
        }catch(e){}
    }

    return {ok:false, error:'全翻訳APIが失敗しました'};
}

async function translateParagraph(text, source, target){
    if(!text || !text.trim()) return {ok:true, text};
    if(text.length <= CHUNK_MAX_LEN) return await translateChunk(text, source, target);
    const chunks = splitTextRoughly(text, CHUNK_MAX_LEN);
    let combined = '';
    for(const c of chunks){
        const r = await translateChunk(c, source, target);
        if(!r.ok) return r;
        combined += r.text;
    }
    return {ok:true, text:combined, endpoint:'chunked'};
}

function buildBidirectionalQueue(total){
    const q = [];
    let f = 0, b = total - 1;
    while(f <= b){
        if(f === b){ q.push(f); break; }
        q.push(f);
        q.push(b);
        f++;
        b--;
    }
    return q;
}

function buildTranslatedHtml(book){
    if(book.paragraphs && book.paragraphs.length){
        const texts = book.translatedTexts || [];
        return book.paragraphs.map((p, i)=>{
            const t = texts[i];
            const isUn = (t == null);
            return `<${p.tag} data-pidx="${i}"${isUn?' class="untranslated"':''}>${escapeHtml(isUn ? p.text : t)}</${p.tag}>`;
        }).join("");
    }
    return book.contentTranslated || book.content || "";
}

async function startBackgroundTranslation(bookId){
    if(active_translation_jobs[bookId]) return;
    active_translation_jobs[bookId] = true;
    const myGen = (translation_generation[bookId]||0) + 1;
    translation_generation[bookId] = myGen;

    let bookTitleForToast = '';
    try{
        const book = await getBookFromDB(bookId);
        if(!book || !book.paragraphs || !book.paragraphs.length) return;
        bookTitleForToast = book.title;

        const total = book.paragraphs.length;
        if(!Array.isArray(book.translatedTexts) || book.translatedTexts.length !== total){
            const old = Array.isArray(book.translatedTexts) ? book.translatedTexts : [];
            const fixed = new Array(total).fill(null);
            for(let i=0;i<total;i++){
                if(old[i] != null) fixed[i] = old[i];
            }
            book.translatedTexts = fixed;
        }
        const already = book.translatedTexts.filter(t=>t != null).length;
        if(already >= total){
            book.translationStatus = "done";
            book.translationDone = total;
            await saveBookToDB(book);
            onTranslationTick(book);
            return;
        }

        const srcLang = book.sourceLang || 'en';
        const tgtLang = book.targetLang || 'ja';

        book.translationStatus = "translating";
        book.translationTotal = total;
        book.translationDone = already;
        delete book.lastError;

        const queue = buildBidirectionalQueue(total).filter(i=>book.translatedTexts[i] == null);
        let qi = 0, lastSave = 0, fails = 0, para = INITIAL_PARALLELISM;

        const worker = async (worker_id)=>{
            while(true){
                if(translation_generation[bookId] !== myGen) return;
                if(worker_id >= para) return;
                if(qi >= queue.length) return;
                const idx = queue[qi++];
                if(book.translatedTexts[idx] != null) continue;
                let ok = false, lastErr = '';
                for(let attempt=0; attempt<MAX_RETRY_PER_PARAGRAPH; attempt++){
                    if(translation_generation[bookId] !== myGen) return;
                    const r = await translateParagraph(book.paragraphs[idx].text, srcLang, tgtLang);
                    if(r.ok){
                        book.translatedTexts[idx] = r.text;
                        book.translationDone = (book.translationDone||0) + 1;
                        onTranslationTick(book);
                        if(Date.now() - lastSave > 1500){
                            lastSave = Date.now();
                            saveBookToDB(book);
                        }
                        ok = true;
                        break;
                    }
                    lastErr = r.error || 'unknown';
                    await sleep(Math.min(50*(attempt+1), 250));
                }
                if(ok){
                    fails = 0;
                } else {
                    fails++;
                    book.lastError = `段落${idx}: ${lastErr}`;
                    if(fails >= FAILS_TO_DROP_CONCURRENCY){
                        if(para > MIN_PARALLELISM){
                            const prev = para;
                            para = para === 32 ? 16 : MIN_PARALLELISM;
                            fails = 0;
                            showToast(`翻訳が不安定なため並列度を${prev}→${para}に下げます`, 'warn', 8000);
                        } else {
                            fails = 0;
                        }
                    }
                }
                await sleep(WORKER_DELAY_MS);
            }
        };

        const workers = [];
        for(let i=0;i<INITIAL_PARALLELISM;i++) workers.push(worker(i));
        await Promise.all(workers);

        if(translation_generation[bookId] !== myGen) return;

        book.translationDone = book.translatedTexts.filter(t=>t != null).length;
        if(book.translationDone >= total){
            book.translationStatus = "done";
            showToast(`「${bookTitleForToast}」の翻訳が完了しました (${book.translationDone}/${total})`, 'success');
        } else {
            book.translationStatus = "error";
            showToast(`「${bookTitleForToast}」一部の段落が未翻訳です (${book.translationDone}/${total})`, 'warn', 12000);
        }
        await saveBookToDB(book);
        onTranslationTick(book);
    }catch(err){
        showToast('翻訳ジョブがクラッシュ: ' + err.message, 'error');
        try{
            if(translation_generation[bookId] === myGen){
                const b = await getBookFromDB(bookId);
                if(b){
                    b.translationStatus = "error";
                    b.lastError = err.message;
                    await saveBookToDB(b);
                    onTranslationTick(b);
                }
            }
        }catch(e){}
    }finally{
        if(translation_generation[bookId] === myGen){
            active_translation_jobs[bookId] = false;
        }
    }
}

function onTranslationTick(book){
    if(ima_yonderu_hon && ima_yonderu_hon.id === book.id){
        ima_yonderu_hon.translatedTexts = book.translatedTexts;
        ima_yonderu_hon.translationStatus = book.translationStatus;
        ima_yonderu_hon.translationDone = book.translationDone;
        ima_yonderu_hon.translationTotal = book.translationTotal;
        ima_yonderu_hon.lastError = book.lastError;
        if(!ima_yonderu_hon.paragraphs) ima_yonderu_hon.paragraphs = book.paragraphs;
        if(is_showing_translation){
            applyTranslationToDom(book);
            if(is_page_mode) schedulePageRecompute();
        }
        updateReaderTranslationLabel();
    }
    updateBookshelfRowStatus(book);
}

function applyTranslationToDom(book){
    if(!ima_yonderu_hon || ima_yonderu_hon.id !== book.id) return;
    if(!is_showing_translation || !book.paragraphs) return;
    const flow = document.getElementById("reader-flow");
    const texts = book.translatedTexts || [];
    const children = flow.children;
    for(let i=0;i<book.paragraphs.length && i<children.length;i++){
        const el = children[i];
        if(texts[i] != null && el.classList.contains("untranslated")){
            el.textContent = texts[i];
            el.classList.remove("untranslated");
        }
    }
}

function updateBookshelfRowStatus(book){
    const el = document.querySelector(`[data-status-for="${book.id}"]`);
    if(!el) return;
    el.textContent = formatTranslationStatus(book);
    el.classList.remove('error','done');
    if(book.translationStatus === "error") el.classList.add('error');
    else if(book.translationStatus === "done") el.classList.add('done');
    if(book.lastError && book.translationStatus === "error") el.title = book.lastError;
}

function formatTranslationStatus(book){
    if(book.translationStatus === "translating"){
        const done = book.translationDone || 0;
        const total = book.translationTotal || (book.paragraphs ? book.paragraphs.length : 0);
        return `翻訳中 ${done}/${total}`;
    }
    if(book.translationStatus === "done") return "翻訳完了";
    if(book.translationStatus === "error"){
        const done = book.translationDone || 0;
        const total = book.translationTotal || (book.paragraphs ? book.paragraphs.length : 0);
        return `翻訳失敗 ${done}/${total}`;
    }
    if(book.contentTranslated) return "翻訳完了";
    return "—";
}

async function resumePendingTranslations(){
    try{
        const books = await getAllBooksFromDB();
        const pending = books.filter(b=>{
            if(!b.paragraphs || !b.paragraphs.length) return false;
            const total = b.translationTotal || b.paragraphs.length;
            const done = b.translationDone || 0;
            return done < total;
        });
        if(pending.length > 0){
            showToast(`未完了の翻訳 ${pending.length}件 を再開します`, 'info');
            pending.forEach(b=>{
                active_translation_jobs[b.id] = false;
                startBackgroundTranslation(b.id);
            });
        }
    }catch(e){}
}

async function execSearchGutenberg(q_v){
    const t = document.getElementById("results-table");
    const tb = document.getElementById("results-tbody");
    const loose = q_v.replace(/[・＝ _]/g," ").replace(/\s+/g," ").trim();
    let eng = "";
    if(search_mode_v === "title"){
        setStatus("search-status", `「${loose}」を英語化中...`, 'info');
        eng = await translateText(loose, 'ja', 'en');
        setStatus("search-status", `翻訳結果「${eng}」でGutendexを検索中...`, 'info');
    } else {
        setStatus("search-status", `Wikipediaで「${loose}」の英語表記を探り中...`, 'info');
        eng = await getAuthorEnglishNameFromWikipedia(loose);
        if(eng){
            setStatus("search-status", `Wikipediaで英語表記「${eng}」を発見！Gutendexを検索中...`, 'info');
        } else {
            setStatus("search-status", "Wikipediaにないので翻訳で英語化中...", 'info');
            eng = await translateText(loose, 'ja', 'en');
            setStatus("search-status", `翻訳結果「${eng}」でGutendexを検索中...`, 'info');
        }
    }
    const clean = eng.replace(/[^\w\s]/gi,' ').replace(/\s+/g,' ').trim();
    try{
        const api = `https://gutendex.com/books/?search=${encodeURIComponent(clean)}`;
        const res = await fetchWithTimeout(CORS_PROXIES.aoi(api), {}, FETCH_TIMEOUT_API);
        const data = await res.json();
        if(!data.results || !data.results.length){
            setStatus("search-status", "Gutendexに該当する作品が見つかりませんでした", 'error');
            showToast('検索結果0件: Gutendexに該当作品なし', 'warn');
            return;
        }
        setStatus("search-status", `見つかりました (${data.results.length}件)`, 'success');
        t.style.display = "table";
        data.results.forEach((b)=>{
            v_project_cache[b.id] = b;

                <td>${escapeHtml(b.title)}</td>

            `;
            tb.appendChild(tr);
        });
    }catch(err){
        setStatus("search-status", `検索エラー: ${err.message}`, 'error');
        showToast('検索エラー: ' + err.message, 'error');
    }
}

async function downloadAndSaveGutenberg(bookId){
    const rx = v_project_cache[bookId];
    if(!rx){
        setStatus("search-status", "エラー: キャッシュがありません", 'error');
        showToast('ダウンロード失敗: 内部キャッシュなし', 'error');
        return;
    }
    setStatus("search-status", `作品ID:${bookId} をダウンロード中...`, 'info');
    showToast(`ダウンロード開始: ${rx.title}`, 'info');
    try{
        const urls = [
            rx.formats["text/html; charset=utf-8"],
            rx.formats["text/html"],
            `https://www.gutenberg.org/cache/epub/${bookId}/pg${bookId}-images.html`,
            rx.formats["text/plain; charset=utf-8"],
            rx.formats["text/plain"],
            `https://www.gutenberg.org/cache/epub/${bookId}/pg${bookId}.txt.utf8`
        ].filter(Boolean);
        if(!urls.length){
            setStatus("search-status", "エラー: 読める形式のURLが存在しません", 'error');
            showToast('この作品はHTML/テキスト形式がありません', 'error');
            return;
        }
        let ok = null, rt = "", final_url = "", lastErr = '';
        for(const u of urls){
            try{
                const r = await fetchWithTimeout(CORS_PROXIES.aoi(u), {}, FETCH_TIMEOUT_BOOK);
                if(r.ok){
                    ok = r;
                    rt = await r.text();
                    final_url = u;
                    break;
                } else {
                    lastErr = `HTTP ${r.status}`;
                }
            }catch(e){
                lastErr = e.message;
            }
        }
        if(!ok) throw new Error(`全URL取得失敗（最後のエラー: ${lastErr}）`);

        let paras = [];
        if(final_url.includes("html") || final_url.includes("htm")){
            const d = new DOMParser().parseFromString(rt, "text/html");
            d.querySelectorAll("script, style, header, footer, img").forEach(el=>el.remove());
            const pe = d.querySelectorAll("p, h1, h2, h3");
            if(pe.length){
                pe.forEach(px=>{
                    const tx = px.textContent.trim();
                    if(tx) paras.push({tag: px.tagName.toLowerCase(), text: tx});
                });
            } else {
                paras.push({tag:"p", text: d.body.textContent.trim()});
            }
        } else {
            rt.split("\n").forEach(l=>{
                if(l.trim()) paras.push({tag:"p", text: l.trim()});
            });
        }
        if(!paras.length) throw new Error('本文の段落が0個でした（HTML構造が想定外）');

        const ch = paras.map(p=>`<${p.tag}>${escapeHtml(p.text)}</${p.tag}>`).join("");
        const an = rx.authors[0] ? rx.authors[0].name : "不明";
        const srcLang = (Array.isArray(rx.languages) && rx.languages.length) ? rx.languages[0] : 'en';

        const bd = {
            id: 'gutenberg_' + bookId,
            title: rx.title,
            author: an,
            content: ch,
            contentTranslated: "",
            paragraphs: paras,
            translatedTexts: new Array(paras.length).fill(null),
            translationStatus: "translating",
            translationDone: 0,
            translationTotal: paras.length,
            sourceLang: srcLang,
            targetLang: 'ja',
            bookmark: null,
            source: 'gutenberg',
            savedAt: new Date().toISOString(),
            sortOrder: Date.now(),
            favorite: false
        };
        await saveBookToDB(bd);
        setStatus("search-status", "保存完了！裏で翻訳を進めます", 'success');
        showToast(`「${rx.title}」保存完了（${paras.length}段落 / ${srcLang}→ja）`, 'success');
        openReader(bd);
        startBackgroundTranslation(bd.id);
    }catch(err){
        setStatus("search-status", `ダウンロード失敗: ${err.message}`, 'error');
        showToast('ダウンロード失敗: ' + err.message, 'error');
    }
}
window.downloadAndSaveGutenberg = downloadAndSaveGutenberg;

async function downloadAndSaveAozora(workId, personId, title, personName){
    const key = 'aozora_' + workId;
    setStatus("search-status", `「${title}」をダウンロード中...`, 'info');
    showToast(`ダウンロード開始: ${title}`, 'info');
    try{
        const cardUrl = `https://www.aozora.gr.jp/cards/${personId}/card${workId}.html`;
        const cardRes = await fetchWithTimeout(CORS_PROXIES.aoi(cardUrl), {}, FETCH_TIMEOUT_BOOK);
        if(!cardRes.ok) throw new Error(`図書カード取得失敗: HTTP ${cardRes.status}`);
        const cardBuf = await cardRes.arrayBuffer();
        let cardHtml = '';
        const cardHead = new TextDecoder('ascii').decode(cardBuf.slice(0, 2000)).toLowerCase();
        if(cardHead.includes('shift_jis') || cardHead.includes('shift-jis') || cardHead.includes('sjis')){
            cardHtml = new TextDecoder('shift_jis').decode(cardBuf);
        } else {
            cardHtml = new TextDecoder('utf-8').decode(cardBuf);
        }

        const htmlUrlMatch = cardHtml.match(/href="(\.\/files\/[^"]+\.html?)"/i)
                          || cardHtml.match(/href="(files\/[^"]+\.html?)"/i)
                          || cardHtml.match(/href="([^"]*\/files\/[^"]+\.html?)"/i);
        if(!htmlUrlMatch) throw new Error('本文HTMLのURLが図書カードから見つかりませんでした');
        const relativePath = htmlUrlMatch[1].replace(/^\.\//, '');
        const bodyUrl = `https://www.aozora.gr.jp/cards/${personId}/${relativePath}`;
        console.log('[青空文庫] 本文URL:', bodyUrl);

        const bodyBuf = await bodyRes.arrayBuffer();

        const bodyHead = new TextDecoder('ascii').decode(bodyBuf.slice(0, 2000)).toLowerCase();
        if(bodyHead.includes('shift_jis') || bodyHead.includes('shift-jis') || bodyHead.includes('sjis')){
            bodyHtml = new TextDecoder('shift_jis').decode(bodyBuf);
        } else {
            bodyHtml = new TextDecoder('utf-8').decode(bodyBuf);

        const d = new DOMParser().parseFromString(bodyHtml, "text/html");
        d.querySelectorAll("script, style, header, footer, img, .bibliographical_information, .notation_notes, .after_text").forEach(el=>el.remove());
        const main = d.querySelector("div.main_text");
        if(!main) throw new Error('本文（div.main_text）が見つかりませんでした');
        main.querySelectorAll("rp").forEach(el=>el.remove());

        let paras = [];
        const pe = main.querySelectorAll("p");
        if(pe.length){
            pe.forEach(px=>{
                const tx = px.textContent.trim();
                if(tx) paras.push({tag:"p", text: tx});
            });
        } else {
            main.textContent.trim().split(/\n+/).forEach(l=>{
                if(l.trim()) paras.push({tag:"p", text: l.trim()});
            });
        }
        if(!paras.length) throw new Error('本文の段落が0個でした');

        const ch = paras.map(p=>`<${p.tag}>${escapeHtml(p.text)}</${p.tag}>`).join("");

        const bd = {
            id: key,
            title,
            author: personName,
            content: ch,
            contentTranslated: "",
            paragraphs: paras,
            translatedTexts: new Array(paras.length).fill(null),
            translationStatus: "done",
            translationDone: paras.length,
            translationTotal: paras.length,
            sourceLang: 'ja',
            targetLang: 'ja',
            bookmark: null,
            source: 'aozora',
            savedAt: new Date().toISOString(),
            sortOrder: Date.now(),
            favorite: false
        };

        await saveBookToDB(bd);
        setStatus("search-status", "保存完了！", 'success');
        showToast(`「${title}」保存完了（${paras.length}段落）`, 'success');
        openReader(bd);

        setStatus("search-status", `ダウンロード失敗: ${err.message}`, 'error');
        showToast('ダウンロード失敗: ' + err.message, 'error');
    }
}

function loadBookshelf(){
    const s = document.getElementById("bookshelf-status");
    const t = document.getElementById("bookshelf-table");
    const tb = document.getElementById("bookshelf-tbody");
    tb.innerHTML = "";
    s.textContent = "読み込み中...";
    s.classList.remove('error','success','info');

    const filter = (document.getElementById("bookshelf-search").value || '').trim().toLowerCase();
    const favOnly = document.getElementById("bookshelf-fav-only").checked;

    safeDBOp(["books"], "readonly", (tx, resolve, reject)=>{
        const rq = tx.objectStore("books").getAll();
        rq.onsuccess = ()=>{
            const bks = rq.result;
            if(!bks.length){
                setStatus("bookshelf-status", "本棚は空っぽです", 'info');
                t.style.display = "none";
                resolve();
                return;
            }
            let filtered = bks;
            if(favOnly) filtered = filtered.filter(b=>b.favorite);
            if(filter){
                filtered = filtered.filter(b=>{
                    const tt = (b.title || '').toLowerCase();
                    const aa = (b.author || '').toLowerCase();
                    return tt.includes(filter) || aa.includes(filter);
                });
            }
            if(!filtered.length){
                setStatus("bookshelf-status", "条件に一致する本がありません", 'info');
                t.style.display = "none";
                resolve();
                return;
            }
            filtered.sort((a,b)=>(a.sortOrder ?? Infinity) - (b.sortOrder ?? Infinity));
            s.textContent = "";
            t.style.display = "table";

            filtered.forEach(b=>{
                const tr = document.createElement("tr");
                tr.draggable = true;
                tr.ondragstart = (e)=>handleDragStart(e, b.id);
                tr.ondragover = (e)=>handleDragOver(e, tr);
                tr.ondragleave = ()=>tr.classList.remove("drag-over-row");
                tr.ondrop = (e)=>handleRowDrop(e, b.id, tr);
                tr.style.cursor = "pointer";
                tr.onclick = ()=>readSavedBook(b.id);

                const fav = b.favorite ? "★ " : "";
                const st = formatTranslationStatus(b);
                const stCls = b.translationStatus === "error" ? "error" : b.translationStatus === "done" ? "done" : "";
                const errTitle = b.lastError ? ` title="${escapeHtml(b.lastError)}"` : "";
                const total = b.translationTotal || (b.paragraphs ? b.paragraphs.length : 0);
                const done = b.translationDone || 0;
                const incomplete = b.paragraphs && b.paragraphs.length && done < total;
                const retryBtn = incomplete
                    ? `<button onclick="event.stopPropagation(); retryTranslation('${escapeHtml(b.id)}')">翻訳を再開</button>`
                    : "";

                tr.innerHTML = `
                    <td class="id-cell">
                        <span class="drag-handle" title="ドラッグで並べ替え" onclick="event.stopPropagation()">
                            <span class="bar"></span><span class="bar"></span>
                        </span>
                        ${escapeHtml(b.id)}
                    </td>
                    <td>${fav}${escapeHtml(b.title)}</td>
                    <td>${escapeHtml(b.author)}</td>
                    <td><span class="trans-badge ${stCls}" data-status-for="${escapeHtml(b.id)}"${errTitle}>${st}</span></td>
                    <td onclick="event.stopPropagation()">
                        <div class="menu-wrap">
                            <button class="dots-btn" onclick="toggleRowMenu(event, '${escapeHtml(b.id)}')">⋮</button>
                            <div class="row-menu" id="menu-${escapeHtml(b.id)}">
                                ${retryBtn}
                                <button onclick="toggleFavorite('${escapeHtml(b.id)}')">${b.favorite ? "お気に入り解除" : "お気に入りに追加"}</button>
                                <button onclick="confirmDeleteBook('${escapeHtml(b.id)}')" style="color:#d9534f;">削除</button>
                            </div>
                        </div>
                    </td>
                `;
                tb.appendChild(tr);
            });
            resolve();
        };
        rq.onerror = ()=>reject(rq.error);
    }).catch(e=>{
        setStatus("bookshelf-status", "本棚読み込みエラー: " + e.message, 'error');
    });
}

async function retryTranslation(bookId){
    closeAllRowMenus();
    const book = await getBookFromDB(bookId);
    if(!book || !book.paragraphs){
        showToast('翻訳データがないため再開できません', 'error');
        return;
    }
    active_translation_jobs[bookId] = false;
    showToast('翻訳を再開します', 'info');
    startBackgroundTranslation(bookId);
    loadBookshelf();
}
window.retryTranslation = retryTranslation;

function handleDragStart(ev, bookId){
    drag_zaku_id = bookId;
    ev.dataTransfer.effectAllowed = "move";
}

function handleDragOver(ev, rowEl){
    ev.preventDefault();
    rowEl.classList.add("drag-over-row");
}

function handleRowDrop(ev, targetId, rowEl){
    ev.preventDefault();
    rowEl.classList.remove("drag-over-row");
    if(drag_zaku_id === null || drag_zaku_id === targetId) return;
    swapBookOrder(drag_zaku_id, targetId);
    drag_zaku_id = null;
}

function swapBookOrder(idA, idB){
    safeDBOp(["books"], "readwrite", (tx, resolve)=>{
        const st = tx.objectStore("books");
        const rqA = st.get(idA);
        rqA.onsuccess = ()=>{
            const a = rqA.result;
            const rqB = st.get(idB);
            rqB.onsuccess = ()=>{
                const b = rqB.result;
                if(!a || !b){
                    resolve();
                    return;
                }
                const tmp = a.sortOrder ?? 0;
                a.sortOrder = b.sortOrder ?? 0;
                b.sortOrder = tmp;
                st.put(a);
                st.put(b);
            };
        };
        tx.oncomplete = ()=>{
            loadBookshelf();
            resolve();
        };
    }).catch(()=>{});
}

function toggleRowMenu(ev, bookId){
    ev.stopPropagation();
    const menu = document.getElementById(`menu-${bookId}`);
    const opening = !menu.classList.contains("active");
    closeAllRowMenus();
    if(opening){
        const btn = ev.currentTarget;
        const rect = btn.getBoundingClientRect();
        const w = 180;
        let left = rect.right - w;
        if(left < 8) left = 8;
        menu.style.position = "fixed";
        menu.style.top = (rect.bottom + 4) + "px";
        menu.style.left = left + "px";
        menu.style.right = "auto";
        menu.classList.add("active");
        menu_char_aznable_id = bookId;
    }
}
window.toggleRowMenu = toggleRowMenu;

function closeAllRowMenus(){
    document.querySelectorAll(".row-menu").forEach(m=>m.classList.remove("active"));
    menu_char_aznable_id = null;
}
document.addEventListener("click", ()=>closeAllRowMenus());
document.addEventListener("scroll", ()=>closeAllRowMenus(), true);
window.addEventListener("resize", ()=>closeAllRowMenus());

function toggleFavorite(bookId){
    closeAllRowMenus();
    safeDBOp(["books"], "readwrite", (tx, resolve)=>{
        const st = tx.objectStore("books");
        const rq = st.get(bookId);
        rq.onsuccess = ()=>{
            const b = rq.result;
            if(!b){
                resolve();
                return;
            }
            b.favorite = !b.favorite;
            st.put(b);
        };
        tx.oncomplete = ()=>{
            loadBookshelf();
            resolve();
        };
    }).catch(()=>{});
}
window.toggleFavorite = toggleFavorite;

function confirmDeleteBook(bookId){
    closeAllRowMenus();
    delete_kill_confirm_id = bookId;
    document.getElementById("confirm-modal").classList.add("active");
}
window.confirmDeleteBook = confirmDeleteBook;

function closeConfirmModal(){
    delete_kill_confirm_id = null;
    document.getElementById("confirm-modal").classList.remove("active");
}
window.closeConfirmModal = closeConfirmModal;

function executeConfirmedDelete(){
    if(delete_kill_confirm_id === null) return;
    const id = delete_kill_confirm_id;
    deleteBook(id);
    closeConfirmModal();
}
window.executeConfirmedDelete = executeConfirmedDelete;

function readSavedBook(bookId){
    getBookFromDB(bookId).then(b=>{
        if(b) openReader(b);
    }).catch(()=>{});
}

function deleteBook(bookId){
    safeDBOp(["books"], "readwrite", (tx, resolve)=>{
        tx.objectStore("books").delete(bookId);
        tx.oncomplete = ()=>{
            loadBookshelf();
            resolve();
        };
    }).catch(()=>{});
}

/* ============================================================
   リーダー
   ============================================================ */
function openReader(bookObj){
    document.querySelectorAll(".view-panel").forEach(p=>p.classList.remove("active"));
    document.getElementById("reader-view").classList.add("active");
    ima_yonderu_hon = bookObj;
    is_page_mode = false;
    ima_no_page = 0;
    pending_page_restore = null;
    is_showing_translation = false;
    document.getElementById("reading-title").textContent = bookObj.title;
    const rb = document.getElementById("reader-body");
    rb.classList.remove("paged");
    document.getElementById("page-nav").style.display = "none";
    document.getElementById("page-mode-btn").textContent = "めくりモード";
    const ts = document.getElementById("target-lang-select");
    if(ts) ts.value = bookObj.targetLang || 'ja';
    updateTranslationButtonLabel();
    renderReaderContent();
    updateReaderTranslationLabel();
    rb.scrollTop = 0;
    rb.scrollLeft = 0;
    restoreBookmark(bookObj);
    if(bookObj.paragraphs && bookObj.paragraphs.length){
        const total = bookObj.translationTotal || bookObj.paragraphs.length;
        const done = bookObj.translationDone || 0;
        if(done < total){
            active_translation_jobs[bookObj.id] = false;
            startBackgroundTranslation(bookObj.id);
        }
    }
}

function renderReaderContent(){
    if(!ima_yonderu_hon) return;
    const flow = document.getElementById("reader-flow");
    if(is_showing_translation) flow.innerHTML = buildTranslatedHtml(ima_yonderu_hon);
    else flow.innerHTML = ima_yonderu_hon.content || "";
    if(is_page_mode) requestAnimationFrame(()=>computePageLayout());
}

function toggleTranslationView(){
    if(!ima_yonderu_hon) return;
    const has = (ima_yonderu_hon.paragraphs && ima_yonderu_hon.paragraphs.length) || !!ima_yonderu_hon.contentTranslated;
    if(!has){
        showToast('この本には翻訳データがありません', 'warn');
        return;
    }
    is_showing_translation = !is_showing_translation;
    updateTranslationButtonLabel();
    renderReaderContent();
}
window.toggleTranslationView = toggleTranslationView;

function updateTranslationButtonLabel(){
    const btn = document.getElementById("translate-toggle-btn");
    if(btn) btn.textContent = is_showing_translation ? "原文で読む" : "翻訳で読む";
}

function updateReaderTranslationLabel(){
    const el = document.getElementById("translation-status-label");
    if(!el) return;
    if(!ima_yonderu_hon){
        el.textContent = "";
        return;
    }
    const b = ima_yonderu_hon;
    el.classList.remove('error','done');
    if(b.translationStatus === "translating"){
        const done = b.translationDone || 0;
        const total = b.translationTotal || (b.paragraphs ? b.paragraphs.length : 0);
        el.textContent = `翻訳中 ${done}/${total}`;
    } else if(b.translationStatus === "done"){
        el.textContent = "翻訳完了";
        el.classList.add('done');
    } else if(b.translationStatus === "error"){
        const done = b.translationDone || 0;
        const total = b.translationTotal || (b.paragraphs ? b.paragraphs.length : 0);
        el.textContent = `翻訳失敗 ${done}/${total}${b.lastError ? ' - ' + b.lastError : ''}`;
        el.classList.add('error');
    } else {
        el.textContent = "";
    }
}

async function changeTargetLang(newLang){
    if(!ima_yonderu_hon) return;
    if(ima_yonderu_hon.targetLang === newLang) return;
    if(!ima_yonderu_hon.paragraphs || !ima_yonderu_hon.paragraphs.length){
        showToast('この本は翻訳データに対応していません', 'warn');
        return;
    }
    const src = ima_yonderu_hon.sourceLang || 'en';
    if(src === newLang){
        showToast(`原文言語（${LANGUAGE_NAMES[src] || src}）と同じなので翻訳不要です`, 'warn');
        const ts = document.getElementById("target-lang-select");
        if(ts) ts.value = ima_yonderu_hon.targetLang || 'ja';
        return;
    }
    translation_generation[ima_yonderu_hon.id] = (translation_generation[ima_yonderu_hon.id] || 0) + 1;
    active_translation_jobs[ima_yonderu_hon.id] = false;
    ima_yonderu_hon.targetLang = newLang;
    ima_yonderu_hon.translatedTexts = new Array(ima_yonderu_hon.paragraphs.length).fill(null);
    ima_yonderu_hon.translationStatus = 'translating';
    ima_yonderu_hon.translationDone = 0;
    ima_yonderu_hon.translationTotal = ima_yonderu_hon.paragraphs.length;
    ima_yonderu_hon.lastError = null;
    await saveBookToDB(ima_yonderu_hon);
    is_showing_translation = true;
    updateTranslationButtonLabel();
    renderReaderContent();
    updateReaderTranslationLabel();
    startBackgroundTranslation(ima_yonderu_hon.id);
    showToast(`翻訳先を「${LANGUAGE_NAMES[newLang] || newLang}」に変更しました。再翻訳を開始します`, 'info');
}
window.changeTargetLang = changeTargetLang;

/* ============================================================
   めくりモード
   ============================================================ */
function togglePageMode(){
    is_page_mode = !is_page_mode;
    const rb = document.getElementById("reader-body");
    const flow = document.getElementById("reader-flow");
    const nav = document.getElementById("page-nav");
    const btn = document.getElementById("page-mode-btn");
    rb.classList.toggle("paged", is_page_mode);
    nav.style.display = is_page_mode ? "flex" : "none";
    btn.textContent = is_page_mode ? "スクロールに戻す" : "めくりモード";
    if(is_page_mode){
        requestAnimationFrame(()=>computePageLayout());
    } else {
        flow.style.columnWidth = "";
        flow.style.columnGap = "";
        flow.style.columnFill = "";
        rb.scrollLeft = 0;
    }
    scheduleBookmarkSave();
}
window.togglePageMode = togglePageMode;

function schedulePageRecompute(){
    if(!is_page_mode) return;
    clearTimeout(page_recompute_timer);
    page_recompute_timer = setTimeout(()=>computePageLayout(ima_no_page), 500);
}

function computePageLayout(keep){
    if(!is_page_mode) return;
    const rb = document.getElementById("reader-body");
    const flow = document.getElementById("reader-flow");
    const pw = rb.clientWidth;
    flow.style.columnWidth = `${pw}px`;
    flow.style.columnGap = `${gata_gap_haba}px`;
    flow.style.columnFill = "auto";
    const tw = flow.scrollWidth;
    zenbu_page_su = Math.max(1, Math.round(tw / (pw + gata_gap_haba)));
    const target = (typeof keep === "number") ? keep : 0;
    goToPage(target);
    if(pending_page_restore != null){
        goToPage(pending_page_restore);
        pending_page_restore = null;
    }
}

function turnPage(d){
    goToPage(ima_no_page + d);
}
window.turnPage = turnPage;

function goToPage(i){
    const rb = document.getElementById("reader-body");
    ima_no_page = Math.max(0, Math.min(zenbu_page_su - 1, i));
    rb.scrollLeft = ima_no_page * (rb.clientWidth + gata_gap_haba);
    const ind = document.getElementById("page-indicator");
    if(ind) ind.textContent = `${ima_no_page + 1} / ${zenbu_page_su}`;
    scheduleBookmarkSave();
}

document.getElementById("reader-body").addEventListener("click", (ev)=>{
    if(!is_page_mode) return;
    const rb = ev.currentTarget;
    const rect = rb.getBoundingClientRect();
    const x = (ev.clientX - rect.left) / rect.width;
    if(x < 0.25) turnPage(-1);
    else if(x > 0.75) turnPage(1);
});

document.getElementById("reader-body").addEventListener("scroll", ()=>{
    if(is_page_mode) return;
    scheduleBookmarkSave();
});

document.addEventListener("keydown", (ev)=>{
    if(!is_page_mode) return;
    if(ev.key === "ArrowRight") turnPage(1);
    if(ev.key === "ArrowLeft") turnPage(-1);
});

window.addEventListener("resize", ()=>{
    if(is_page_mode) computePageLayout(ima_no_page);
});

/* ============================================================
   タブ切替・表示
   ============================================================ */
function switchTab(tabName){
    if(document.getElementById("reader-view").classList.contains("active")){
        saveBookmarkNow().catch(()=>{});
    }
    document.getElementById("reader-view").classList.remove("active");
    document.querySelectorAll(".view-panel").forEach(p=>p.classList.remove("active"));
    if(tabName === "search"){
        document.getElementById("search-view").classList.add("active");
    } else if(tabName === "bookshelf"){
        document.getElementById("bookshelf-view").classList.add("active");
        loadBookshelf();
    }
}
window.switchTab = switchTab;

function toggleWritingMode(){
    const rb = document.getElementById("reader-body");
    is_vertical_mode = !is_vertical_mode;
    rb.classList.toggle("vertical", is_vertical_mode);
    if(is_page_mode) computePageLayout(ima_no_page);
}
window.toggleWritingMode = toggleWritingMode;

function changeFontSize(d){
    current_font_size = Math.max(12, Math.min(36, current_font_size + d));
    document.getElementById("reader-body").style.fontSize = `${current_font_size}px`;
    if(is_page_mode) computePageLayout(ima_no_page);
}
window.changeFontSize = changeFontSize;

function setTheme(t){
    document.body.classList.remove('dark-mode','sepia-mode');
    if(t === "dark") document.body.classList.add('dark-mode');
    if(t === "sepia") document.body.classList.add('sepia-mode');
}
window.setTheme = setTheme;

function escapeHtml(str){
    if(str == null) return "";
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* ============================================================
   起動処理
   ============================================================ */
window.onload = async ()=>{
    try{
        await initDB();
    }catch(err){
        showToast('DB初期化失敗: ' + err.message, 'error', 15000);
        return;
    }

    resumePendingTranslations();

    setTimeout(async ()=>{
        try{
            const cached = await getCacheFromDB('aozora_catalog');
            if(cached && cached.value && cached.value.length > 100){
                console.log('[青空文庫] キャッシュ済みのため先読み不要');
                return;
            }
            console.log('[青空文庫] バックグラウンド先読み開始...');
            await fetchAozoraCatalog();
        }catch(e){
            console.warn('[青空文庫] 先読み失敗:', e.message);
        }
    }, 2000);
};

window.addEventListener('error', (ev)=>{
    const msg = ev.message || 'unknown';
    if(msg.includes('database connection is closing')) return;
    showErrorBanner('予期しないエラーが発生しました', msg);
    try{
        showToast('予期しないエラー: ' + msg, 'error', 12000);
    }catch(e){}
});

window.addEventListener('unhandledrejection', (ev)=>{
    try{
        const msg = (ev.reason && ev.reason.message) ? ev.reason.message : String(ev.reason);
        if(msg.includes('database connection is closing')) return;
        showErrorBanner('未処理のPromiseエラーが発生しました', msg);
        showToast('未処理のPromiseエラー: ' + msg, 'error', 12000);
    }catch(e){}
});
</script>
