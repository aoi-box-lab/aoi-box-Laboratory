}
function getOriginalHtml(){ if(!ima_yonderu_hon) return ""; if(readerHtmlCache.bookId !== ima_yonderu_hon.id) readerHtmlCache = { bookId: ima_yonderu_hon.id, original: null, translated: null }; if(readerHtmlCache.original === null) readerHtmlCache.original = buildOriginalHtml(ima_yonderu_hon); return readerHtmlCache.original; }
function getTranslatedHtml(){ if(!ima_yonderu_hon) return ""; if(readerHtmlCache.bookId !== ima_yonderu_hon.id) readerHtmlCache = { bookId: ima_yonderu_hon.id, original: null, translated: null }; if(readerHtmlCache.translated === null) readerHtmlCache.translated = buildTranslatedHtml(ima_yonderu_hon); return readerHtmlCache.translated; }
function renderReaderContent(){
    if(!ima_yonderu_hon) return;
    const flow = document.getElementById("reader-flow");
    const html = is_showing_translation ? getTranslatedHtml() : getOriginalHtml();
    const tpl = document.createElement('template'); tpl.innerHTML = html;
    flow.replaceChildren(tpl.content);
    if(is_book_mode) requestAnimationFrame(()=>computePageLayout());
}
function toggleTranslationView(){
    if(!ima_yonderu_hon) return;
    const has = (ima_yonderu_hon.paragraphs && ima_yonderu_hon.paragraphs.length) || !!ima_yonderu_hon.contentTranslated;
    if(!has){ showToast('翻訳データがありません', 'warn'); return; }
    is_showing_translation = !is_showing_translation;
    updateTranslationButtonLabel();
    const flow = document.getElementById("reader-flow");
    flow.innerHTML = '<div class="loading-msg">切り替え中...</div>';
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ renderReaderContent(); }); });
}
window.toggleTranslationView = toggleTranslationView;
function updateTranslationButtonLabel(){ const btn = document.getElementById("translate-toggle-btn"); if(btn) btn.textContent = is_showing_translation ? "原文で読む" : "翻訳で読む"; }
function updateReaderTranslationLabel(){
    const el = document.getElementById("translation-status-label");
    if(!el) return;
    if(!ima_yonderu_hon){ el.textContent = ""; return; }
    const b = ima_yonderu_hon;
    el.classList.remove('error','done');
    if(b.translationStatus === "translating"){ const done = b.translationDone || 0; const total = b.translationTotal || (b.paragraphs ? b.paragraphs.length : 0); el.textContent = `翻訳中 ${done}/${total}`; }
    else if(b.translationStatus === "done"){ el.textContent = "翻訳完了"; el.classList.add('done'); }
    else if(b.translationStatus === "error"){ const done = b.translationDone || 0; const total = b.translationTotal || (b.paragraphs ? b.paragraphs.length : 0); el.textContent = `翻訳失敗 ${done}/${total}${b.lastError ? ' - ' + b.lastError : ''}`; el.classList.add('error'); }
    else el.textContent = "";
}
async function changeTargetLang(newLang){
    if(!ima_yonderu_hon) return;
    if(ima_yonderu_hon.targetLang === newLang) return;
    if(!ima_yonderu_hon.paragraphs || !ima_yonderu_hon.paragraphs.length){ showToast('翻訳データなし', 'warn'); return; }
    const src = ima_yonderu_hon.sourceLang || 'en';
    if(src === newLang){ showToast('原文と同じ言語です', 'warn'); const ts = document.getElementById("settings-target-lang"); if(ts) ts.value = ima_yonderu_hon.targetLang || 'ja'; return; }
    translation_generation[ima_yonderu_hon.id] = (translation_generation[ima_yonderu_hon.id] || 0) + 1;
    active_translation_jobs[ima_yonderu_hon.id] = false;
    ima_yonderu_hon.targetLang = newLang;
    ima_yonderu_hon.translatedTexts = new Array(ima_yonderu_hon.paragraphs.length).fill(null);
    ima_yonderu_hon.translationStatus = 'translating';
    ima_yonderu_hon.translationDone = 0;
    ima_yonderu_hon.translationTotal = ima_yonderu_hon.paragraphs.length;
    ima_yonderu_hon.lastError = null;
    await saveBookToDB(ima_yonderu_hon);
    is_showing_translation = true;
    readerHtmlCache.translated = null;
    updateTranslationButtonLabel(); renderReaderContent(); updateReaderTranslationLabel();
    startBackgroundTranslation(ima_yonderu_hon.id);
    showToast(`翻訳先を「${LANGUAGE_NAMES[newLang] || newLang}」に変更`, 'info');
}
window.changeTargetLang = changeTargetLang;

/* ============================================================
   本モード
   ============================================================ */
function computePageLayout(keep){
    if(!is_book_mode) return;
    const rb = document.getElementById("reader-body");
    const flow = document.getElementById("reader-flow");
    const style = getComputedStyle(rb);
    const padLeft = parseFloat(style.paddingLeft) || 0;
    const padRight = parseFloat(style.paddingRight) || 0;
    const padTop = parseFloat(style.paddingTop) || 0;
    const padBottom = parseFloat(style.paddingBottom) || 0;
    const contentW = Math.max(50, rb.clientWidth - padLeft - padRight);
    const contentH = Math.max(50, rb.clientHeight - padTop - padBottom);
    flow.style.transition = 'none'; flow.style.transform = 'none';
    flow.style.writingMode = (readingDirection === 'rtl') ? 'vertical-rl' : 'horizontal-tb';
    flow.style.columnGap = `${gata_gap_haba}px`; flow.style.columnFill = 'auto'; flow.style.height = `${contentH}px`;
    flow.style.columnCount = ''; flow.style.columnWidth = `${contentW}px`; flow.style.width = 'auto';
    const measured = Math.max(flow.scrollWidth, flow.offsetWidth, contentW);
    const step = contentW + gata_gap_haba;
    zenbu_page_su = Math.max(1, Math.round((measured + gata_gap_haba) / step));
    const totalW = zenbu_page_su * contentW + (zenbu_page_su - 1) * gata_gap_haba;
    flow.style.columnWidth = `${contentW}px`; flow.style.columnCount = String(zenbu_page_su); flow.style.width = `${totalW}px`;
    let target = (typeof keep === 'number') ? keep : ima_no_page;
    if(pending_page_restore != null){ target = pending_page_restore; pending_page_restore = null; }
    ima_no_page = Math.max(0, Math.min(zenbu_page_su - 1, target));
    applyPageTransform(ima_no_page, false);
    updatePageIndicator();
}
function applyPageTransform(pageIndex, animate){
    const rb = document.getElementById("reader-body");
    const flow = document.getElementById("reader-flow");
    const style = getComputedStyle(rb);
    const contentW = rb.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
    const totalW = zenbu_page_su * contentW + (zenbu_page_su - 1) * gata_gap_haba;
    let tx;
    if(readingDirection === 'rtl'){ tx = -(totalW - (pageIndex + 1) * contentW - pageIndex * gata_gap_haba); }
    else { tx = -pageIndex * (contentW + gata_gap_haba); }
    tx = Math.round(tx);
    const newTransform = `translate3d(${tx}px, 0, 0)`;
    if(animate && flow.style.transform !== newTransform){ flow.style.transition = 'transform .38s cubic-bezier(.33,.1,.25,1)'; requestAnimationFrame(()=>{ flow.style.transform = newTransform; }); clearTimeout(flow._transTimer); flow._transTimer = setTimeout(()=>{ flow.style.transition = 'none'; }, 420); }
    else { flow.style.transition = 'none'; flow.style.transform = newTransform; }
}
function updatePageIndicator(){ const ind = document.getElementById("page-indicator"); if(ind) ind.textContent = `${ima_no_page + 1} / ${zenbu_page_su}`; }
function playPageTurnEffect(direction){ const rb = document.getElementById("reader-body"); if(!rb) return; rb.classList.remove('turning-next', 'turning-prev'); void rb.offsetWidth; rb.classList.add(direction === 'next' ? 'turning-next' : 'turning-prev'); setTimeout(()=>{ rb.classList.remove('turning-next', 'turning-prev'); }, 420); }
function schedulePageRecompute(){ if(!is_book_mode) return; clearTimeout(page_recompute_timer); page_recompute_timer = setTimeout(()=>computePageLayout(ima_no_page), 400); }
function turnPage(d){ goToPage(ima_no_page + d); }
window.turnPage = turnPage;
function goToPage(i){
    if(!is_book_mode) return;
    const newPage = Math.max(0, Math.min(zenbu_page_su - 1, i));
    if(newPage === ima_no_page) return;
    const direction = newPage > ima_no_page ? 'next' : 'prev';
    ima_no_page = newPage;
    applyPageTransform(ima_no_page, true);
    updatePageIndicator();
    scheduleBookmarkSave();
    playPageTurnEffect(direction);
}
document.getElementById("reader-body").addEventListener("click", (ev)=>{
    if(!is_book_mode) return;
    if(appSettings.bookFlipStyle !== 'edge' && appSettings.bookFlipStyle !== 'both') return;
    const rb = ev.currentTarget;
    const rect = rb.getBoundingClientRect();
    const x = (ev.clientX - rect.left) / rect.width;
    if(readingDirection === 'rtl'){ if(x < 0.25) turnPage(1); else if(x > 0.75) turnPage(-1); }
    else { if(x < 0.25) turnPage(-1); else if(x > 0.75) turnPage(1); }
});
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
document.getElementById("reader-body").addEventListener("touchstart", (e)=>{
    if(!is_book_mode) return;
    if(e.touches.length !== 1) return;
    if(appSettings.bookFlipStyle !== 'swipe' && appSettings.bookFlipStyle !== 'both') return;
    touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; touchStartTime = Date.now();
}, {passive: true});
document.getElementById("reader-body").addEventListener("touchend", (e)=>{
    if(!is_book_mode) return;
    if(appSettings.bookFlipStyle !== 'swipe' && appSettings.bookFlipStyle !== 'both') return;
    const touch = e.changedTouches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    const dt = Date.now() - touchStartTime;
    if(dt > 800) return;
    if(Math.abs(dx) < 50) return;
    if(Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if(readingDirection === 'rtl'){ if(dx > 0) turnPage(1); else turnPage(-1); }
    else { if(dx < 0) turnPage(1); else turnPage(-1); }
}, {passive: true});
document.getElementById("reader-body").addEventListener("scroll", ()=>{ if(is_book_mode) return; scheduleBookmarkSave(); });
document.addEventListener("keydown", (ev)=>{
    if(!is_book_mode) return;
    if(ev.target && ev.target.closest && ev.target.closest('input,textarea,select')) return;
    if(readingDirection === 'rtl'){ if(ev.key === "ArrowLeft") turnPage(1); if(ev.key === "ArrowRight") turnPage(-1); }
    else { if(ev.key === "ArrowRight") turnPage(1); if(ev.key === "ArrowLeft") turnPage(-1); }
});
let _resizeTimer = null;
function handleViewportChange(){ clearTimeout(_resizeTimer); _resizeTimer = setTimeout(()=>{ if(is_book_mode){ computePageLayout(ima_no_page); } }, 150); }
window.addEventListener("resize", handleViewportChange, {passive:true});
window.addEventListener("orientationchange", ()=>setTimeout(handleViewportChange, 200));
if(window.visualViewport){ window.visualViewport.addEventListener("resize", handleViewportChange, {passive:true}); }

/* ============================================================
   タブ切替
   ============================================================ */
function switchTab(tabName){
    if(document.getElementById("reader-view").classList.contains("active")){ saveBookmarkNow().catch(()=>{}); }
    document.getElementById("reader-view").classList.remove("active");
    document.querySelectorAll(".view-panel").forEach(p=>p.classList.remove("active"));
    closeSettings();
    if(tabName === "search") document.getElementById("search-view").classList.add("active");
    else if(tabName === "bookshelf"){ document.getElementById("bookshelf-view").classList.add("active"); loadBookshelf(); }
}
window.switchTab = switchTab;
function changeFontSize(d){ current_font_size = Math.max(12, Math.min(36, current_font_size + d)); updateReaderFontSize(); if(is_book_mode) computePageLayout(ima_no_page); }
window.changeFontSize = changeFontSize;

/* ============================================================
   起動処理
   ============================================================ */
window.onload = async ()=>{
    loadSettings();
    applyTheme(appSettings.theme);
    applyFontFamily();
    updateSettingsUI();
    updateSortDirectionButton();
    try{ await initDB(); }catch(err){ showToast('DB初期化失敗: ' + err.message, 'error', 15000); return; }
    resumePendingTranslations();
    setTimeout(()=>{ redownloadOutdatedBooks().catch(e=>console.warn('[再DL] 失敗:', e)); }, 3000);
    setTimeout(async ()=>{ try{ const cached = await getCacheFromDB(CATALOG_CACHE_KEY); if(cached && cached.value && cached.value.length > 100 && cached.value[0].zipName !== undefined){ return; } await fetchAozoraCatalog(); }catch(e){} }, 2000);
    setTimeout(async ()=>{ try{ const count = await countOutdatedBooks(); if(count > 0) showToast(`本棚に ${count}件 の「要更新」本があります。`, 'info', 12000); }catch(e){} }, 5000);
};
window.addEventListener('error', (ev)=>{
    const msg = ev.message || 'unknown';
    if(msg.includes('database connection is closing')) return;
    showErrorBanner('どえらいエラーが発生しました', msg);
    try{ showToast('どえらいエラー: ' + msg, 'error', 12000); }catch(e){}
});
window.addEventListener('unhandledrejection', (ev)=>{
    try{
        const msg = (ev.reason && ev.reason.message) ? ev.reason.message : String(ev.reason);
        if(msg.includes('database connection is closing')) return;
        showErrorBanner('未処理のPromiseエラーが発生しました', msg);
        showToast('未処理のPromiseエラー: ' + msg, 'error', 12000);
    }catch(e){}
});
</script>
