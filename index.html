<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gutenberg Solari Reader</title>
    <style>
        :root {
            --bg-color: #f7f6f2;
            --text-color: #2b2b2b;
            --accent-color: #4a6fa5;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --font-family: 'Georgia', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
        }

        body.dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #d1d1d1;
            --accent-color: #6b8cce;
            --card-bg: #282828;
            --border-color: #404040;
        }

        body.sepia-mode {
            --bg-color: #f4ecd8;
            --text-color: #5b4636;
            --accent-color: #8c6d53;
            --card-bg: #fbf0d9;
            --border-color: #e2d7c0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            transition: background-color 0.3s, color 0.3s;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 12px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        h1 { font-size: 1.2rem; font-weight: normal; letter-spacing: 1px; }

        .nav-buttons button {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            margin-left: 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .view-panel {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: none;
        }
        .view-panel.active { display: block; }

        .search-box {
            display: flex;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto 20px auto;
        }

        .mode-toggle { display: flex; flex-shrink: 0; }

        .mode-toggle button {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            font-size: 0.8rem;
        }
        .mode-toggle button:first-child { border-radius: 4px 0 0 4px; }
        .mode-toggle button:last-child { border-radius: 0 4px 4px 0; border-left: none; }
        .mode-toggle button.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
        .mode-toggle button:not(.active) { opacity: 0.45; }

        .search-box input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
        }

        .search-box button {
            padding: 10px 20px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* テーブルから overflow:hidden を外した。これがあると3点メニューが
           テーブルの境界で切り取られてしまうため。角丸はセル側で再現する */
        .results-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .results-table thead tr:first-child th:first-child { border-top-left-radius: 6px; }
        .results-table thead tr:first-child th:last-child { border-top-right-radius: 6px; }
        .results-table tbody tr:last-child td:first-child { border-bottom-left-radius: 6px; }
        .results-table tbody tr:last-child td:last-child { border-bottom-right-radius: 6px; }

        .results-table th, .results-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .results-table th { background-color: rgba(0,0,0,0.03); font-weight: bold; }
        .results-table tr:hover { background-color: rgba(0,0,0,0.02); cursor: pointer; }

        .id-cell { display: flex; align-items: center; gap: 10px; }

        .drag-handle {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 16px;
            cursor: grab;
            flex-shrink: 0;
        }
        .drag-handle:active { cursor: grabbing; }
        .drag-handle .bar {
            height: 2px;
            background: var(--text-color);
            opacity: 0.4;
            border-radius: 1px;
        }

        .results-table tr.drag-over-row {
            outline: 2px dashed var(--accent-color);
            outline-offset: -2px;
        }

        .menu-wrap { position: relative; display: inline-block; }

        .dots-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            line-height: 1;
            cursor: pointer;
            color: var(--text-color);
            padding: 4px 10px;
        }

        /* 3点メニュー。position: fixed にして、親要素の overflow や
           スタッキングコンテキストの影響を受けないようにした。
           座標はJS側でボタンのgetBoundingClientRectから計算してセットする */
        .row-menu {
            display: none;
            position: fixed;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            z-index: 5000;
            min-width: 170px;
            overflow: hidden;
        }
        .row-menu.active { display: block; }
        .row-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 14px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-color);
            font-size: 0.9rem;
        }
        .row-menu button:hover { background: rgba(0,0,0,0.05); }

        #reader-view {
            flex: 1;
            display: none;
            flex-direction: column;
            height: 100%;
            position: relative;
        }
        #reader-view.active { display: flex; }

        .reader-toolbar {
            padding: 8px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }
        .reader-toolbar button {
            padding: 4px 10px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 4px;
            cursor: pointer;
        }

        .reader-content {
            flex: 1;
            padding: 40px;
            overflow: auto;
            line-height: 1.8;
            font-size: 1.1rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }
        .reader-content.vertical {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            max-width: none;
            height: 100%;
            padding: 40px 60px;
        }

        #reader-body.paged {
            overflow: hidden;
            scroll-behavior: smooth;
            cursor: pointer;
        }
        #reader-flow { height: 100%; }

        #page-nav {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 8px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }
        #page-nav button {
            padding: 4px 14px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 4px;
            cursor: pointer;
        }

        .status-msg {
            text-align: center;
            padding: 20px;
            font-size: 0.95rem;
            opacity: 0.8;
            font-weight: bold;
        }

        .trans-badge {
            font-size: 0.8rem;
            color: var(--accent-color);
            white-space: nowrap;
        }
        .trans-badge.error { color: #d9534f; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 9000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }

        .modal-box {
            background: var(--card-bg);
            color: var(--text-color);
            padding: 26px 30px;
            border-radius: 8px;
            max-width: 320px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .modal-box p { margin-bottom: 20px; line-height: 1.6; }
        .modal-buttons { display: flex; gap: 10px; justify-content: center; }
        .modal-buttons button {
            padding: 8px 20px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 0.9rem;
        }
        .modal-buttons button.danger { background: #d9534f; color: #fff; border-color: #d9534f; }
    </style>
</head>
<body>

    <header>
        <h1>Solari Gutenberg Reader (NDL-Powered)</h1>
        <div class="nav-buttons">
            <button onclick="switchTab('search')">検索</button>
            <button onclick="switchTab('bookshelf')">本棚</button>
        </div>
    </header>

    <div class="container">
        <!-- 検索タブ -->
        <div id="search-view" class="view-panel active">
            <div class="search-box">
                <div class="mode-toggle">
                    <button id="mode-title-btn" class="active" onclick="setSearchMode('title')">作品</button>
                    <button id="mode-author-btn" onclick="setSearchMode('author')">著者</button>
                </div>
                <input type="text" id="search-input" placeholder="作品名（・がなくてもいけるようにした！）">
                <button onclick="execSearch()">検索実行</button>
            </div>
            <div id="search-status" class="status-msg"></div>
            <table class="results-table" id="results-table" style="display:none;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>タイトル</th>
                        <th>著者</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="results-tbody"></tbody>
            </table>
        </div>

        <!-- 本棚タブ -->
        <div id="bookshelf-view" class="view-panel">
            <h2>保存済み作品</h2>
            <div id="bookshelf-status" class="status-msg"></div>
            <table class="results-table" id="bookshelf-table" style="display:none;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>タイトル</th>
                        <th>著者</th>
                        <th>状態</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="bookshelf-tbody"></tbody>
            </table>
        </div>

        <!-- 読書画面 -->
        <div id="reader-view">
            <div class="reader-toolbar">
                <button onclick="toggleWritingMode()">縦横切替</button>
                <button onclick="changeFontSize(1)">拡大</button>
                <button onclick="changeFontSize(-1)">縮小</button>
                <button id="page-mode-btn" onclick="togglePageMode()">めくりモード</button>
                <button id="translate-toggle-btn" onclick="toggleTranslationView()">翻訳で読む</button>
                <button onclick="setTheme('light')">Light</button>
                <button onclick="setTheme('sepia')">Sepia</button>
                <button onclick="setTheme('dark')">Dark</button>
                <span id="translation-status-label" class="trans-badge"></span>
                <span id="reading-title" style="margin-left:auto; font-weight:bold;"></span>
                <button onclick="switchTab('bookshelf')" style="margin-left:15px;">閉じる</button>
            </div>
            <div id="page-nav">
                <button onclick="turnPage(-1)">‹ 前のページ</button>
                <span id="page-indicator">1 / 1</span>
                <button onclick="turnPage(1)">次のページ ›</button>
            </div>
            <div id="reader-body" class="reader-content">
                <div id="reader-flow"></div>
            </div>
        </div>
    </div>

    <!-- 削除確認ポップアップ -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-box">
            <p>削除しますか？</p>
            <div class="modal-buttons">
                <button onclick="closeConfirmModal()">いいえ</button>
                <button class="danger" onclick="executeConfirmedDelete()">はい</button>
            </div>
        </div>
    </div>

<script>
const maji_de_proxy_base = "https://aoi-box-lab.idosenpai.workers.dev/?url=";

let maji_de_db = null;
let current_font_size = 18;
let is_vertical_mode = false;
let v_project_cache = {};

let search_mode_v = "title";
let drag_zaku_id = null;
let menu_char_aznable_id = null;
let delete_kill_confirm_id = null;

const gata_gap_haba = 60;
let is_page_mode = false;
let ima_no_page = 0;
let zenbu_page_su = 1;
let is_showing_translation = false;
let ima_yonderu_hon = null;

let active_translation_jobs = {};
let page_recompute_timer = null;

// 同時翻訳の並列度。高すぎるとプロキシに嫌われるので8くらいが塩梅
const TRANSLATION_CONCURRENCY = 8;

function initDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open("SolariGutenbergDB", 1);
        req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains("books")) {
                db.createObjectStore("books", { keyPath: "id" });
            }
        };
        req.onsuccess = (e) => { maji_de_db = e.target.result; resolve(maji_de_db); };
        req.onerror = (e) => { console.error("DB起動失敗！", e); reject(e); };
    });
}

function getBookFromDB(bookId) {
    return new Promise((resolve, reject) => {
        const tx = maji_de_db.transaction(["books"], "readonly");
        const rq = tx.objectStore("books").get(bookId);
        rq.onsuccess = () => resolve(rq.result || null);
        rq.onerror = () => reject(rq.error);
    });
}
function getAllBooksFromDB() {
    return new Promise((resolve, reject) => {
        const tx = maji_de_db.transaction(["books"], "readonly");
        const rq = tx.objectStore("books").getAll();
        rq.onsuccess = () => resolve(rq.result || []);
        rq.onerror = () => reject(rq.error);
    });
}
function saveBookToDB(book) {
    return new Promise((resolve, reject) => {
        const tx = maji_de_db.transaction(["books"], "readwrite");
        tx.objectStore("books").put(book);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}

function checkChosakukenSafe(authorDeathYear) {
    if (!authorDeathYear) return false;
    return (new Date().getFullYear() - authorDeathYear) >= 80;
}

function setSearchMode(mode) {
    search_mode_v = mode;
    document.getElementById("mode-title-btn").classList.toggle("active", mode === "title");
    document.getElementById("mode-author-btn").classList.toggle("active", mode === "author");
    const in_e = document.getElementById("search-input");
    in_e.placeholder = mode === "title"
        ? "作品名（・がなくてもいけるようにした！）"
        : "著者名（フルネームじゃなくても多分いける）";
}

async function getOriginalTitleFromNDL(jpTitle) {
    if (/^[a-zA-Z0-9\s]+$/.test(jpTitle)) return null;
    try {
        const ndl_api_yobidashi = `https://ndlsearch.ndl.go.jp/api/opensearch?title=${encodeURIComponent(jpTitle)}&cnt=10`;
        const res = await fetch(maji_de_proxy_base + encodeURIComponent(ndl_api_yobidashi));
        const xml = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(xml, 'application/xml');
        const items = [...doc.getElementsByTagName('item')];
        if (!items.length) return null;

        for (const item of items) {
            const text = item.textContent;
            const pats = [
                /原タイトル\s*[:：]\s*([^\n\r]+)/,
                /原題\s*[:：]\s*([^\n\r]+)/,
                /Original title\s*[:：]\s*([^\n\r]+)/i,
                /別書名\s*[:：]\s*([^\n\r]+)/,
            ];
            for (const p of pats) {
                const m = text.match(p);
                if (m) {
                    const cand = m[1].trim().replace(/[。．.\s]+$/, '');
                    if (cand && !cand.includes(jpTitle)) return cand;
                }
            }
            const latin = text.match(/[A-Z][A-Za-z'’\-]+(?:\s+(?:of|the|and|in|a|an|to|[A-Z][A-Za-z'’\-]+)){2,}/g);
            if (latin && latin.length) {
                latin.sort((a, b) => b.length - a.length);
                return latin[0].trim();
            }
        }
    } catch (err) { console.warn("NDLサーチ失敗", err); }
    return null;
}

// 著者名の英語化。indexpageidsで検索スコア順を維持するのが超重要。
// ここをObject.valuesに戻すと、またコナンドイル→アガサクリスティみたいな
// カオスが再発するので絶対に触らないこと
async function getAuthorEnglishNameFromWikipedia(jpName) {
    if (/^[a-zA-Z0-9\s]+$/.test(jpName)) return null;
    try {
        const wiki_api = `https://ja.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(jpName)}&gsrlimit=5&prop=langlinks&lllang=en&format=json&origin=*&indexpageids=1`;
        const res = await fetch(maji_de_proxy_base + encodeURIComponent(wiki_api));
        const data = await res.json();

        const query = data && data.query;
        if (!query || !query.pages) return null;

        const ids = (query.pageids && query.pageids.length) ? query.pageids : Object.keys(query.pages);

        for (const id of ids) {
            const page = query.pages[id];
            if (!page) continue;
            if (page.title && /曖昧さ回避|一覧|の作品|作品一覧/.test(page.title)) continue;
            const ll = page.langlinks;
            if (ll && ll[0] && ll[0]["*"]) return ll[0]["*"];
        }
        return null;
    } catch (err) {
        console.warn("Wikipediaの言語間リンク取得コケた", err);
        return null;
    }
}

async function translateToEnglish(jpText) {
    if (/^[a-zA-Z0-9\s]+$/.test(jpText)) return jpText;
    try {
        const nen_ryou = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ja&tl=en&dt=t&q=${encodeURIComponent(jpText)}`;
        const res = await fetch(maji_de_proxy_base + encodeURIComponent(nen_ryou));
        const data = await res.json();
        if (data && data[0] && data[0][0] && data[0][0][0]) return data[0][0][0];
    } catch (err) { console.warn("Google翻訳も死んだ", err); }
    return jpText;
}

function splitTextRoughly(text, maxLen) {
    const chunks = [];
    let rest = text;
    while (rest.length > maxLen) {
        let cut = rest.lastIndexOf(". ", maxLen);
        if (cut < maxLen * 0.5) cut = maxLen;
        chunks.push(rest.slice(0, cut + 1));
        rest = rest.slice(cut + 1);
    }
    if (rest.length > 0) chunks.push(rest);
    return chunks;
}

// 失敗時は null を返す。原文を返しちゃうと「翻訳済み」扱いになって
// 二度とリトライされなくなるので、null と区別する
async function translateChunkToJapanese(text) {
    try {
        const q_url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ja&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(maji_de_proxy_base + encodeURIComponent(q_url));
        const data = await res.json();
        if (data && data[0]) return data[0].map(seg => seg[0]).join("");
    } catch (err) { console.warn("段落翻訳コケた", err); }
    return null;
}

async function translateParagraphToJapanese(text) {
    if (!text || !text.trim()) return text;
    const MAX_LEN = 1500;
    if (text.length <= MAX_LEN) return await translateChunkToJapanese(text);
    const chunks = splitTextRoughly(text, MAX_LEN);
    let out = "";
    for (const c of chunks) {
        const t = await translateChunkToJapanese(c);
        if (t == null) return null;
        out += t;
    }
    return out;
}

// 先頭と末尾から交互に取り出すキューを作る。
// [0, n-1, 1, n-2, 2, n-3, ...] の順で並ぶ
function buildBidirectionalQueue(total) {
    const q = [];
    let f = 0, b = total - 1;
    while (f <= b) {
        if (f === b) { q.push(f); break; }
        q.push(f);
        q.push(b);
        f++; b--;
    }
    return q;
}

function buildTranslatedHtml(book) {
    if (book.paragraphs && book.paragraphs.length) {
        const texts = book.translatedTexts || [];
        return book.paragraphs.map((p, i) => {
            const t = texts[i];
            const is_un = (t == null);
            return `<${p.tag} data-pidx="${i}"${is_un ? ' class="untranslated"' : ''}>${escapeHtml(is_un ? p.text : t)}</${p.tag}>`;
        }).join("");
    }
    return book.contentTranslated || book.content || "";
}

// バックグラウンド翻訳本体。
// 双方向キュー＋並列ワーカーで、各段落が完了した瞬間にUIへ反映する
async function startBackgroundTranslation(bookId) {
    if (active_translation_jobs[bookId]) return;
    active_translation_jobs[bookId] = true;

    try {
        const book = await getBookFromDB(bookId);
        if (!book || !book.paragraphs || !book.paragraphs.length) return;

        const total = book.paragraphs.length;
        if (!Array.isArray(book.translatedTexts) || book.translatedTexts.length !== total) {
            book.translatedTexts = new Array(total).fill(null);
        }

        book.translationStatus = "translating";
        book.translationTotal = total;
        book.translationDone = book.translatedTexts.filter(t => t != null).length;

        // 双方向キューを作って、未翻訳分だけ抽出
        const pending = buildBidirectionalQueue(total).filter(i => book.translatedTexts[i] == null);

        let qi = 0;
        let last_save = 0;
        const retry_list = [];

        async function worker() {
            while (qi < pending.length) {
                const idx = pending[qi++];
                if (book.translatedTexts[idx] != null) continue;

                const t = await translateParagraphToJapanese(book.paragraphs[idx].text);
                if (t != null) {
                    book.translatedTexts[idx] = t;
                    book.translationDone = (book.translationDone || 0) + 1;
                    // 1段落完了ごとに即UI反映
                    onTranslationTick(book);
                    // DB書き込みは1秒に1回までに間引く（配列丸ごと書くので重い）
                    if (Date.now() - last_save > 1000) {
                        last_save = Date.now();
                        saveBookToDB(book);
                    }
                } else {
                    retry_list.push(idx);
                }
            }
        }

        await Promise.all(Array.from({ length: TRANSLATION_CONCURRENCY }, () => worker()));

        // 失敗分だけもう1周
        for (const idx of retry_list) {
            if (book.translatedTexts[idx] != null) continue;
            const t = await translateParagraphToJapanese(book.paragraphs[idx].text);
            if (t != null) {
                book.translatedTexts[idx] = t;
                book.translationDone = (book.translationDone || 0) + 1;
                onTranslationTick(book);
            }
        }

        book.translationDone = book.translatedTexts.filter(t => t != null).length;
        book.translationStatus = (book.translationDone >= total) ? "done" : "error";

        await saveBookToDB(book);
        onTranslationTick(book);
    } catch (err) {
        console.error("翻訳ジョブ失敗", err);
        try {
            const b = await getBookFromDB(bookId);
            if (b) {
                b.translationStatus = "error";
                await saveBookToDB(b);
                onTranslationTick(b);
            }
        } catch (e) {}
    } finally {
        active_translation_jobs[bookId] = false;
    }
}

// 1段落完了するたびに呼ばれる。開いてる本と本棚の表示を同期
function onTranslationTick(book) {
    if (ima_yonderu_hon && ima_yonderu_hon.id === book.id) {
        ima_yonderu_hon.translatedTexts = book.translatedTexts;
        ima_yonderu_hon.translationStatus = book.translationStatus;
        ima_yonderu_hon.translationDone = book.translationDone;
        ima_yonderu_hon.translationTotal = book.translationTotal;
        if (!ima_yonderu_hon.paragraphs) ima_yonderu_hon.paragraphs = book.paragraphs;

        // 翻訳ビュー中なら該当段落だけ即書き換え
        if (is_showing_translation) {
            applyTranslationToDom(book);
            if (is_page_mode) schedulePageRecompute();
        }
        updateReaderTranslationLabel();
    }
    updateBookshelfRowStatus(book);
}

// 翻訳済みになった段落だけをDOMへ差し込む。
// innerHTMLを丸ごと書き換えるとスクロールが飛ぶので要素単位で更新する
function applyTranslationToDom(book) {
    if (!ima_yonderu_hon || ima_yonderu_hon.id !== book.id) return;
    if (!is_showing_translation) return;
    if (!book.paragraphs) return;

    const flow = document.getElementById("reader-flow");
    const texts = book.translatedTexts || [];
    const children = flow.children;

    for (let i = 0; i < book.paragraphs.length && i < children.length; i++) {
        const el = children[i];
        if (texts[i] != null && el.classList.contains("untranslated")) {
            el.textContent = texts[i];
            el.classList.remove("untranslated");
        }
    }
}

function updateBookshelfRowStatus(book) {
    const el = document.querySelector(`[data-status-for="${book.id}"]`);
    if (!el) return;
    el.textContent = formatTranslationStatus(book);
    el.classList.toggle("error", book.translationStatus === "error");
}

function formatTranslationStatus(book) {
    if (book.translationStatus === "translating") {
        const done = book.translationDone || 0;
        const total = book.translationTotal || (book.paragraphs ? book.paragraphs.length : 0);
        return `翻訳中 ${done}/${total}`;
    }
    if (book.translationStatus === "done") return "翻訳完了";
    if (book.translationStatus === "error") return "翻訳失敗";
    if (book.contentTranslated) return "翻訳完了";
    return "—";
}

// ダウンロード→即保存→即本棚→裏で翻訳開始
async function downloadAndSaveBook(bookId) {
    const s_e = document.getElementById("search-status");
    const rx_78 = v_project_cache[bookId];

    s_e.style.color = "#2b2b2b";

    if (!rx_78) {
        s_e.style.color = "#d9534f";
        s_e.textContent = "エラー: キャッシュがないぞ…";
        return;
    }

    s_e.textContent = `作品ID:${bookId} をダウンロード中... (｀・ω・´)`;

    try {
        const funnel_urls = [
            rx_78.formats["text/html; charset=utf-8"],
            rx_78.formats["text/html"],
            `https://www.gutenberg.org/cache/epub/${bookId}/pg${bookId}-images.html`,
            rx_78.formats["text/plain; charset=utf-8"],
            rx_78.formats["text/plain"],
            `https://www.gutenberg.org/cache/epub/${bookId}/pg${bookId}.txt.utf8`
        ].filter(Boolean);

        if (funnel_urls.length === 0) {
            s_e.style.color = "#d9534f";
            s_e.textContent = "エラー: 読める形式のURLが存在しないわorz";
            return;
        }

        let res_ok = null;
        let r_t = "";
        let final_url = "";

        for (const u of funnel_urls) {
            try {
                const tmp_r = await fetch(maji_de_proxy_base + encodeURIComponent(u));
                if (tmp_r.ok) {
                    res_ok = tmp_r;
                    r_t = await tmp_r.text();
                    final_url = u;
                    break;
                }
            } catch (e) {}
        }

        if (!res_ok) throw new Error(`全URL試したけど全滅したわ…`);

        let paragraph_list = [];

        if (final_url.includes("html") || final_url.includes("htm")) {
            const p = new DOMParser();
            const d = p.parseFromString(r_t, "text/html");
            d.querySelectorAll("script, style, header, footer, img").forEach(el => el.remove());
            const pe = d.querySelectorAll("p, h1, h2, h3");
            if (pe.length > 0) {
                pe.forEach(px => {
                    const tx = px.textContent.trim();
                    if (tx.length > 0) paragraph_list.push({ tag: px.tagName.toLowerCase(), text: tx });
                });
            } else {
                paragraph_list.push({ tag: "p", text: d.body.textContent.trim() });
            }
        } else {
            r_t.split("\n").forEach(l => {
                if (l.trim().length > 0) paragraph_list.push({ tag: "p", text: l.trim() });
            });
        }

        const c_h = paragraph_list.map(p => `<${p.tag}>${escapeHtml(p.text)}</${p.tag}>`).join("");
        const a_n = rx_78.authors[0] ? rx_78.authors[0].name : "不明";

        const bd = {
            id: bookId,
            title: rx_78.title,
            author: a_n,
            content: c_h,
            contentTranslated: "",
            paragraphs: paragraph_list,
            translatedTexts: new Array(paragraph_list.length).fill(null),
            translationStatus: paragraph_list.length ? "translating" : "done",
            translationDone: 0,
            translationTotal: paragraph_list.length,
            savedAt: new Date().toISOString(),
            sortOrder: Date.now(),
            favorite: false
        };

        await saveBookToDB(bd);

        s_e.style.color = "#4a6fa5";
        s_e.textContent = "保存完了！裏で翻訳を進めるから、そのまま読み始めてもOK ( ﾟ∀ﾟ)o彡";

        openReader(bd);
        startBackgroundTranslation(bookId);
    } catch (err) {
        s_e.style.color = "#d9534f";
        s_e.textContent = `クラッシュしたわ… 原因: ${err.message}`;
    }
}

function loadBookshelf() {
    const s_e = document.getElementById("bookshelf-status");
    const t_e = document.getElementById("bookshelf-table");
    const tb_e = document.getElementById("bookshelf-tbody");

    tb_e.innerHTML = "";
    s_e.textContent = "読み込み中...";
    s_e.style.color = "#2b2b2b";

    const tx = maji_de_db.transaction(["books"], "readonly");
    const st = tx.objectStore("books");
    const rq = st.getAll();

    rq.onsuccess = () => {
        const bks = rq.result;
        if (bks.length === 0) {
            s_e.textContent = "本棚は空っぽだよ ( ˘ω˘ )";
            t_e.style.display = "none";
            return;
        }

        bks.sort((a, b) => (a.sortOrder ?? Infinity) - (b.sortOrder ?? Infinity));
        s_e.textContent = "";
        t_e.style.display = "table";

        bks.forEach(b => {
            const tr = document.createElement("tr");
            tr.draggable = true;
            tr.ondragstart = (e) => handleDragStart(e, b.id);
            tr.ondragover = (e) => handleDragOver(e, tr);
            tr.ondragleave = () => tr.classList.remove("drag-over-row");
            tr.ondrop = (e) => handleRowDrop(e, b.id, tr);
            tr.style.cursor = "pointer";
            tr.onclick = () => readSavedBook(b.id);

            const fav_mark = b.favorite ? "★ " : "";
            const status_txt = formatTranslationStatus(b);

            tr.innerHTML = `
                <td class="id-cell">
                    <span class="drag-handle" title="ドラッグで並べ替え" onclick="event.stopPropagation()">
                        <span class="bar"></span><span class="bar"></span>
                    </span>
                    ${b.id}
                </td>
                <td>${fav_mark}${b.title}</td>
                <td>${b.author}</td>
                <td><span class="trans-badge" data-status-for="${b.id}">${status_txt}</span></td>
                <td onclick="event.stopPropagation()">
                    <div class="menu-wrap">
                        <button class="dots-btn" onclick="toggleRowMenu(event, ${b.id})">⋮</button>
                        <div class="row-menu" id="menu-${b.id}">
                            <button onclick="toggleFavorite(${b.id})">${b.favorite ? "お気に入り解除" : "お気に入りに追加"}</button>
                            <button onclick="confirmDeleteBook(${b.id})" style="color:#d9534f;">削除</button>
                        </div>
                    </div>
                </td>
            `;
            tb_e.appendChild(tr);
        });
    };
}

function handleDragStart(ev, bookId) {
    drag_zaku_id = bookId;
    ev.dataTransfer.effectAllowed = "move";
}
function handleDragOver(ev, rowEl) {
    ev.preventDefault(); // これ消すとdropが発火しない
    rowEl.classList.add("drag-over-row");
}
function handleRowDrop(ev, targetId, rowEl) {
    ev.preventDefault();
    rowEl.classList.remove("drag-over-row");
    if (drag_zaku_id === null || drag_zaku_id === targetId) return;
    swapBookOrder(drag_zaku_id, targetId);
    drag_zaku_id = null;
}
function swapBookOrder(idA, idB) {
    const tx = maji_de_db.transaction(["books"], "readwrite");
    const st = tx.objectStore("books");
    const rqA = st.get(idA);
    rqA.onsuccess = () => {
        const bookA = rqA.result;
        const rqB = st.get(idB);
        rqB.onsuccess = () => {
            const bookB = rqB.result;
            if (!bookA || !bookB) return;
            const tmp_order = bookA.sortOrder ?? 0;
            bookA.sortOrder = bookB.sortOrder ?? 0;
            bookB.sortOrder = tmp_order;
            st.put(bookA);
            st.put(bookB);
        };
    };
    tx.oncomplete = () => { loadBookshelf(); };
}

// 3点メニュー。position:fixedでビューポート基準に置くので、
// 親のoverflowやz-indexに邪魔されず必ず前面に出る
function toggleRowMenu(ev, bookId) {
    ev.stopPropagation();

    const target_menu = document.getElementById(`menu-${bookId}`);
    const is_opening = !target_menu.classList.contains("active");

    closeAllRowMenus();

    if (is_opening) {
        const btn = ev.currentTarget;
        const rect = btn.getBoundingClientRect();
        const menu_w = 170; // CSSのmin-widthに合わせる

        // 画面右端からはみ出さないように左位置を調整
        let left = rect.right - menu_w;
        if (left < 8) left = 8;

        target_menu.style.position = "fixed";
        target_menu.style.top = (rect.bottom + 4) + "px";
        target_menu.style.left = left + "px";
        target_menu.style.right = "auto";

        target_menu.classList.add("active");
        menu_char_aznable_id = bookId;
    }
}

function closeAllRowMenus() {
    document.querySelectorAll(".row-menu").forEach(m => m.classList.remove("active"));
    menu_char_aznable_id = null;
}

document.addEventListener("click", () => { closeAllRowMenus(); });
// スクロール・リサイズ時はfixed位置がズレるので閉じる

function openReader(bookObj) {

    rv.classList.add("active");

    ima_yonderu_hon = bookObj;
    is_page_mode = false;
    ima_no_page = 0;

    // 翻訳中なら最初から翻訳ビューで開く（上から順に日本語へ置き換わっていく）
    is_showing_translation = (bookObj.translationStatus === "translating") && !!bookObj.paragraphs;

    document.getElementById("reading-title").textContent = bookObj.title;

    const rb = document.getElementById("reader-body");
    rb.classList.remove("paged");
    document.getElementById("page-nav").style.display = "none";
    document.getElementById("page-mode-btn").textContent = "めくりモード";

    updateTranslationButtonLabel();
    renderReaderContent();
    updateReaderTranslationLabel();

    rb.scrollTop = 0;
    rb.scrollLeft = 0;
}

function renderReaderContent() {
    if (!ima_yonderu_hon) return;
    const flow = document.getElementById("reader-flow");

    if (is_showing_translation) {
        flow.innerHTML = buildTranslatedHtml(ima_yonderu_hon);
    } else {
        flow.innerHTML = ima_yonderu_hon.content || "";
    }

    if (is_page_mode) requestAnimationFrame(() => computePageLayout());
}

function toggleTranslationView() {
    if (!ima_yonderu_hon) return;
    const has_translation =
        (ima_yonderu_hon.paragraphs && ima_yonderu_hon.paragraphs.length) ||
        !!ima_yonderu_hon.contentTranslated;
    if (!has_translation) {
        alert("この本には翻訳データが無いよ");
        return;
    }
    is_showing_translation = !is_showing_translation;
    updateTranslationButtonLabel();
    renderReaderContent();
}

function updateTranslationButtonLabel() {
    const btn = document.getElementById("translate-toggle-btn");
    if (!btn) return;
    btn.textContent = is_showing_translation ? "原文で読む" : "翻訳で読む";
}

function updateReaderTranslationLabel() {
    const el = document.getElementById("translation-status-label");
    if (!el) return;
    if (!ima_yonderu_hon) { el.textContent = ""; return; }

    const b = ima_yonderu_hon;
    if (b.translationStatus === "translating") {
        const done = b.translationDone || 0;
        const total = b.translationTotal || (b.paragraphs ? b.paragraphs.length : 0);
        el.textContent = `翻訳中 ${done}/${total}`;
        el.classList.remove("error");
    } else if (b.translationStatus === "done") {
        el.textContent = "翻訳完了";
        el.classList.remove("error");
    } else if (b.translationStatus === "error") {
        el.textContent = "翻訳失敗(一部未翻訳)";
        el.classList.add("error");
    } else {
        el.textContent = "";
        el.classList.remove("error");
    }
}

function togglePageMode() {
    is_page_mode = !is_page_mode;
    const rb = document.getElementById("reader-body");
    const flow = document.getElementById("reader-flow");
    const page_nav = document.getElementById("page-nav");
    const mode_btn = document.getElementById("page-mode-btn");

    rb.classList.toggle("paged", is_page_mode);
    page_nav.style.display = is_page_mode ? "flex" : "none";
    mode_btn.textContent = is_page_mode ? "スクロールに戻す" : "めくりモード";

    if (is_page_mode) {
        requestAnimationFrame(() => computePageLayout());
    } else {
        flow.style.columnWidth = "";
        flow.style.columnGap = "";
        flow.style.columnFill = "";
        rb.scrollLeft = 0;
    }
}

function schedulePageRecompute() {
    if (!is_page_mode) return;
    clearTimeout(page_recompute_timer);
    page_recompute_timer = setTimeout(() => { computePageLayout(ima_no_page); }, 500);
}

function computePageLayout(keep_page) {
    if (!is_page_mode) return;
    const rb = document.getElementById("reader-body");
    const flow = document.getElementById("reader-flow");
    const page_w = rb.clientWidth;
    flow.style.columnWidth = `${page_w}px`;
    flow.style.columnGap = `${gata_gap_haba}px`;
    flow.style.columnFill = "auto";
    const total_w = flow.scrollWidth;
    zenbu_page_su = Math.max(1, Math.round(total_w / (page_w + gata_gap_haba)));
    const target = (typeof keep_page === "number") ? keep_page : 0;
    goToPage(target);
}

function turnPage(delta) { goToPage(ima_no_page + delta); }

function goToPage(pageIdx) {
    const rb = document.getElementById("reader-body");
    ima_no_page = Math.max(0, Math.min(zenbu_page_su - 1, pageIdx));
    rb.scrollLeft = ima_no_page * (rb.clientWidth + gata_gap_haba);
    const indicator = document.getElementById("page-indicator");
    if (indicator) indicator.textContent = `${ima_no_page + 1} / ${zenbu_page_su}`;
}

document.getElementById("reader-body").addEventListener("click", (ev) => {
    if (!is_page_mode) return;
    const rb = ev.currentTarget;
    const rect = rb.getBoundingClientRect();
    const rel_x = (ev.clientX - rect.left) / rect.width;
    if (rel_x < 0.25) turnPage(-1);
    else if (rel_x > 0.75) turnPage(1);
});

document.addEventListener("keydown", (ev) => {
    if (!is_page_mode) return;
    if (ev.key === "ArrowRight") turnPage(1);
    if (ev.key === "ArrowLeft") turnPage(-1);
});

window.addEventListener("resize", () => {
    if (is_page_mode) computePageLayout(ima_no_page);
});

function switchTab(tabName) {

    if (tabName === "search") {

    } else if (tabName === "bookshelf") {
        document.getElementById("bookshelf-view").classList.add("active");
        loadBookshelf();
    }
}

function toggleWritingMode() {
    const rb = document.getElementById("reader-body");
    is_vertical_mode = !is_vertical_mode;
    rb.classList.toggle("vertical", is_vertical_mode);
    if (is_page_mode) computePageLayout(ima_no_page);
}

function changeFontSize(delta) {
    current_font_size = Math.max(12, Math.min(36, current_font_size + delta));
    document.getElementById("reader-body").style.fontSize = `${current_font_size}px`;
    if (is_page_mode) computePageLayout(ima_no_page);
}

function setTheme(theme) {
    document.body.classList.remove("dark-mode", "sepia-mode");
    if (theme === "dark") document.body.classList.add("dark-mode");
    if (theme === "sepia") document.body.classList.add("sepia-mode");
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
}

window.onload = async () => {
    await initDB();
    resumePendingTranslations();
};
</script>
</body>
