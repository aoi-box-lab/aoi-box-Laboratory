<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>ヤマビコ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
    --bg-color:#f7f6f2;--text-color:#2b2b2b;--accent-color:#4a6fa5;--card-bg:#fff;--border-color:#e0e0e0;
    --font-family:'Georgia','Yu Mincho','Hiragino Mincho ProN',serif;
    --app-h: 100dvh;
    --ui-pad-x: clamp(12px, 2vw, 20px);--ui-pad-y: clamp(8px, 1.2vh, 12px);
    --reader-font: clamp(15px, 0.9vw + 12px, 19px);
    --reader-pad-x: clamp(16px, 3vw, 40px);--reader-pad-y: clamp(20px, 4vh, 40px);
    --reader-max-w: clamp(600px, 92vw, 900px);--tap-min: 40px;
}
body.dark-mode{--bg-color:#1a1a1a;--text-color:#d1d1d1;--accent-color:#6b8cce;--card-bg:#282828;--border-color:#404040;}
body.sepia-mode{--bg-color:#f4ecd8;--text-color:#5b4636;--accent-color:#8c6d53;--card-bg:#fbf0d9;--border-color:#e2d7c0;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background-color:var(--bg-color);color:var(--text-color);font-family:var(--font-family);transition:background-color .3s,color .3s;position:fixed;top:0;left:0;width:100%;height:var(--app-h);display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;}
header{flex-shrink:0;position:relative;z-index:100;padding-top:calc(var(--ui-pad-y) + env(safe-area-inset-top));padding-bottom:var(--ui-pad-y);padding-left:calc(var(--ui-pad-x) + env(safe-area-inset-left));padding-right:calc(var(--ui-pad-x) + env(safe-area-inset-right));background-color:var(--card-bg);border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;}
h1{font-size:clamp(1rem, 0.5vw + 0.9rem, 1.2rem);font-weight:normal;letter-spacing:2px}
.nav-buttons button{min-height:var(--tap-min);background:none;border:1px solid var(--border-color);color:var(--text-color);padding:6px 12px;margin-left:8px;border-radius:4px;cursor:pointer;}
.container{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.view-panel{flex:1;min-height:0;padding:var(--ui-pad-x);overflow-y:auto;display:none;overscroll-behavior:contain}
.view-panel.active{display:block}
.simple-search-box{display:flex;gap:10px;max-width:900px;margin:0 auto 10px auto;align-items:center;flex-wrap:wrap;}
.simple-search-box input{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--border-color);border-radius:4px;background:var(--card-bg);color:var(--text-color);font-size:1rem;min-height:var(--tap-min);}
.simple-search-box button.go{padding:10px 20px;background:var(--accent-color);color:#fff;border:none;border-radius:4px;cursor:pointer;min-height:var(--tap-min);}
.detail-toggle-wrap{max-width:900px;margin:0 auto 12px auto;text-align:center;}
.detail-toggle-btn{background:none;border:1px solid var(--border-color);color:var(--text-color);border-radius:4px;padding:6px 16px;font-size:.85rem;cursor:pointer;min-height:36px;}
.detail-toggle-btn.active{background:var(--accent-color);color:#fff;border-color:var(--accent-color);}
.detail-search-panel{display:none;max-width:900px;margin:0 auto 20px auto;padding:16px 20px;background:var(--card-bg);border:1px solid var(--border-color);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.detail-search-panel.active{display:block;}
.detail-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.detail-row > label{flex-shrink:0;width:80px;font-size:.85rem;font-weight:bold;opacity:.75;}
.detail-select,.detail-input{flex:1;min-width:140px;padding:8px 12px;border:1px solid var(--border-color);border-radius:4px;background:var(--card-bg);color:var(--text-color);font-size:.95rem;min-height:40px;}
.detail-buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
.detail-buttons button{padding:8px 20px;border-radius:4px;cursor:pointer;min-height:40px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-color);font-size:.9rem;}
.detail-buttons button.go{background:var(--accent-color);color:#fff;border-color:var(--accent-color);}
.sort-bar{display:flex;gap:8px;align-items:center;max-width:900px;margin:0 auto 8px auto;padding:6px 10px;background:var(--card-bg);border:1px solid var(--border-color);border-radius:4px;font-size:.85rem;}
.sort-bar label{opacity:.7;flex-shrink:0;}
.sort-bar select{flex:1;min-width:0;padding:4px 8px;border:1px solid var(--border-color);border-radius:4px;background:var(--card-bg);color:var(--text-color);font-size:.85rem;min-height:32px;}
.sort-bar button{padding:4px 12px;min-width:44px;border:1px solid var(--border-color);border-radius:4px;background:var(--card-bg);color:var(--text-color);font-size:.95rem;cursor:pointer;min-height:32px;}
.sort-count{font-size:.8rem;opacity:.7;white-space:nowrap;}
.results-table{width:100%;border-collapse:collapse;background:var(--card-bg);box-shadow:0 2px 5px rgba(0,0,0,.05)}
.results-table th,.results-table td{padding:12px 15px;text-align:left;border-bottom:1px solid var(--border-color)}
.results-table th{background-color:rgba(0,0,0,.03);font-weight:bold}
.results-table tr:hover{background-color:rgba(0,0,0,.02);cursor:pointer}
.source-badge{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:3px;background:rgba(74,111,165,.12);color:var(--accent-color);white-space:nowrap;}
.id-cell{display:flex;align-items:center;gap:10px}
.drag-handle{display:flex;flex-direction:column;gap:3px;width:16px;cursor:grab;flex-shrink:0}
.drag-handle:active{cursor:grabbing}
.drag-handle .bar{height:2px;background:var(--text-color);opacity:.4;border-radius:1px}
.results-table tr.drag-over-row{outline:2px dashed var(--accent-color);outline-offset:-2px}
.menu-wrap{position:relative;display:inline-block}
.dots-btn{background:none;border:none;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--text-color);padding:4px 10px;min-height:var(--tap-min);min-width:var(--tap-min)}
.row-menu{display:none;position:fixed;background:var(--card-bg);border:1px solid var(--border-color);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:5000;min-width:180px;overflow:hidden}
.row-menu.active{display:block}
.row-menu button{display:block;width:100%;text-align:left;padding:10px 14px;background:none;border:none;cursor:pointer;color:var(--text-color);font-size:.9rem;min-height:var(--tap-min)}
.row-menu button:hover{background:rgba(0,0,0,.05)}
#reader-view{flex:1;min-height:0;display:none;flex-direction:column;height:100%;position:relative;overflow:hidden}
#reader-view.active{display:flex}
.reader-toolbar{flex-shrink:0;padding-top:var(--ui-pad-y);padding-bottom:var(--ui-pad-y);padding-left:calc(var(--ui-pad-x) + env(safe-area-inset-left));padding-right:calc(var(--ui-pad-x) + env(safe-area-inset-right));background:var(--card-bg);border-bottom:1px solid var(--border-color);display:flex;gap:clamp(6px, 1vw, 10px);align-items:center;font-size:.9rem;flex-wrap:wrap;}
.reader-toolbar button{padding:6px 12px;min-height:var(--tap-min);border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-color);border-radius:4px;cursor:pointer}
.reader-toolbar select{padding:4px 8px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-color);border-radius:4px;cursor:pointer;font-size:.9rem;min-height:36px}
.reader-content{flex:1;min-height:0;padding:var(--reader-pad-y) var(--reader-pad-x);overflow:auto;line-height:1.8;font-size:var(--reader-font);max-width:var(--reader-max-w);margin:0 auto;width:100%;overscroll-behavior:contain;}
#reader-body.book-mode{overflow:hidden;cursor:pointer;max-width:none;padding:30px 20px;width:100%;height:100%;position:relative;overscroll-behavior:contain;}
#reader-body.book-mode #reader-flow{will-change:transform;backface-visibility:hidden;}
#reader-body.book-mode::after{content:'';position:absolute;top:0;bottom:0;width:90px;pointer-events:none;z-index:20;opacity:0;transition:opacity .2s ease;}
#reader-body.book-mode:not(.rtl).turning-next::after{right:0;background:linear-gradient(to left,rgba(0,0,0,.22),rgba(0,0,0,0));opacity:1;}
#reader-body.book-mode:not(.rtl).turning-prev::after{left:0;background:linear-gradient(to right,rgba(0,0,0,.22),rgba(0,0,0,0));opacity:1;}
#reader-body.book-mode.rtl.turning-next::after{left:0;background:linear-gradient(to right,rgba(0,0,0,.22),rgba(0,0,0,0));opacity:1;}
#reader-body.book-mode.rtl.turning-prev::after{right:0;background:linear-gradient(to left,rgba(0,0,0,.22),rgba(0,0,0,0));opacity:1;}
#page-nav{display:none;align-items:center;gap:8px;font-size:.9rem}
#page-nav.active{display:flex}
#page-nav.rtl{flex-direction:row-reverse}
#page-nav button{padding:6px 12px;min-height:36px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-color);border-radius:4px;cursor:pointer;font-size:.85rem}
#page-nav #page-indicator{white-space:nowrap;padding:0 4px;opacity:.8}
.status-msg{text-align:center;padding:20px;font-size:.95rem;opacity:.8;font-weight:bold}
.status-msg.error{color:#d9534f}
.status-msg.success{color:#4caf50}
.status-msg.info{color:var(--accent-color)}
.trans-badge{font-size:.8rem;color:var(--accent-color);white-space:nowrap}
.trans-badge.error{color:#d9534f}
.trans-badge.done{color:#4caf50}
.update-badge{display:inline-block;font-size:.8rem;color:#f0ad4e;font-weight:bold;margin-right:6px;cursor:help}
.bookshelf-filters{display:flex;gap:12px;max-width:700px;margin:0 auto 16px auto;align-items:center;flex-wrap:wrap}
.bookshelf-filters input[type="text"]{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--border-color);border-radius:4px;background:var(--card-bg);color:var(--text-color);font-size:.95rem;min-height:36px}
.bookshelf-filters label{display:flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer;white-space:nowrap;min-height:var(--tap-min)}
.reprocess-all-btn{padding:8px 14px;border:1px solid #f0ad4e;background:#f0ad4e;color:#fff;border-radius:4px;cursor:pointer;font-size:.9rem;font-weight:bold;white-space:nowrap;min-height:var(--tap-min)}
.reprocess-all-btn:hover{background:#ec971f;border-color:#ec971f}
.reprocess-all-btn:disabled{opacity:.6;cursor:default}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;align-items:center;justify-content:center;padding:16px}
.modal-overlay.active{display:flex}
.modal-box{background:var(--card-bg);color:var(--text-color);padding:26px 30px;border-radius:8px;max-width:320px;width:100%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.modal-box p{margin-bottom:20px;line-height:1.6}
.modal-buttons{display:flex;gap:10px;justify-content:center}
.modal-buttons button{padding:8px 20px;border-radius:4px;border:1px solid var(--border-color);cursor:pointer;background:var(--card-bg);color:var(--text-color);font-size:.9rem;min-height:var(--tap-min)}
.modal-buttons button.danger{background:#d9534f;color:#fff;border-color:#d9534f}
.toast-container{position:fixed;top:calc(60px + env(safe-area-inset-top));right:16px;z-index:10000;display:flex;flex-direction:column;gap:8px;max-width:380px;pointer-events:none}
.toast{background:var(--card-bg);color:var(--text-color);border:1px solid var(--border-color);border-left:4px solid var(--accent-color);border-radius:6px;padding:10px 14px;box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:.88rem;line-height:1.5;animation:slideIn .25s ease;pointer-events:auto;word-break:break-word}
.toast.error{border-left-color:#d9534f}
.toast.success{border-left-color:#4caf50}
.toast.warn{border-left-color:#f0ad4e}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
#reading-title{margin-left:auto;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40%}
.close-reader-btn{margin-left:15px}
.header-title-wrap{display:flex;align-items:center;gap:10px;}
#header-spinner{display:none;width:14px;height:14px;border:2px solid var(--border-color);border-top-color:var(--accent-color);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
#header-spinner.active{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#error-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:99999;background:#d9534f;color:#fff;padding:12px 44px 12px 16px;font-family:system-ui,'Yu Gothic',sans-serif;font-size:.9rem;line-height:1.55;box-shadow:0 2px 10px rgba(0,0,0,.35);word-break:break-word;max-height:40vh;overflow-y:auto}
#error-banner.active{display:block}
#error-banner .eb-close{position:absolute;top:6px;right:8px;background:none;border:none;color:#fff;font-size:1.5rem;line-height:1;cursor:pointer;padding:2px 8px;border-radius:4px}
#error-banner .eb-close:hover{background:rgba(255,255,255,.18)}
#error-banner .eb-title{font-weight:bold;margin-right:6px}
#error-banner .eb-detail{opacity:.9;font-size:.82rem;margin-top:4px;font-family:monospace;white-space:pre-wrap}
.reader-content h1{font-size:1.7rem;margin:1.8em 0 .8em;text-align:center;font-weight:bold;line-height:1.4}
.reader-content h2{font-size:1.5rem;margin:1.8em 0 .8em;text-align:center;font-weight:bold;line-height:1.4}
.reader-content h3{font-size:1.25rem;margin:1.5em 0 .7em;font-weight:bold;line-height:1.4}
.reader-content h4{font-size:1.08rem;margin:1.2em 0 .5em;font-weight:bold;line-height:1.4}
.reader-content .align-center{text-align:center;}
.reader-content ruby rt{font-size:.55em;letter-spacing:0;line-height:1}
.reader-content .indent-1{padding-left:1em}.reader-content .indent-2{padding-left:2em}.reader-content .indent-3{padding-left:3em}.reader-content .indent-4{padding-left:4em}.reader-content .indent-5{padding-left:5em}.reader-content .indent-6{padding-left:6em}.reader-content .indent-7{padding-left:7em}.reader-content .indent-8{padding-left:8em}.reader-content .indent-9{padding-left:9em}.reader-content .indent-10{padding-left:10em}
.reader-content .boten{font-style:normal;text-emphasis:filled dot;-webkit-text-emphasis:filled dot;}
.reader-content .boten-maru{font-style:normal;text-emphasis:filled circle;-webkit-text-emphasis:filled circle;}
.reader-content .boten-shiromaru{font-style:normal;text-emphasis:open circle;-webkit-text-emphasis:open circle;}
.reader-content .boten-double{font-style:normal;text-emphasis:double-circle;-webkit-text-emphasis:double-circle;}
.reader-content .boten-snake{font-style:normal;text-emphasis:open dot;-webkit-text-emphasis:open dot;}
.reader-content .boten-line{text-decoration:underline;font-style:normal;}
.reader-content .boten-doubleline{text-decoration:underline double;font-style:normal;}
.reader-content .boten-dash{text-decoration:underline dashed;font-style:normal;}
.reader-content .boten-wave{text-decoration:underline wavy;font-style:normal;}
.reader-content .boten-chain{text-decoration:underline dashed;font-style:normal;}
.reader-content .warichu{font-size:.68em;line-height:1;padding:0 .1em;vertical-align:middle;}
.reader-content .keigakomi{border:1px solid currentColor;padding:.4em .9em;margin:.3em 0;border-radius:2px;}
.reader-content .tate-chu-yoko{text-combine-upright:all;-webkit-text-combine:horizontal;}
.reader-content strong{font-weight:bold;}
.reader-content em{font-style:italic;}
.reader-content sup{font-size:.7em;vertical-align:super;line-height:0;}
.reader-content sub{font-size:.7em;vertical-align:sub;line-height:0;}
.reader-content .loading-msg{text-align:center;padding:60px 20px;opacity:.5;font-size:.95rem;}
.settings-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8000}
.settings-backdrop.active{display:block}
.settings-panel{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:90vw;background:var(--card-bg);border-left:1px solid var(--border-color);box-shadow:-4px 0 20px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .25s ease;z-index:8100;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
.settings-panel.active{transform:translateX(0)}
.settings-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border-color);padding-top:calc(16px + env(safe-area-inset-top))}
.settings-header h2{font-size:1.1rem;font-weight:normal}
.settings-close{background:none;border:none;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--text-color);padding:4px 10px;border-radius:4px;min-width:var(--tap-min);min-height:var(--tap-min)}
.settings-close:hover{background:rgba(0,0,0,.05)}
.settings-body{flex:1;overflow-y:auto;padding:20px;overscroll-behavior:contain}
.settings-group{margin-bottom:24px}
.settings-group > label{display:block;font-size:.85rem;font-weight:bold;margin-bottom:8px;opacity:.7}
.settings-options{display:flex;gap:8px;flex-wrap:wrap}
.settings-options button{flex:1;min-width:70px;padding:8px 12px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-color);border-radius:4px;cursor:pointer;font-size:.88rem;min-height:var(--tap-min)}
.settings-options button.active{background:var(--accent-color);color:#fff;border-color:var(--accent-color)}
.settings-select{width:100%;padding:8px 12px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-color);border-radius:4px;font-size:.95rem;min-height:var(--tap-min)}
.settings-info{font-size:.78rem;opacity:.6;margin-top:6px;line-height:1.5}
@media (max-width: 1024px){#reading-title{font-size:.9rem;max-width:35%}}
@media (max-width: 768px){.view-panel{padding:clamp(10px, 2.5vw, 14px)}.results-table th, .results-table td{padding:9px 10px;font-size:.86rem;}#reading-title{order:-1;flex:1 1 100%;margin-left:0;padding:0 0 6px 0;border-bottom:1px solid var(--border-color);font-size:.88rem;max-width:100%}.close-reader-btn{margin-left:auto}#page-nav{order:2}#reader-body.book-mode{padding:20px 14px}.bookshelf-filters{flex-direction:column;align-items:stretch;gap:8px;}.bookshelf-filters input[type="text"]{min-width:0}.reprocess-all-btn{width:100%}}
@media (max-width: 480px){header{flex-direction:column;align-items:stretch;gap:8px}.header-title-wrap{justify-content:center;}h1{text-align:center}.nav-buttons{display:flex;gap:8px}.nav-buttons button{flex:1;margin:0;padding:8px 0;font-size:.9rem;}.simple-search-box{flex-direction:column;align-items:stretch;}.simple-search-box input{width:100%;}.simple-search-box button.go{width:100%;}.detail-row{flex-direction:column;align-items:stretch;gap:6px;}.detail-row > label{width:auto;}.detail-buttons{flex-direction:column;}.detail-buttons button{width:100%;}.results-table th, .results-table td{padding:8px;font-size:.82rem;white-space:normal;}.reader-toolbar{gap:6px;}#page-nav{gap:6px;font-size:.8rem;}#page-nav button{padding:5px 8px;font-size:.78rem;min-height:32px}#page-nav #page-indicator{font-size:.78rem}#reader-body.book-mode{padding:14px 10px}.modal-box{padding:22px 20px}.toast-container{top:auto;bottom:calc(16px + env(safe-area-inset-bottom));left:16px;right:16px;max-width:none;}#error-banner{font-size:.82rem;padding:10px 40px 10px 12px}.settings-panel{width:100%;max-width:100vw}}
@media (orientation: landscape) and (max-height: 500px){header{padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:6px;}h1{font-size:.95rem}.reader-toolbar{padding-top:4px;padding-bottom:4px;gap:4px;}.reader-toolbar button{padding:4px 8px;font-size:.78rem;min-height:32px}#reading-title{font-size:.85rem;max-width:40%}.view-panel{padding:10px}#reader-body.book-mode{padding:10px}.nav-buttons button{min-height:32px;padding:4px 10px}}
@media (min-width: 1200px){.reader-content{line-height:1.9}.view-panel{padding:30px}}
</style>
</head>
<body>

<div id="error-banner">
    <span class="eb-title">エラー:</span>
    <span class="eb-msg"></span>
    <div class="eb-detail"></div>
    <button class="eb-close" onclick="document.getElementById('error-banner').classList.remove('active')">×</button>
</div>

<header>
    <div class="header-title-wrap">
        <h1>ヤマビコ</h1>
        <span id="header-spinner" title="読み込み中"></span>
    </div>
    <div class="nav-buttons">
        <button onclick="switchTab('search')">検索</button>
        <button onclick="switchTab('bookshelf')">本棚</button>
    </div>
</header>

<div class="container">
    <div id="search-view" class="view-panel active">
        <div class="simple-search-box">
            <input type="text" id="search-input" placeholder="作品名でも著者名でもOK"
                   onkeydown="if(event.key==='Enter'){event.preventDefault();execSearch();}">
            <button class="go" onclick="execSearch()">検索</button>
        </div>

        <div class="detail-toggle-wrap">
            <button id="detail-toggle-btn" class="detail-toggle-btn" onclick="toggleDetailSearch()">詳細検索</button>
        </div>

        <div id="detail-search-panel" class="detail-search-panel">
            <div class="detail-row">
                <label for="detail-source">場所</label>
                <select id="detail-source" class="detail-select">

async function fetchWithTimeout(url, options, timeoutMs){
    const controller = new AbortController();

function shuffled(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function decodeJapaneseText(buf){
    if(buf.byteLength >= 3){ const b0 = buf[0], b1 = buf[1], b2 = buf[2]; if(b0 === 0xEF && b1 === 0xBB && b2 === 0xBF) return new TextDecoder('utf-8').decode(buf); }
    let sjis = '', utf8 = '';
    try{ sjis = new TextDecoder('shift_jis').decode(buf); }catch(e){ sjis = ''; }
    try{ utf8 = new TextDecoder('utf-8').decode(buf); }catch(e){ utf8 = ''; }
    const sjisBad = (sjis.match(/\uFFFD/g) || []).length;
    const utf8Bad = (utf8.match(/\uFFFD/g) || []).length;
    if(utf8Bad === 0 && sjisBad > 0) return utf8;
    if(sjisBad === 0 && utf8Bad > 0) return sjis;
    return sjisBad <= utf8Bad ? sjis : utf8;
}

/* ============================================================
   緩い検索ヘルパ
   ============================================================ */
function normalizeForSearch(s){
    if(s == null) return '';
    return String(s).toLowerCase().normalize('NFKC')
        .replace(/[・･=＝\-–—ー~〜_,.;:!?！？。、\s（）()「」『』【】\[\]&＋+"'`]+/g, '');
}
function makeSearchTokens(query){
    return String(query || '').toLowerCase().normalize('NFKC')
        .split(/[・･=＝\-–—ー~〜_,.;:!?！？。、\s（）()「」『』【】\[\]&＋+"'`]+/)
        .map(t => t.trim()).filter(t => t.length >= 1);
}
function lenientScore(text, query){
    if(!text || !query) return 0;
    const q = normalizeForSearch(query);
    if(!q) return 0;
    const t = normalizeForSearch(text);
    if(!t) return 0;
    if(t === q) return 1000;
    if(t.startsWith(q)) return 800;
    if(t.includes(q)) return 600;
    const tokens = makeSearchTokens(query);
    if(tokens.length > 1){
        let matches = 0;
        for(const tok of tokens){ const tn = normalizeForSearch(tok); if(tn && t.includes(tn)) matches++; }
        if(matches > 0){ const ratio = matches / tokens.length; return Math.round(200 + 200 * ratio); }
    }
    if(q.length >= 3){
        let hit = 0;
        const total = q.length - 2;
        for(let i=0; i < total; i++){ if(t.includes(q.slice(i, i+3))) hit++; }
        if(hit > 0) return Math.round(50 + 100 * (hit / total));
    }
    if(q.length >= 2 && q.length <= 8){
        let pos = 0;
        for(const ch of t){ if(ch === q[pos]) pos++; if(pos >= q.length) break; }
        if(pos === q.length) return 100;
    }
    return 0;
}
function computeRelevance(r, query){
    if(!query) return 1;
    const score = Math.max(lenientScore(r.title || '', query), lenientScore(r.author || '', query));
    if(score > 0 && r.title) return score + Math.max(0, 50 - Math.min(50, r.title.length * 0.5));
    return score;
}

            maji_de_db = e.target.result;
            db_closing = false;
            maji_de_db.onversionchange = ()=>{ db_closing = true; try{ maji_de_db.close(); }catch(_){} maji_de_db = null; };
            maji_de_db.onclose = ()=>{ db_closing = true; maji_de_db = null; };
            resolve(maji_de_db);
        };
        req.onerror = (e)=>reject(e.target.error);
        req.onblocked = ()=>showToast('他のタブでヤマビコが開かれています。そちらを閉じて再読み込みしてください。', 'warn', 12000);
    });
}
async function ensureDB(){ if(maji_de_db && !db_closing) return maji_de_db; await initDB(); return maji_de_db; }
async function safeDBOp(storeNames, mode, fn){
    await ensureDB();
    return new Promise((resolve, reject)=>{
        let tx;
        try{ tx = maji_de_db.transaction(storeNames, mode); }
        catch(e){ initDB().then(()=>{ try{ const tx2 = maji_de_db.transaction(storeNames, mode); fn(tx2, resolve, reject); }catch(e2){ reject(e2); } }).catch(reject); return; }
        fn(tx, resolve, reject);
    });
}
function getBookFromDB(bookId){ return safeDBOp(["books"], "readonly", (tx, resolve, reject)=>{ const rq = tx.objectStore("books").get(bookId); rq.onsuccess = ()=>resolve(rq.result || null); rq.onerror = ()=>reject(rq.error); }); }
function getAllBooksFromDB(){ return safeDBOp(["books"], "readonly", (tx, resolve, reject)=>{ const rq = tx.objectStore("books").getAll(); rq.onsuccess = ()=>resolve(rq.result || []); rq.onerror = ()=>reject(rq.error); }); }
function saveBookToDB(book){ return safeDBOp(["books"], "readwrite", (tx, resolve, reject)=>{ tx.objectStore("books").put(book); tx.oncomplete = ()=>resolve(); tx.onerror = ()=>reject(tx.error); }); }
function getCacheFromDB(key){ return safeDBOp(["cache"], "readonly", (tx, resolve, reject)=>{ const rq = tx.objectStore("cache").get(key); rq.onsuccess = ()=>resolve(rq.result || null); rq.onerror = ()=>reject(rq.error); }); }
function saveCacheToDB(key, value){ return safeDBOp(["cache"], "readwrite", (tx, resolve, reject)=>{ tx.objectStore("cache").put({key, value, savedAt: new Date().toISOString()}); tx.oncomplete = ()=>resolve(); tx.onerror = ()=>reject(tx.error); }); }
function checkChosakukenSafe(y){ if(!y) return false; return (new Date().getFullYear() - y) >= 80; }
function isBookOutdated(book){ if(!book.rawParas || !Array.isArray(book.rawParas) || !book.rawParas.length) return false; return (book.formatVersion || 0) < BOOK_FORMAT_VERSION; }

/* ============================================================
   青空文庫注記
   ============================================================ */
function emphClassFor(type){
    switch(type){
        case '傍点': return 'boten'; case '丸傍点': return 'boten-maru';
        case '白丸傍点': return 'boten-shiromaru'; case '二重丸傍点': return 'boten-double';
        case '蛇の目傍点': return 'boten-snake'; case '傍線': return 'boten-line';
        case '二重傍線': return 'boten-doubleline'; case '破線': return 'boten-dash';
        case '波線': return 'boten-wave'; case '鎖線': return 'boten-chain';
        default: return 'boten';
    }
}
function buildAozoraParagraphs(rawParas){
    const result = [];
    let indentRange = 0, keigakomiRange = false;
    for(const raw of rawParas){
        let text = raw, tag = 'p', indent = indentRange, alignCenter = false, m;
        let keigakomiHere = keigakomiRange;
        if(text.includes('［＃罫囲み］')){ keigakomiRange = true; keigakomiHere = true; text = text.replace(/［＃罫囲み］/g, ''); }
        let keigakomiEndHere = false;
        if(text.includes('［＃罫囲み終わり］')){ keigakomiEndHere = true; text = text.replace(/［＃罫囲み終わり］/g, ''); }
        const hm = text.match(/［＃「(.+?)」は(大|中|小)見出し］/);
        if(hm){ tag = hm[2] === '大' ? 'h2' : hm[2] === '中' ? 'h3' : 'h4'; text = text.replace(/［＃「.+?」は(?:大|中|小)見出し］/g, ''); }
        while((m = text.match(/［＃ここから(\d+)字下げ］/))){ indentRange = parseInt(m[1], 10); indent = indentRange; text = text.replace(m[0], ''); }
        while((m = text.match(/［＃ここで字下げ終わり］/))){ indent = indentRange; indentRange = 0; text = text.replace(m[0], ''); }
        while((m = text.match(/［＃(\d+)字下げ］/))){ indent = Math.max(indent, parseInt(m[1], 10)); text = text.replace(m[0], ''); }
        while((m = text.match(/［＃地から(\d+)字上げ］/))){ indent = Math.max(indent, parseInt(m[1], 10)); text = text.replace(m[0], ''); }
        if(/［＃(?:中央寄せ|中央揃え|ページの左右中央)］/.test(text)){ alignCenter = true; text = text.replace(/［＃(?:中央寄せ|中央揃え|ページの左右中央)］/g, ''); }
        const emphTargets = [];
        while((m = text.match(/［＃「(.+?)」に(二重丸傍点|白丸傍点|丸傍点|蛇の目傍点|二重傍線|傍点|傍線|破線|波線|鎖線)］/))){ emphTargets.push({text: m[1], type: m[2]}); text = text.replace(m[0], ''); }
        text = text.replace(/［＃割[り]?注］([\s\S]*?)［＃割[り]?注終わり］/g, (_, c)=>MK_WARI + c + MK_WARI_E);
        text = text.replace(/［＃太字］([\s\S]*?)［＃太字終わり］/g, (_, c)=>MK_BOLD + c + MK_BOLD_E);
        text = text.replace(/［＃斜体］([\s\S]*?)［＃斜体終わり］/g, (_, c)=>MK_ITAL + c + MK_ITAL_E);
        text = text.replace(/［＃縦中横］([\s\S]*?)［＃縦中横終わり］/g, (_, c)=>MK_TATE + c + MK_TATE_E);
        text = text.replace(/［＃上付き小文字］([\s\S]*?)［＃上付き小文字終わり］/g, (_, c)=>MK_SUP + c + MK_SUP_E);
        text = text.replace(/［＃下付き小文字］([\s\S]*?)［＃下付き小文字終わり］/g, (_, c)=>MK_SUB + c + MK_SUB_E);
        text = text.replace(/［＃(?:改ページ|改丁|改段|本文中改ページ)］/g, '');
        text = text.replace(/［＃改行］/g, MK_BR);
        text = text.replace(/［＃[^］]*］/g, '');
        if(!text.trim()) continue;
        const classes = [];
        if(indent > 0) classes.push('indent-' + Math.min(indent, 10));
        if(alignCenter) classes.push('align-center');
        if(keigakomiHere) classes.push('keigakomi');
        let html = escapeHtml(text);
        html = html.replace(/\x01WARI\x01([\s\S]*?)\x01WARIEND\x01/g, (_, c)=>`<span class="warichu">${c}</span>`);
        html = html.replace(/\x01BOLD\x01([\s\S]*?)\x01BOLDEND\x01/g, (_, c)=>`<strong>${c}</strong>`);
        html = html.replace(/\x01ITAL\x01([\s\S]*?)\x01ITALEND\x01/g, (_, c)=>`<em>${c}</em>`);
        html = html.replace(/\x01TATE\x01([\s\S]*?)\x01TATEEND\x01/g, (_, c)=>`<span class="tate-chu-yoko">${c}</span>`);
        html = html.replace(/\x01SUP\x01([\s\S]*?)\x01SUPEND\x01/g, (_, c)=>`<sup>${c}</sup>`);
        html = html.replace(/\x01SUB\x01([\s\S]*?)\x01SUBEND\x01/g, (_, c)=>`<sub>${c}</sub>`);
        html = html.replace(/\x01BR\x01/g, '<br>');
        html = html.replace(/｜([^｜《》\n]+?)《([^》\n]+)》/g, '<ruby>$1<rt>$2</rt></ruby>');
        html = html.replace(/([一-龥々]+)《([^》\n]+)》/g, '<ruby>$1<rt>$2</rt></ruby>');
        for(const tgt of emphTargets){
            const escTgt = escapeHtml(tgt.text);
            const idx = html.lastIndexOf(escTgt);
            if(idx < 0) continue;
            const cls = emphClassFor(tgt.type);
            html = html.slice(0, idx) + `<em class="${cls}">${escTgt}</em>` + html.slice(idx + escTgt.length);
        }
        const plainText = text.replace(/\x01[A-Z]+\x01/g, '').replace(/\n/g, ' ').trim();
        result.push({tag, text: plainText, classes, html});
        if(keigakomiEndHere) keigakomiRange = false;
    }
    return result;
}

async function reprocessBook(bookId){
    const book = await getBookFromDB(bookId);
    if(!book) return {ok:false, reason:'本が見つかりません'};
    if(!isBookOutdated(book)) return {ok:true, skipped:true};
    const newParas = buildAozoraParagraphs(book.rawParas);
    const newCh = newParas.map(p=>{ const cls = (p.classes && p.classes.length) ? ` class="${p.classes.join(' ')}"` : ''; const inner = (p.html != null) ? p.html : escapeHtml(p.text); return `<${p.tag}${cls}>${inner}</${p.tag}>`; }).join('');
    const oldTexts = Array.isArray(book.translatedTexts) ? book.translatedTexts : [];
    let newTexts = oldTexts.length === newParas.length ? oldTexts.slice() : new Array(newParas.length).fill(null);
    book.paragraphs = newParas; book.content = newCh; book.translatedTexts = newTexts;
    book.translationTotal = newParas.length;
    if(book.source === 'aozora'){ book.translationStatus = 'done'; book.translationDone = newParas.length; }
    else if(book.translationStatus === 'done'){ book.translationDone = newParas.length; }
    book.formatVersion = BOOK_FORMAT_VERSION;
    await saveBookToDB(book);
    return {ok:true, updated:true, paragraphCount: newParas.length};
}
async function reprocessAllBooks(onProgress){
    const books = await getAllBooksFromDB();
    const outdated = books.filter(b => isBookOutdated(b));
    if(!outdated.length) return {total:0, updated:0, failed:0};
    let updated = 0, failed = 0;
    for(let i=0; i<outdated.length; i++){
        try{ const r = await reprocessBook(outdated[i].id); if(r.ok && r.updated) updated++; else if(!r.ok) failed++; }catch(e){ failed++; }
        if(typeof onProgress === 'function') onProgress(i+1, outdated.length);
    }
    return {total: outdated.length, updated, failed};
}
async function countOutdatedBooks(){ const books = await getAllBooksFromDB(); return books.filter(b => isBookOutdated(b)).length; }
async function handleReprocessOne(bookId){
    closeAllRowMenus();
    showToast('再処理中...', 'info', 3000);
    try{ const r = await reprocessBook(bookId); if(r.ok){ showToast(r.skipped ? '再処理は不要です' : `再処理完了（${r.paragraphCount}段落）`, r.skipped ? 'info' : 'success', 3000); loadBookshelf(); } else { showToast('再処理失敗: ' + (r.reason || '不明'), 'error'); } }
    catch(e){ showToast('再処理失敗: ' + e.message, 'error'); }
}
window.handleReprocessOne = handleReprocessOne;
async function handleReprocessAll(){
    const btn = document.getElementById('reprocess-all-btn');
    if(btn){ btn.disabled = true; btn.textContent = '再処理中...'; }
    try{
        const r = await reprocessAllBooks((done, total)=>{ if(btn) btn.textContent = `再処理中 ${done}/${total}...`; });
        if(r.total === 0) showToast('要更新の本はありません', 'info');

}

/* ============================================================
   統合検索（ヘッダースピナー＋世代キャンセル対応）
   ============================================================ */
async function unifiedSearch({query, filters}){
    const myGen = ++currentSearchGen;
    const t = document.getElementById("results-table");
    const tb = document.getElementById("results-tbody");
    const sortBar = document.getElementById("sort-bar");
    tb.innerHTML = "";
    t.style.display = "none";
    sortBar.style.display = "none";
    currentSearchResults = [];
    v_project_cache = {};

    const allSources = ['gutenberg','aozora','internetarchive','ndl','wikisource'];
    const sources = allSources.filter(s => !filters.source || filters.source === s);

    showHeaderSpinner();
    setStatus("search-status", `${sources.length}つの場所を検索中...`, 'info');

    try{
        const settled = await Promise.allSettled(
            sources.map(src => searchSourceUnified(src, {query, filters}))
        );

        if(myGen !== currentSearchGen) return;

        let allResults = [];
        settled.forEach((r, i) => {
            if(r.status === 'fulfilled' && Array.isArray(r.value)) allResults = allResults.concat(r.value);
            else if(r.status === 'rejected') console.warn(`[unified] ${sources[i]} failed:`, r.reason);
        });

        if(filters.year)     allResults = allResults.filter(r => matchYear(r.year, filters.year));
        if(filters.category) allResults = allResults.filter(r => matchCategory(r.category, filters.category));

        const seen = new Set();
        const dedup = [];
        for(const r of allResults){ if(!seen.has(r.id)){ seen.add(r.id); dedup.push(r); } }

        if(!dedup.length){
            setStatus("search-status", "見つかりませんでした", 'error');
            return;
        }

        const relevanceQuery = (query || filters.title || filters.author || '').trim();
        currentSearchResults = dedup.map(r => ({ ...r, relevance: computeRelevance(r, relevanceQuery) }));

        currentSortField = 'relevance';
        currentSortAsc = false;
        document.getElementById('sort-field').value = 'relevance';
        updateSortDirectionButton();

        t.style.display = "table";
        sortBar.style.display = "flex";
        renderSearchResults();
        setStatus("search-status", `見つかりました (${currentSearchResults.length}件)`, 'success');
    } finally {
        if(myGen === currentSearchGen) hideHeaderSpinner();
    }
}

function applySort(){ currentSortField = document.getElementById('sort-field').value; updateSortDirectionButton(); renderSearchResults(); }
window.applySort = applySort;

function renderSearchResults(){
    const tb = document.getElementById("results-tbody");
    const countEl = document.getElementById("sort-count");
    tb.innerHTML = "";
    const dir = currentSortAsc ? 1 : -1;
    const sorted = currentSearchResults.slice();
    sorted.sort((a, b) => {
        let av, bv;
        switch(currentSortField){
            case 'relevance': av = a.relevance || 0; bv = b.relevance || 0; break;
            case 'title':     av = (a.title || '').toLowerCase(); bv = (b.title || '').toLowerCase(); break;
            case 'author':    av = (a.author || '').toLowerCase(); bv = (b.author || '').toLowerCase(); break;
            case 'year':      av = (a.year == null) ? 999999 : a.year; bv = (b.year == null) ? 999999 : b.year; break;
            case 'source':    av = a.source || ''; bv = b.source || ''; break;
            default:          av = 0; bv = 0;
        }
        if(av < bv) return -1 * dir;
        if(av > bv) return 1 * dir;
        return 0;
    });
    sorted.forEach(r => renderUnifiedRow(r, tb));
    if(countEl) countEl.textContent = `${sorted.length}件`;
}

/* ============================================================
   年度・カテゴリヘルパ
   ============================================================ */
function parseYear(dateStr){
    if(!dateStr) return null;
    const m = String(dateStr).match(/\b(1[0-9]{3}|20[0-9]{2})\b/);
    return m ? parseInt(m[1], 10) : null;
}
function matchYear(year, rangeStr){
    if(!rangeStr) return true;
    if(year == null) return true;
    if(rangeStr.startsWith('~')) return year <= parseInt(rangeStr.slice(1), 10);
    if(rangeStr.endsWith('-')) return year >= parseInt(rangeStr.slice(0, -1), 10);
    const [a, b] = rangeStr.split('-').map(s => parseInt(s, 10));
    return year >= a && year <= b;
}
function matchCategory(resultCategory, filterCategory){ if(!filterCategory) return true; if(resultCategory == null) return true; return resultCategory === filterCategory; }
function guessGutenbergCategory(b){
    const s = ((b.subjects||[]).join(' ') + ' ' + (b.bookshelves||[]).join(' ')).toLowerCase();
    if(/fiction|novel/.test(s)) return 'novel';
    if(/poetry|poem/.test(s)) return 'poetry';
    if(/drama|play/.test(s)) return 'drama';
    if(/essay/.test(s)) return 'essay';
    if(/children|juvenile/.test(s)) return 'children';
    return null;
}

/* ============================================================
   各ソース：緩い検索＋全件取得
   ============================================================ */
async function searchGutenbergUnified(ctx){
    const query = (ctx.query || ctx.filters.title || ctx.filters.author || '').trim();
    if(!query) return [];

    let eng = query;
    if(/[^\x00-\x7F]/.test(query)){ const t = await translateText(query, 'ja', 'en'); if(t) eng = t; }
    const clean = eng.replace(/[^\w\s]/gi,' ').replace(/\s+/g,' ').trim();
    if(!clean) return [];

    try{
        const allBooks = [];
        let url = `https://gutendex.com/books/?search=${encodeURIComponent(clean)}`;
        let safety = 0;
        while(url && safety < 50){
            const res = await fetchWithTimeout(CORS_PROXIES.aoi(url), {}, FETCH_TIMEOUT_API);
            if(!res.ok) break;
            const data = await res.json();
            if(data.results) allBooks.push(...data.results);
            url = data.next;
            safety++;
        }
        return allBooks.map(b => {
            v_project_cache[b.id] = b;
            const a = b.authors[0] || {};
            const safe = checkChosakukenSafe(a.death_year) || a.copyright === false;
            return { source: 'gutenberg', id: 'gutenberg_' + b.id, title: b.title, author: a.name || '不明',
                     year: null, category: guessGutenbergCategory(b), safe, safetyNote: '保護期間内', raw: b };
        });
    }catch(e){ console.warn('[unified-gutenberg]', e); return []; }
}

async function searchAozoraUnified(ctx){
    const titleQ  = (ctx.filters.title || '').trim();
    const authorQ = (ctx.filters.author || '').trim();
    const simpleQ = (ctx.query || '').trim();

    if(!aozora_catalog_ready){
        if(!aozora_catalog_loading) fetchAozoraCatalog();
        let waited = 0;
        while(!aozora_catalog_ready && waited < 30000){ await sleep(300); waited += 300; }
        if(!aozora_catalog_ready) return [];
    }

    const noQuery = !simpleQ && !titleQ && !authorQ;
    const results = [];
    for(const it of aozora_catalog){
        let score = 0;
        if(simpleQ){ score = Math.max(lenientScore(it.title, simpleQ), lenientScore(it.personName, simpleQ)); }
        else if(titleQ || authorQ){
            const ts = titleQ ? lenientScore(it.title, titleQ) : null;
            const as = authorQ ? lenientScore(it.personName, authorQ) : null;
            if(ts !== null && ts === 0) continue;
            if(as !== null && as === 0) continue;
            score = Math.max(ts || 0, as || 0);
        } else if(noQuery){ score = 1; }
        if(score > 0) results.push({it, score});
    }
    results.sort((a, b) => b.score - a.score);
    return results.map(({it}) => ({
        source: 'aozora', id: 'aozora_' + it.workId, title: it.title, author: it.personName,
        year: null, category: null, safe: true, raw: it
    }));
}

/* IA検索：没年チェックを並列20で実行（著作権チェックは維持） */
async function searchIAUnified(ctx){
    const titleQ  = (ctx.filters.title || '').trim();
    const authorQ = (ctx.filters.author || '').trim();
    const simpleQ = (ctx.query || '').trim();
    const q = simpleQ || titleQ || authorQ;

    let searchQ = q;
    if(q && /[^\x00-\x7F]/.test(q)){
        const eng = await translateText(q, 'ja', 'en');
        searchQ = (eng || q).replace(/[^\w\s]/g, ' ').replace(/\s+/g,' ').trim();
    }
    try{
        const docs = await searchInternetArchiveAll(searchQ || '', ctx.filters.year);
        if(!docs.length) return [];

        const out = new Array(docs.length);
        let cursor = 0;

        const worker = async () => {
            while(true){
                const i = cursor++;
                if(i >= docs.length) return;
                const item = docs[i];
                try{
                    const licenseSafe = isIAPublicDomain(item);
                    const cr = item.creator;
                    const creatorStr = Array.isArray(cr) ? cr.join(', ') : (cr || '不明');
                    const dInfo = await getAuthorDeathYear(creatorStr);
                    const cy = new Date().getFullYear();
                    const yearSafe = dInfo.deathYear ? (cy - dInfo.deathYear) >= 80 : false;
                    let safetyNote = '保護期間内';
                    if(!licenseSafe) safetyNote = 'ライセンスNG';
                    else if(!yearSafe) safetyNote = dInfo.deathYear ? `没年${dInfo.deathYear}` : '没年不明';
                    out[i] = {
                        source: 'internetarchive',
                        id: 'ia_' + item.identifier,
                        title: item.title || '(無題)',
                        author: creatorStr,
                        year: parseYear(item.date),
                        category: null,
                        safe: licenseSafe && yearSafe,
                        safetyNote,
                        raw: item
                    };
                }catch(e){
                    out[i] = {
                        source: 'internetarchive',
                        id: 'ia_' + item.identifier,
                        title: item.title || '(無題)',
                        author: Array.isArray(item.creator) ? item.creator.join(', ') : (item.creator || '不明'),
                        year: parseYear(item.date),
                        category: null,
                        safe: false,
                        safetyNote: '確認失敗',
                        raw: item
                    };
                }
            }
        };

        await Promise.all(Array.from({length: Math.min(IA_DEATH_CONCURRENCY, docs.length)}, worker));
        return out.filter(Boolean);
    }catch(e){ console.warn('[unified-ia]', e); return []; }
}

async function getAuthorEnglishNameFromWikipedia(jpName){
    if(/^[a-zA-Z0-9\s]+$/.test(jpName)) return null;
    try{
        const api = `https://ja.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(jpName)}&gsrlimit=5&prop=langlinks&lllang=en&format=json&origin=*&indexpageids=1`;
        const res = await fetchWithTimeout(CORS_PROXIES.aoi(api), {}, FETCH_TIMEOUT_API);
        const data = await res.json();
        const q = data && data.query;
        if(!q || !q.pages) return null;
        const ids = (q.pageids && q.pageids.length) ? q.pageids : Object.keys(q.pages);
        for(const id of ids){
            const p = q.pages[id];
            if(!p) continue;
            if(p.title && /曖昧さ回避|一覧|の作品|作品一覧/.test(p.title)) continue;
            const ll = p.langlinks;
            if(ll && ll[0] && ll[0]["*"]) return ll[0]["*"];
        }
    }catch(e){}
    return null;
}

const _deathYearCache = new Map();
async function getAuthorDeathYear(authorName){
    if(!authorName || /^[0-9\s]+$/.test(authorName)) return { deathYear: null, birthYear: null, name: authorName };
    const cacheKey = String(authorName).trim();
    if(_deathYearCache.has(cacheKey)) return _deathYearCache.get(cacheKey);
    const embedded = extractYearsFromString(cacheKey);
    if(embedded.deathYear || embedded.birthYear){
        const r = { deathYear: embedded.deathYear, birthYear: embedded.birthYear, name: cacheKey };
        _deathYearCache.set(cacheKey, r); return r;
    }
    const candidates = buildNameCandidates(cacheKey);
    for(const name of candidates){
        const [ja, en] = await Promise.all([
            fetchDeathYearFromWiki(name, 'ja'),
            fetchDeathYearFromWiki(name, 'en')
        ]);
        const r = ja || en;
        if(r && (r.deathYear || r.birthYear)){
            const out = { deathYear: r.deathYear, birthYear: r.birthYear, name };
            _deathYearCache.set(cacheKey, out); return out;
        }
    }
    const fallback = { deathYear: null, birthYear: null, name: cacheKey };
    _deathYearCache.set(cacheKey, fallback); return fallback;
}
function extractYearsFromString(s){
    let deathYear = null, birthYear = null;
    const m1 = s.match(/(\d{4})\s*[-–—~]\s*(\d{4})/);
    if(m1){ birthYear = parseInt(m1[1], 10); deathYear = parseInt(m1[2], 10); }
    if(!deathYear){ const m2 = s.match(/\bd\.\s*(\d{4})/i); if(m2) deathYear = parseInt(m2[1], 10); }
    if(!birthYear){ const m3 = s.match(/\bb\.\s*(\d{4})/i); if(m3) birthYear = parseInt(m3[1], 10); }
    return { deathYear, birthYear };
}
function buildNameCandidates(raw){
    const cleaned = raw.replace(/\s*\d{4}\s*[-–—~]\s*\d{4}\s*/g, ' ').replace(/\s*\(\d{4}[^)]*\)\s*/g, ' ').replace(/\s+/g, ' ').trim();
    const parts = cleaned.split(/[,;]/).map(s=>s.trim()).filter(Boolean);
    const set = new Set(); set.add(cleaned);
    if(parts.length >= 2){ set.add(`${parts[1]} ${parts[0]}`); set.add(parts[0]); set.add(parts[1]); }
    else if(parts.length === 1){ set.add(parts[0]); }
    for(const c of [...set]){ const stripped = c.replace(/\b(?:Mr|Mrs|Ms|Dr|Sir|Prof)\.?\s*/gi, '').trim(); if(stripped) set.add(stripped); }
    return [...set].filter(s => s.length >= 2);
}
async function fetchDeathYearFromWiki(name, lang){
    try{
        const api = `https://${lang}.wikipedia.org/w/api.php?action=query&prop=revisions&rvprop=content&rvslots=main&titles=${encodeURIComponent(name)}&format=json&origin=*&redirects=1`;
        const res = await fetchWithTimeout(CORS_PROXIES.aoi(api), {}, FETCH_TIMEOUT_API);
        const data = await res.json();
        const pages = data && data.query && data.query.pages;
        if(!pages) return null;
        const page = Object.values(pages)[0];
        if(!page || page.missing !== undefined) return null;
        const content = page.revisions && page.revisions[0] && page.revisions[0].slots && page.revisions[0].slots.main ? page.revisions[0].slots.main['*'] : '';
        if(!content) return null;
        let deathYear = null, birthYear = null;
        const deathMatches = [
            ...content.matchAll(/\{\{没年\s*\|\s*(\d{3,4})/g), ...content.matchAll(/死去日\s*=\s*.*?(\d{4})年/g),
            ...content.matchAll(/没年月日\s*=\s*.*?(\d{4})年/g), ...content.matchAll(/死亡日\s*=\s*.*?(\d{4})年/g),
            ...content.matchAll(/(\d{4})年没/g), ...content.matchAll(/death_date\s*=\s*[^\n]*?(\d{4})/gi),
            ...content.matchAll(/\|\s*death_date\s*=[^\n]*?(\d{4})/gi), ...content.matchAll(/Died\s*=\s*[^\n]*?(\d{4})/gi)
        ];
        for(const m of deathMatches){ const y = parseInt(m[1], 10); if(y >= 1000 && y <= new Date().getFullYear()){ deathYear = y; break; } }
        const birthMatches = [
            ...content.matchAll(/\{\{生年\s*\|\s*(\d{3,4})/g), ...content.matchAll(/生年月日\s*=\s*.*?(\d{4})年/g),
            ...content.matchAll(/誕生日\s*=\s*.*?(\d{4})年/g), ...content.matchAll(/birth_date\s*=\s*[^\n]*?(\d{4})/gi),
            ...content.matchAll(/Born\s*=\s*[^\n]*?(\d{4})/gi)
        ];
        for(const m of birthMatches){ const y = parseInt(m[1], 10); if(y >= 1000 && y <= new Date().getFullYear()){ birthYear = y; break; } }
        if(deathYear || birthYear) return { deathYear, birthYear, name };
        return null;
    }catch(e){ return null; }
}

async function translateText(text, source, target){

        }catch(e){}
    }
    return text;
}

async function fetchAozoraCatalog(){

    showHeaderSpinner();
    try{
        const cached = await getCacheFromDB(CATALOG_CACHE_KEY);

            aozora_catalog = cached.value; aozora_catalog_ready = true; aozora_catalog_loading = false;
            hideHeaderSpinner(); return;
        }
    }catch(e){}
    let catalog = null, lastErr = '';
    for(const src of AOZORA_CATALOG_SOURCES){
        if(catalog) break;
        try{
            const fetchUrl = src.proxy ? CORS_PROXIES[src.proxy](src.url) : src.url;
            const res = await fetchWithTimeout(fetchUrl, { cache: 'no-store' }, FETCH_TIMEOUT_BOOK);

            const json = JSON.parse(text);
            catalog = parseAozoraCardJson(json);

    }

        aozora_catalog_loading = false; hideHeaderSpinner();
        showErrorBanner('青空文庫カタログの取得に失敗しました。', `最終エラー: ${lastErr}`);
        return;

    hideHeaderSpinner();

}
function extractZipFilename(card){
    const checks = [
        () => card.download && typeof card.download === 'string' ? card.download : null,
        () => card.download && card.download.filename, () => card.download && card.download.file,
        () => card.download && card.download.zip, () => card.zip && card.zip.filename,
        () => card.zip_file, () => card.filename, () => card.file && card.file.filename,
        () => card.title && card.title.download && card.title.download.filename,
        () => card.title && card.title.zip_file, () => card.title && card.title.file,
        () => card.title && card.title.zip,
        () => card.files && Array.isArray(card.files) && card.files[0] && (card.files[0].filename || card.files[0].name),
        () => card.text_url, () => card.url && typeof card.url === 'string' && card.url.includes('/files/') ? card.url : null
    ];
    for(const c of checks){
        try{ const v = c(); if(typeof v === 'string' && v.trim()){ const s = v.trim(); if(s.includes('/files/')){ const m = s.match(/\/([^\/]+\.zip)(?:[?#].*)?$/i); if(m) return m[1]; } if(/\.zip$/i.test(s)) return s; } }catch(e){}
    }
    return '';
}
function parseAozoraCardJson(json){
    const catalog = [];
    const arr = Array.isArray(json) ? json : (json.cards || json.data || []);
    for(const card of arr){
        try{
            const t = card.title || {};
            const workId = String(t.work_id || card.work_id || '').trim();
            const title = String(t.title || card.title_str || '').trim();
            const personId = String(t.person_id || t.author_num || card.person_id || card.author_id || '').trim();
            const personName = String(t.person_name || card.person_name || card.author || '').trim();
            if(!workId || !title) continue;
            const zipName = extractZipFilename(card);
            catalog.push({ workId, title, personId, personName, zipName, cardUrl: personId && workId ? `https://www.aozora.gr.jp/cards/${personId}/card${workId}.html` : '', htmlUrl: '' });
        }catch(e){}
    }
    return catalog;
}

function splitTextRoughly(text, maxLen){
    const chunks = []; let rest = text;
    while(rest.length > maxLen){
        let cut = rest.lastIndexOf(". ", maxLen);
        if(cut < maxLen*0.5) cut = rest.lastIndexOf("。", maxLen);
        if(cut < maxLen*0.5) cut = rest.lastIndexOf("！", maxLen);
        if(cut < maxLen*0.5) cut = rest.lastIndexOf("？", maxLen);
        if(cut < maxLen*0.5) cut = rest.lastIndexOf("! ", maxLen);
        if(cut < maxLen*0.5) cut = rest.lastIndexOf("? ", maxLen);
        if(cut < maxLen*0.5) cut = maxLen;
        chunks.push(rest.slice(0, cut+1)); rest = rest.slice(cut+1);
    }
    if(rest.length) chunks.push(rest);
    return chunks;
}
async function translateChunk(text, source, target){
    if(!text || !text.trim()) return {ok:true, text};
    for(const inst of shuffled(LINGVA_INSTANCES)){
        try{ const url = `${inst}/api/v1/${source}/${target}/${encodeURIComponent(text)}`; const res = await fetchWithTimeout(url, {cache:'no-store'}, FETCH_TIMEOUT_TRANSLATE); if(!res.ok) continue; const data = await res.json(); if(data && data.translation) return {ok:true, text:data.translation, endpoint:'Lingva'}; }catch(e){}
    }
    for(const inst of shuffled(LIBRETRANSLATE_INSTANCES)){
        try{ const res = await fetchWithTimeout(`${inst}/translate`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({q:text, source, target}) }, FETCH_TIMEOUT_TRANSLATE); if(!res.ok) continue; const data = await res.json(); if(data && data.translatedText) return {ok:true, text:data.translatedText, endpoint:'LibreTranslate'}; }catch(e){}
    }
    return {ok:false, error:'全翻訳APIが失敗しました'};
}
async function translateParagraph(text, source, target){
    if(!text || !text.trim()) return {ok:true, text};
    if(text.length <= CHUNK_MAX_LEN) return await translateChunk(text, source, target);
    const chunks = splitTextRoughly(text, CHUNK_MAX_LEN);
    let combined = '';
    for(const c of chunks){ const r = await translateChunk(c, source, target); if(!r.ok) return r; combined += r.text; }
    return {ok:true, text:combined, endpoint:'chunked'};
}
function buildBidirectionalQueue(total){
    const q = []; let f = 0, b = total - 1;
    while(f <= b){ if(f === b){ q.push(f); break; } q.push(f); q.push(b); f++; b--; }
    return q;
}
function buildWikisourceAttribution(book){
    if(!book || book.source !== 'wikisource' || !book.sourceInfo) return '';
    const { lang } = book.sourceInfo;
    const baseUrl = WIKISOURCE_BASE_URLS[lang] || WIKISOURCE_BASE_URLS.ja;
    const pageUrl = `${baseUrl}${encodeURIComponent(book.title)}`;
    return `
        <div class="wikisource-attribution" style="margin-top:2.5em;padding-top:1.2em;border-top:1px solid var(--border-color);font-size:.8rem;opacity:.75;line-height:1.7;">
            <p><strong>出典:</strong> Wikisource（${lang === 'ja' ? '日本語版' : '英語版'}）</p>
            <p><strong>ページ:</strong> <a href="${pageUrl}" target="_blank" rel="noopener noreferrer" style="color: var(--accent-color);">${escapeHtml(book.title)}</a></p>
            <p><strong>ライセンス:</strong> ${WIKISOURCE_LICENSE}</p>
            <p><strong>取得日:</strong> ${book.savedAt ? new Date(book.savedAt).toLocaleDateString('ja-JP') : '不明'}</p>
        </div>
    `;
}
function buildOriginalHtml(book){
    if(book.paragraphs && book.paragraphs.length){
        let html = book.paragraphs.map((p, i)=>{
            const classes = (p.classes || []).slice();
            const cls = classes.length ? ` class="${classes.join(' ')}"` : '';
            const inner = (p.html != null) ? p.html : escapeHtml(p.text);
            return `<${p.tag}${cls} data-pidx="${i}">${inner}</${p.tag}>`;
        }).join('');
        if(book.source === 'wikisource') html += buildWikisourceAttribution(book);
        return html;
    }
    return book.content || "";
}
function buildTranslatedHtml(book){
    if(book.paragraphs && book.paragraphs.length){
        const texts = book.translatedTexts || [];
        let html = book.paragraphs.map((p, i)=>{
            const t = texts[i]; const isUn = (t == null);
            const classes = (p.classes || []).slice(); if(isUn) classes.push('untranslated');
            const cls = classes.length ? ` class="${classes.join(' ')}"` : '';
            const inner = escapeHtml(isUn ? p.text : t);
            return `<${p.tag}${cls} data-pidx="${i}">${inner}</${p.tag}>`;
        }).join('');
        if(book.source === 'wikisource') html += buildWikisourceAttribution(book);
        return html;
    }
    return book.contentTranslated || book.content || "";
}

/* ============================================================
   翻訳ジョブ
   ============================================================ */
async function startBackgroundTranslation(bookId){
    if(active_translation_jobs[bookId]) return;
    active_translation_jobs[bookId] = true;
    const myGen = (translation_generation[bookId]||0) + 1;
    translation_generation[bookId] = myGen;
    let bookTitleForToast = '';
    try{
        const book = await getBookFromDB(bookId);
        if(!book || !book.paragraphs || !book.paragraphs.length) return;
        bookTitleForToast = book.title;
        const total = book.paragraphs.length;
        if(!Array.isArray(book.translatedTexts) || book.translatedTexts.length !== total){
            const old = Array.isArray(book.translatedTexts) ? book.translatedTexts : [];
            const fixed = new Array(total).fill(null);
            for(let i=0;i<total;i++){ if(old[i] != null) fixed[i] = old[i]; }
            book.translatedTexts = fixed;
        }
        const already = book.translatedTexts.filter(t=>t != null).length;
        if(already >= total){ book.translationStatus = "done"; book.translationDone = total; await saveBookToDB(book); onTranslationTick(book); return; }
        const srcLang = book.sourceLang || 'en';
        const tgtLang = book.targetLang || 'ja';
        book.translationStatus = "translating"; book.translationTotal = total; book.translationDone = already;
        delete book.lastError;
        const queue = buildBidirectionalQueue(total).filter(i=>book.translatedTexts[i] == null);
        let qi = 0, lastSave = 0, fails = 0, para = INITIAL_PARALLELISM;
        const worker = async (worker_id)=>{
            while(true){
                if(translation_generation[bookId] !== myGen) return;
                if(worker_id >= para) return;
                if(qi >= queue.length) return;
                const idx = queue[qi++];
                if(book.translatedTexts[idx] != null) continue;
                let ok = false, lastErr = '';
                for(let attempt=0; attempt<MAX_RETRY_PER_PARAGRAPH; attempt++){
                    if(translation_generation[bookId] !== myGen) return;
                    const r = await translateParagraph(book.paragraphs[idx].text, srcLang, tgtLang);
                    if(r.ok){ book.translatedTexts[idx] = r.text; book.translationDone = (book.translationDone||0) + 1; onTranslationTick(book); if(Date.now() - lastSave > 1500){ lastSave = Date.now(); saveBookToDB(book); } ok = true; break; }
                    lastErr = r.error || 'unknown'; await sleep(Math.min(50*(attempt+1), 250));
                }
                if(ok){ fails = 0; }
                else{ fails++; book.lastError = `段落${idx}: ${lastErr}`;
                    if(fails >= FAILS_TO_DROP_CONCURRENCY){ if(para > MIN_PARALLELISM){ para = para === 32 ? 16 : MIN_PARALLELISM; fails = 0; } else fails = 0; }
                }
                await sleep(WORKER_DELAY_MS);
            }
        };
        const workers = [];
        for(let i=0;i<INITIAL_PARALLELISM;i++) workers.push(worker(i));
        await Promise.all(workers);
        if(translation_generation[bookId] !== myGen) return;
        book.translationDone = book.translatedTexts.filter(t=>t != null).length;
        if(book.translationDone >= total){ book.translationStatus = "done"; showToast(`「${bookTitleForToast}」の翻訳が完了しました (${book.translationDone}/${total})`, 'success'); }
        else { book.translationStatus = "error"; showToast(`「${bookTitleForToast}」一部の段落が未翻訳です (${book.translationDone}/${total})`, 'warn', 12000); }
        await saveBookToDB(book);
        onTranslationTick(book);
    }catch(err){
        showToast('翻訳ジョブがクラッシュ: ' + err.message, 'error');
        try{ if(translation_generation[bookId] === myGen){ const b = await getBookFromDB(bookId); if(b){ b.translationStatus = "error"; b.lastError = err.message; await saveBookToDB(b); onTranslationTick(b); } } }catch(e){}
    }finally{ if(translation_generation[bookId] === myGen) active_translation_jobs[bookId] = false; }
}
function onTranslationTick(book){
    if(ima_yonderu_hon && ima_yonderu_hon.id === book.id){
        ima_yonderu_hon.translatedTexts = book.translatedTexts;
        ima_yonderu_hon.translationStatus = book.translationStatus;
        ima_yonderu_hon.translationDone = book.translationDone;
        ima_yonderu_hon.translationTotal = book.translationTotal;
        ima_yonderu_hon.lastError = book.lastError;
        if(!ima_yonderu_hon.paragraphs) ima_yonderu_hon.paragraphs = book.paragraphs;
        readerHtmlCache.translated = null;
        if(is_showing_translation){ applyTranslationToDom(book); if(is_book_mode) schedulePageRecompute(); }
        updateReaderTranslationLabel();
    }
    updateBookshelfRowStatus(book);
}
function applyTranslationToDom(book){
    if(!ima_yonderu_hon || ima_yonderu_hon.id !== book.id) return;
    if(!is_showing_translation || !book.paragraphs) return;
    const flow = document.getElementById("reader-flow");
    const texts = book.translatedTexts || [];
    const children = flow.children;
    for(let i=0;i<book.paragraphs.length && i<children.length;i++){
        const el = children[i];
        if(texts[i] != null && el.classList.contains("untranslated")){ el.textContent = texts[i]; el.classList.remove("untranslated"); }

async function resolveAozoraZipName(workId, personId, initialZipName){
    if(initialZipName) return { zipName: initialZipName, via: 'catalog' };
    const paddedPersonId = String(personId).padStart(6, '0');
    const apiCandidates = [ `https://api.github.com/repos/aozorahack/aozorabunko_text/contents/cards/${paddedPersonId}/files?ref=master`, `https://api.github.com/repos/aozorabunko/aozorabunko/contents/cards/${paddedPersonId}/files?ref=master` ];
    for(const apiUrl of apiCandidates){
        try{ const apiRes = await fetchWithTimeout(apiUrl, {}, FETCH_TIMEOUT_API); if(!apiRes.ok) continue; const files = await apiRes.json(); if(!Array.isArray(files)) continue;
            const zipTarget = files.find(f => f.name && f.name.startsWith(String(workId) + '_') && f.name.endsWith('.zip'));
            if(zipTarget) return { zipName: zipTarget.name, via: 'github-api' };
            const dirTarget = files.find(f => f.name && f.name.startsWith(String(workId) + '_'));
            if(dirTarget){ const base = dirTarget.name.replace(/\.zip$/i, ''); return { zipName: base + '.zip', via: 'github-api-dir' }; }
        }catch(e){}
    }
    try{ const cardUrl = `https://www.aozora.gr.jp/cards/${paddedPersonId}/card${workId}.html`; const res = await fetchWithTimeout(CORS_PROXIES.aoi(cardUrl), {}, FETCH_TIMEOUT_API); if(res.ok){ const html = await res.text(); const m = html.match(/files\/([^"'#?]+\.zip)/i); if(m) return { zipName: m[1], via: 'card-html' }; } }catch(e){}
    return { zipName: null, via: null };
}
async function checkAozoraSuspended(workId, personId){
    try{
        const paddedPersonId = String(personId).padStart(6, '0');
        const cardUrl = `https://www.aozora.gr.jp/cards/${paddedPersonId}/card${workId}.html`;
        const res = await fetchWithTimeout(CORS_PROXIES.aoi(cardUrl), {}, FETCH_TIMEOUT_API);
        if(!res.ok) return { suspended: false, reason: null };
        const html = await res.text();
        const patterns = [/この作品の公開は現在、?一時的に停止されています/, /この作品は公開を停止しています/, /公開を停止しました/, /現在公開していません/, /公開停止中/];
        for(const re of patterns){ if(re.test(html)) return { suspended: true, reason: '公開停止中' }; }
    }catch(e){}
    return { suspended: false, reason: null };
}

/* ============================================================
   Internet Archive（ページ並列8で全件取得）
   ============================================================ */
async function searchInternetArchiveAll(query, yearRange){
    const rowsPerPage = 100;
    const maxPages = 15;

    const buildUrl = (page) => {
        const p = new URLSearchParams();
        let q = `mediatype:texts AND licenseurl:(*publicdomain*)`;
        if(query && query.trim()) q = `${query} AND ` + q;
        if(yearRange){
            let from = '', to = '';
            if(yearRange.startsWith('~')){ to = yearRange.slice(1); }
            else if(yearRange.endsWith('-')){ from = yearRange.slice(0, -1); }
            else { const [a, b] = yearRange.split('-'); from = a; to = b; }
            if(from) q += ` AND date:[${from}-01-01 TO *]`;
            if(to)   q += ` AND date:[* TO ${to}-12-31]`;
        }
        p.append('q', q);
        ['identifier','title','creator','date','language','downloads','licenseurl'].forEach(f=>p.append('fl[]', f));
        p.append('rows', String(rowsPerPage));
        p.append('page', String(page));
        p.append('output', 'json');
        p.append('sort[]', 'downloads desc');
        return `${IA_SEARCH_ENDPOINT}?${p.toString()}`;
    };

    const fetchPage = async (page) => {
        try{
            const res = await fetchWithTimeout(CORS_PROXIES.aoi(buildUrl(page)), {}, FETCH_TIMEOUT_API);
            if(!res.ok) return null;
            return await res.json();
        }catch(e){ return null; }
    };

    const first = await fetchPage(1);
    if(!first) return [];
    const docs = (first.response && first.response.docs) || [];
    const numFound = (first.response && first.response.numFound) || docs.length;
    const totalPages = Math.min(maxPages, Math.ceil(numFound / rowsPerPage));
    if(totalPages <= 1) return docs;

    const pageResults = new Array(totalPages - 1);
    let pageCursor = 2;

    const pageWorker = async () => {
        while(true){
            const p = pageCursor++;
            if(p > totalPages) return;
            pageResults[p - 2] = await fetchPage(p);
        }
    };
    await Promise.all(Array.from({length: Math.min(IA_PAGE_CONCURRENCY, totalPages - 1)}, pageWorker));

    const rest = [];
    for(const r of pageResults){
        if(r && r.response && r.response.docs) rest.push(...r.response.docs);
    }
    return docs.concat(rest);
}
async function resolveIATextUrl(identifier){
    const res = await fetchWithTimeout(CORS_PROXIES.aoi(`${IA_METADATA_ENDPOINT}/${identifier}`), {}, FETCH_TIMEOUT_API);
    if(!res.ok) throw new Error(`IA metadata HTTP ${res.status}`);
    const meta = await res.json();
    const files = meta.files || [];
    const txt = files.find(f => f.format === 'DjVuTXT' || f.format === 'Text' || (f.name && f.name.endsWith('_djvu.txt')));
    if(txt) return { url: `https://archive.org/download/${identifier}/${txt.name}`, meta };
    const plain = files.find(f => f.name && f.name.endsWith('.txt'));
    if(plain) return { url: `https://archive.org/download/${identifier}/${plain.name}`, meta };
    throw new Error('テキスト形式のファイルがありません');
}

async function searchWikisourceAll(query, lang){

        const p = new URLSearchParams({ action: 'query', list: 'search', srsearch: query, srlimit: '50', sroffset: String(offset), format: 'json', origin: '*' });

function detectNDLAccessLevel(record){
    const desc = (record.description || '').toLowerCase();
    if(desc.includes('インターネット公開') || desc.includes('internet public')) return NDL_ACCESS_PUBLIC;
    if(desc.includes('個人送信') || desc.includes('個人向け') || desc.includes('personal')) return NDL_ACCESS_PERSONAL;
    if(desc.includes('館内限定') || desc.includes('図書館送信') || desc.includes('library')) return NDL_ACCESS_LIBRARY;
    return NDL_ACCESS_UNKNOWN;
}
function escapeCQL(s){ return String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"'); }
async function searchNDLAll(query){
    const all = [];
    const recordsPerBatch = 50;
    const maxBatches = 20;
    const q = escapeCQL(query);
    const cql = `title="${q}" OR creator="${q}" OR description="${q}"`;
    for(let batch = 0; batch < maxBatches; batch++){
        const startRecord = batch * recordsPerBatch + 1;
        const params = new URLSearchParams({ operation: 'searchRetrieve', query: cql, startRecord: String(startRecord), maximumRecords: String(recordsPerBatch), recordSchema: 'info:srw/schema/1/dc-v1.1' });
        try{
            const res = await fetchWithTimeout(CORS_PROXIES.aoi(`${NDL_SRU_ENDPOINT}?${params}`), {}, FETCH_TIMEOUT_API);
            if(!res.ok) break;
            const xml = await res.text();
            const doc = new DOMParser().parseFromString(xml, 'text/xml');
            const records = [];
            doc.querySelectorAll('record').forEach(rec => {
                const get = (tag) => { const el = rec.querySelector(tag); return el ? el.textContent.trim() : ''; };
                const identifier = get('identifier');
                const pidMatch = identifier.match(/(\d{6,})/);
                const record = { title: get('title'), creator: get('creator'), date: get('date'), identifier, pid: pidMatch ? pidMatch[1] : null, description: get('description'), type: get('type') };
                record.accessLevel = detectNDLAccessLevel(record);
                records.push(record);
            });
            const withPid = records.filter(r => r.pid);
            if(!withPid.length) break;
            all.push(...withPid);
            if(records.length < recordsPerBatch) break;
        }catch(e){ break; }
    }
    return all;
}
async function fetchNDLOcrFullText(pid){
    const url = `${NDL_BOOK_API}/${pid}/text`;
    try{ const res = await fetchWithTimeout(CORS_PROXIES.aoi(url), {}, FETCH_TIMEOUT_BOOK); if(!res.ok){ console.warn('[NDL] OCR API HTTP', res.status, url); return null; } const data = await res.json(); if(!data || !data.pages || !data.pages.length) return null;
        const pages = []; for(const p of data.pages){ const text = p.contents || p.text || ''; if(text && text.trim()) pages.push({ page: p.page || pages.length + 1, text: text.trim() }); }
        return pages.length ? pages : null;
    }catch(e){ console.warn('[NDL] OCR全文取得失敗:', e.message); return null; }
}
async function fetchNDLIIIFManifest(pid){ const url = `${NDL_IIIF_BASE}/${pid}/manifest.json`; const res = await fetchWithTimeout(CORS_PROXIES.aoi(url), {}, FETCH_TIMEOUT_API); if(!res.ok) throw new Error(`IIIF HTTP ${res.status}`); return await res.json(); }
function extractNDLImageUrls(manifest){
    const urls = [];
    const sequences = manifest.sequences || (manifest.items ? [manifest] : []);
    for(const seq of sequences){
        const canvases = seq.canvases || seq.items || [];
        for(const c of canvases){ const images = c.images || []; for(const img of images){ const res = img.resource || img; const id = res['@id'] || res.id; if(id) urls.push(id); } }
    }
    return urls;
}
async function downloadAndSaveNDL(pid, titleHint, silent){
    silent = !!silent;
    const key = 'ndl_' + pid;
    if(!silent){ setStatus("search-status", `「${titleHint || pid}」を取得中...`, 'info'); showToast(`取得開始: ${titleHint || pid}`, 'info'); }
    try{
        try{ const records = await searchNDLAll(titleHint || pid); const target = records.find(r => r.pid === pid); if(target && target.accessLevel !== NDL_ACCESS_PUBLIC){ const lvl = target.accessLevel === NDL_ACCESS_PERSONAL ? '個人送信限定' : target.accessLevel === NDL_ACCESS_LIBRARY ? '館内限定' : '公開範囲不明'; throw new Error(`この資料は${lvl}のため取得できません`); } }catch(e){ if(e.message && e.message.includes('ため取得できません')) throw e; }
        const ocrPages = await fetchNDLOcrFullText(pid);
        if(ocrPages && ocrPages.length > 0){
            const rawParas = [];
            for(const p of ocrPages){ const lines = p.text.split(/\n+/).map(s => s.trim()).filter(Boolean); rawParas.push(...lines); }
            if(!rawParas.length) throw new Error('OCRテキストが空でした');
            const paras = rawParas.map(t => ({ tag: 'p', text: t, classes: [], html: escapeHtml(t) }));
            const ch = paras.map(p => `<p>${p.html}</p>`).join('');
            const bd = { id: key, title: titleHint || pid, author: '', content: ch, contentTranslated: "", paragraphs: paras, translatedTexts: new Array(paras.length).fill(null), translationStatus: 'done', translationDone: paras.length, translationTotal: paras.length, sourceLang: 'ja', targetLang: 'ja', bookmark: null, source: 'ndl', sourceInfo: { pid, hasOcr: true, accessLevel: NDL_ACCESS_PUBLIC }, savedAt: new Date().toISOString(), sortOrder: Date.now(), favorite: false, formatVersion: BOOK_FORMAT_VERSION, featureVersion: FEATURE_VERSION };
            await saveBookToDB(bd);
            if(!silent){ setStatus("search-status", "保存完了！", 'success'); showToast(`「${titleHint || pid}」保存完了（${paras.length}段落 / OCR全文）`, 'success'); openReader(bd); }
            return bd;
        }
        const manifest = await fetchNDLIIIFManifest(pid);
        const imageUrls = extractNDLImageUrls(manifest);
        const bd = { id: key, title: titleHint || pid, author: '', content: `<p class="loading-msg">この資料はOCR全文がありません。NDLデジタルコレクションで閲覧してください。</p>`, contentTranslated: "", paragraphs: [], translatedTexts: [], translationStatus: 'done', translationDone: 0, translationTotal: 0, sourceLang: 'ja', targetLang: 'ja', bookmark: null, source: 'ndl', sourceInfo: { pid, hasOcr: false, imageUrls, viewerUrl: `https://dl.ndl.go.jp/pid/${pid}`, accessLevel: NDL_ACCESS_PUBLIC }, savedAt: new Date().toISOString(), sortOrder: Date.now(), favorite: false, formatVersion: BOOK_FORMAT_VERSION, featureVersion: FEATURE_VERSION };
        await saveBookToDB(bd);
        if(!silent){ setStatus("search-status", "保存完了（画像ビューアモード）", 'warn'); showToast(`「${titleHint || pid}」はOCR全文がないため、NDLビューアで開きます`, 'warn'); window.open(bd.sourceInfo.viewerUrl, '_blank'); }
        return bd;
    }catch(err){ if(!silent){ setStatus("search-status", `取得失敗: ${err.message}`, 'error'); showToast('NDL取得失敗: ' + err.message, 'error'); } throw err; }
}

async function redownloadOutdatedBooks(){
    let books;
    try { books = await getAllBooksFromDB(); } catch(e){ return; }
    const outdated = books.filter(b => b.featureVersion !== FEATURE_VERSION);
    if(!outdated.length) return;
    showToast(`古いデータ ${outdated.length}件 をバックグラウンドで再取得します`, 'info', 8000);
    if(outdated.some(b => b.source === 'aozora' && !b.sourceInfo)){ try { await fetchAozoraCatalog(); } catch(e){} }
    let ok = 0, failed = 0;
    for(const book of outdated){
        try{
            let si = book.sourceInfo;
            if(!si && book.source === 'aozora'){ const workId = book.id.replace(/^aozora_/, ''); if(aozora_catalog_ready){ const cat = aozora_catalog.find(c => c.workId === workId); if(cat) si = { workId: cat.workId, personId: cat.personId, title: cat.title, personName: cat.personName, zipName: cat.zipName }; } }
            if(!si && book.source === 'gutenberg') si = { bookId: book.id.replace(/^gutenberg_/, '') };
            if(!si && book.source === 'internetarchive') si = { identifier: book.id.replace(/^ia_/, '') };
            if(!si && book.source === 'wikisource'){ const m = book.id.match(/^wikisource_([a-z]+)_(\d+)$/); if(m) si = { lang: m[1], pageId: m[2] }; }
            if(!si && book.source === 'ndl') si = { pid: book.id.replace(/^ndl_/, '') };
            if(book.source === 'aozora' && si){ await downloadAndSaveAozora(si.workId, si.personId, si.title, si.personName, si.zipName || '', true); ok++; }
            else if(book.source === 'gutenberg' && si){ const rx = await fetchGutenbergBookById(si.bookId); v_project_cache[si.bookId] = rx; await downloadAndSaveGutenberg(si.bookId, true); ok++; }
            else if(book.source === 'internetarchive' && si){ await downloadAndSaveInternetArchive(si.identifier, book.title, true, true); ok++; }
            else if(book.source === 'wikisource' && si){ await downloadAndSaveWikisource(si.pageId, book.title, si.lang, true); ok++; }
            else if(book.source === 'ndl' && si){ await downloadAndSaveNDL(si.pid, book.title, true); ok++; }
            else { await safeDBOp(["books"], "readwrite", (tx, resolve, reject)=>{ tx.objectStore("books").delete(book.id); tx.oncomplete = ()=>resolve(); tx.onerror = ()=>reject(tx.error); }); }
        }catch(e){ failed++; try{ const b = await getBookFromDB(book.id); if(b){ b.featureVersion = FEATURE_VERSION; b.lastRedownloadError = e.message; await saveBookToDB(b); } }catch(_){} }
        await sleep(300);
    }
    if(ok > 0) showToast(`${ok}件の再取得が完了しました`, 'success', 5000);
    if(failed > 0) showToast(`${failed}件は再取得できませんでした`, 'warn', 6000);
    loadBookshelf();
}

function loadBookshelf(){

                const reprocessBtn = outdated ? `<button onclick="event.stopPropagation(); handleReprocessOne('${escapeHtml(b.id)}')">新形式で再処理</button>` : "";
                const isNDLViewerOnly = (b.source === 'ndl' && b.sourceInfo && b.sourceInfo.hasOcr === false);
                const ndlBtn = isNDLViewerOnly ? `<button onclick="event.stopPropagation(); window.open('${escapeHtml(b.sourceInfo.viewerUrl)}','_blank')">NDLで開く</button>` : "";

                    <td class="id-cell">

                            <span class="bar"></span><span class="bar"></span>
                        </span>
                        ${escapeHtml(b.id)}

                    <td>${escapeHtml(b.author)}</td>
                    <td>${updateBadge}<span class="trans-badge ${stCls}" data-status-for="${escapeHtml(b.id)}"${errTitle}>${st}</span></td>
                    <td onclick="event.stopPropagation()">
                        <div class="menu-wrap">
                            <button class="dots-btn" onclick="toggleRowMenu(event, '${escapeHtml(b.id)}')">...</button>
                            <div class="row-menu" id="menu-${escapeHtml(b.id)}">
                                ${ndlBtn}${reprocessBtn}${retryBtn}

                            </div>
                        </div>
                    </td>

function swapBookOrder(idA, idB){
    safeDBOp(["books"], "readwrite", (tx, resolve)=>{
        const st = tx.objectStore("books");
        const rqA = st.get(idA);
        rqA.onsuccess = ()=>{
            const a = rqA.result;
            const rqB = st.get(idB);
            rqB.onsuccess = ()=>{
                const b = rqB.result;
                if(!a || !b){ resolve(); return; }
                const orderA = (a.sortOrder != null) ? a.sortOrder : Infinity;
                const orderB = (b.sortOrder != null) ? b.sortOrder : Infinity;
                if(orderA === orderB){ const base = Date.now(); a.sortOrder = base; b.sortOrder = base + 1; }
                else { a.sortOrder = orderB; b.sortOrder = orderA; }
                st.put(a); st.put(b);
            };
        };
        tx.oncomplete = ()=>{ loadBookshelf(); resolve(); };
    }).catch(()=>{});
}
