<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>ヤマビコ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
    --bg-color:#f7f6f2;
    --text-color:#2b2b2b;
    --accent-color:#4a6fa5;
    --card-bg:#fff;
    --border-color:#e0e0e0;
    --font-family:'Georgia','Yu Mincho','Hiragino Mincho ProN',serif;
    --app-h: 100dvh;
    --ui-pad-x: clamp(12px, 2vw, 20px);
    --ui-pad-y: clamp(8px, 1.2vh, 12px);
    --reader-font: clamp(15px, 0.9vw + 12px, 19px);
    --reader-pad-x: clamp(16px, 3vw, 40px);
    --reader-pad-y: clamp(20px, 4vh, 40px);
    --reader-max-w: clamp(600px, 92vw, 900px);
    --tap-min: 40px;
}
body.dark-mode{--bg-color:#1a1a1a;--text-color:#d1d1d1;--accent-color:#6b8cce;--card-bg:#282828;--border-color:#404040;}
body.sepia-mode{--bg-color:#f4ecd8;--text-color:#5b4636;--accent-color:#8c6d53;--card-bg:#fbf0d9;--border-color:#e2d7c0;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
    background-color:var(--bg-color);
    color:var(--text-color);
    font-family:var(--font-family);
    transition:background-color .3s,color .3s;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:var(--app-h);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
}
header{
    flex-shrink:0;
    position:relative;
    z-index:100;
    padding-top:calc(var(--ui-pad-y) + env(safe-area-inset-top));
    padding-bottom:var(--ui-pad-y);
    padding-left:calc(var(--ui-pad-x) + env(safe-area-inset-left));
    padding-right:calc(var(--ui-pad-x) + env(safe-area-inset-right));
    background-color:var(--card-bg);
    border-bottom:1px solid var(--border-color);
    display:flex;
    justify-content:space-between;
    align-items:center;
}
h1{font-size:clamp(1rem, 0.5vw + 0.9rem, 1.2rem);font-weight:normal;letter-spacing:2px}
.nav-buttons button{
    min-height:var(--tap-min);
    background:none;
    border:1px solid var(--border-color);
    color:var(--text-color);
    padding:6px 12px;
    margin-left:8px;
    border-radius:4px;
    cursor:pointer;
}
.container{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.view-panel{flex:1;min-height:0;padding:var(--ui-pad-x);overflow-y:auto;display:none;overscroll-behavior:contain}
.view-panel.active{display:block}
.search-box{display:flex;gap:10px;max-width:800px;margin:0 auto 20px auto;align-items:center;flex-wrap:wrap}
.source-toggle{display:flex;flex-shrink:0;flex-wrap:wrap;gap:0}
.source-toggle button{padding:8px 14px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-color);cursor:pointer;font-size:.85rem;min-height:var(--tap-min);margin:0}
.source-toggle button:first-child{border-radius:4px 0 0 4px}
.source-toggle button:last-child{border-radius:0 4px 4px 0;border-left:none}
.source-toggle button.active{background:var(--accent-color);color:#fff;border-color:var(--accent-color)}
.source-toggle button:not(.active){opacity:.45}
.mode-toggle{display:flex;flex-shrink:0}
.mode-toggle button{padding:6px 10px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-color);cursor:pointer;font-size:.8rem;min-height:var(--tap-min)}
.mode-toggle button:first-child{border-radius:4px 0 0 4px}
.mode-toggle button:last-child{border-radius:0 4px 4px 0;border-left:none}
.mode-toggle button.active{background:var(--accent-color);color:#fff;border-color:var(--accent-color)}
.mode-toggle button:not(.active){opacity:.45}
.search-box input{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--border-color);border-radius:4px;background:var(--card-bg);color:var(--text-color);font-size:1rem;min-height:var(--tap-min)}
.search-box button{padding:10px 20px;background:var(--accent-color);color:#fff;border:none;border-radius:4px;cursor:pointer;min-height:var(--tap-min)}
.results-table{width:100%;border-collapse:collapse;background:var(--card-bg);box-shadow:0 2px 5px rgba(0,0,0,.05)}
.results-table th,.results-table td{padding:12px 15px;text-align:left;border-bottom:1px solid var(--border-color)}
.results-table th{background-color:rgba(0,0,0,.03);font-weight:bold}
.results-table tr:hover{background-color:rgba(0,0,0,.02);cursor:pointer}
.id-cell{display:flex;align-items:center;gap:10px}
.drag-handle{display:flex;flex-direction:column;gap:3px;width:16px;cursor:grab;flex-shrink:0}
.drag-handle:active{cursor:grabbing}
.drag-handle .bar{height:2px;background:var(--text-color);opacity:.4;border-radius:1px}
.results-table tr.drag-over-row{outline:2px dashed var(--accent-color);outline-offset:-2px}
.menu-wrap{position:relative;display:inline-block}
.dots-btn{background:none;border:none;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--text-color);padding:4px 10px;min-height:var(--tap-min);min-width:var(--tap-min)}
.row-menu{display:none;position:fixed;background:var(--card-bg);border:1px solid var(--border-color);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:5000;min-width:180px;overflow:hidden}
.row-menu.active{display:block}
.row-menu button{display:block;width:100%;text-align:left;padding:10px 14px;background:none;border:none;cursor:pointer;color:var(--text-color);font-size:.9rem;min-height:var(--tap-min)}
.row-menu button:hover{background:rgba(0,0,0,.05)}
#reader-view{flex:1;min-height:0;display:none;flex-direction:column;height:100%;position:relative;overflow:hidden}
#reader-view.active{display:flex}
.reader-toolbar{
    flex-shrink:0;
    padding-top:var(--ui-pad-y);
    padding-bottom:var(--ui-pad-y);
    padding-left:calc(var(--ui-pad-x) + env(safe-area-inset-left));
    padding-right:calc(var(--ui-pad-x) + env(safe-area-inset-right));
    background:var(--card-bg);
    border-bottom:1px solid var(--border-color);
    display:flex;
    gap:clamp(6px, 1vw, 10px);
    align-items:center;
    font-size:.9rem;
    flex-wrap:wrap;
}
.reader-toolbar button{padding:6px 12px;min-height:var(--tap-min);border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-color);border-radius:4px;cursor:pointer}
.reader-toolbar select{padding:4px 8px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-color);border-radius:4px;cursor:pointer;font-size:.9rem;min-height:36px}
.reader-toolbar .lang-group{display:flex;align-items:center;gap:4px;padding:2px 8px;border-left:1px solid var(--border-color);margin-left:4px}
.reader-content{
    flex:1;
    min-height:0;
    padding:var(--reader-pad-y) var(--reader-pad-x);
    overflow:auto;
    line-height:1.8;
    font-size:var(--reader-font);
    max-width:var(--reader-max-w);
    margin:0 auto;
    width:100%;
    overscroll-behavior:contain;
}
#reader-body.book-mode{
    overflow:hidden;
    cursor:pointer;
    max-width:none;
    padding:30px 20px;
    width:100%;
    height:100%;
    position:relative;
    overscroll-behavior:contain;
}
#reader-body.book-mode #reader-flow{
    will-change:transform;
    backface-visibility:hidden;
}
#reader-body.book-mode::after{
    content:'';
    position:absolute;
    top:0;bottom:0;
    width:90px;
    pointer-events:none;
    z-index:20;
    opacity:0;
    transition:opacity .2s ease;
}
#reader-body.book-mode:not(.rtl).turning-next::after{
    right:0;
    background:linear-gradient(to left,rgba(0,0,0,.22),rgba(0,0,0,0));
    opacity:1;
}
#reader-body.book-mode:not(.rtl).turning-prev::after{
    left:0;
    background:linear-gradient(to right,rgba(0,0,0,.22),rgba(0,0,0,0));
    opacity:1;
}
#reader-body.book-mode.rtl.turning-next::after{
    left:0;
    background:linear-gradient(to right,rgba(0,0,0,.22),rgba(0,0,0,0));
    opacity:1;
}
#reader-body.book-mode.rtl.turning-prev::after{
    right:0;
    background:linear-gradient(to left,rgba(0,0,0,.22),rgba(0,0,0,0));
    opacity:1;
}

#page-nav{display:none;align-items:center;gap:8px;font-size:.9rem}
#page-nav.active{display:flex}
#page-nav.rtl{flex-direction:row-reverse}
#page-nav button{padding:6px 12px;min-height:36px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-color);border-radius:4px;cursor:pointer;font-size:.85rem}
#page-nav #page-indicator{white-space:nowrap;padding:0 4px;opacity:.8}

.status-msg{text-align:center;padding:20px;font-size:.95rem;opacity:.8;font-weight:bold}
.status-msg.error{color:#d9534f}
.status-msg.success{color:#4caf50}
.status-msg.info{color:var(--accent-color)}
.trans-badge{font-size:.8rem;color:var(--accent-color);white-space:nowrap}
.trans-badge.error{color:#d9534f}
.trans-badge.done{color:#4caf50}
.update-badge{display:inline-block;font-size:.8rem;color:#f0ad4e;font-weight:bold;margin-right:6px;cursor:help}
.bookshelf-filters{display:flex;gap:12px;max-width:700px;margin:0 auto 16px auto;align-items:center;flex-wrap:wrap}
.bookshelf-filters input[type="text"]{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--border-color);border-radius:4px;background:var(--card-bg);color:var(--text-color);font-size:.95rem;min-height:36px}
.bookshelf-filters label{display:flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer;white-space:nowrap;min-height:var(--tap-min)}
.reprocess-all-btn{padding:8px 14px;border:1px solid #f0ad4e;background:#f0ad4e;color:#fff;border-radius:4px;cursor:pointer;font-size:.9rem;font-weight:bold;white-space:nowrap;min-height:var(--tap-min)}
.reprocess-all-btn:hover{background:#ec971f;border-color:#ec971f}
.reprocess-all-btn:disabled{opacity:.6;cursor:default}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;align-items:center;justify-content:center;padding:16px}
.modal-overlay.active{display:flex}
.modal-box{background:var(--card-bg);color:var(--text-color);padding:26px 30px;border-radius:8px;max-width:320px;width:100%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.modal-box p{margin-bottom:20px;line-height:1.6}
.modal-buttons{display:flex;gap:10px;justify-content:center}
.modal-buttons button{padding:8px 20px;border-radius:4px;border:1px solid var(--border-color);cursor:pointer;background:var(--card-bg);color:var(--text-color);font-size:.9rem;min-height:var(--tap-min)}
.modal-buttons button.danger{background:#d9534f;color:#fff;border-color:#d9534f}
.toast-container{position:fixed;top:calc(60px + env(safe-area-inset-top));right:16px;z-index:10000;display:flex;flex-direction:column;gap:8px;max-width:380px;pointer-events:none}
.toast{background:var(--card-bg);color:var(--text-color);border:1px solid var(--border-color);border-left:4px solid var(--accent-color);border-radius:6px;padding:10px 14px;box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:.88rem;line-height:1.5;animation:slideIn .25s ease;pointer-events:auto;word-break:break-word}
.toast.error{border-left-color:#d9534f}
.toast.success{border-left-color:#4caf50}
.toast.warn{border-left-color:#f0ad4e}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
#reading-title{margin-left:auto;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40%}
.close-reader-btn{margin-left:15px}
.header-title-wrap{display:flex;align-items:center;gap:10px;}
#header-spinner{display:none;width:14px;height:14px;border:2px solid var(--border-color);border-top-color:var(--accent-color);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
#header-spinner.active{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#error-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:99999;background:#d9534f;color:#fff;padding:12px 44px 12px 16px;font-family:system-ui,'Yu Gothic',sans-serif;font-size:.9rem;line-height:1.55;box-shadow:0 2px 10px rgba(0,0,0,.35);word-break:break-word;max-height:40vh;overflow-y:auto}
#error-banner.active{display:block}
#error-banner .eb-close{position:absolute;top:6px;right:8px;background:none;border:none;color:#fff;font-size:1.5rem;line-height:1;cursor:pointer;padding:2px 8px;border-radius:4px}
#error-banner .eb-close:hover{background:rgba(255,255,255,.18)}
#error-banner .eb-title{font-weight:bold;margin-right:6px}
#error-banner .eb-detail{opacity:.9;font-size:.82rem;margin-top:4px;font-family:monospace;white-space:pre-wrap}
.reader-content h1{font-size:1.7rem;margin:1.8em 0 .8em;text-align:center;font-weight:bold;line-height:1.4}
.reader-content h2{font-size:1.5rem;margin:1.8em 0 .8em;text-align:center;font-weight:bold;line-height:1.4}
.reader-content h3{font-size:1.25rem;margin:1.5em 0 .7em;font-weight:bold;line-height:1.4}
.reader-content h4{font-size:1.08rem;margin:1.2em 0 .5em;font-weight:bold;line-height:1.4}
.reader-content .align-center{text-align:center;}
.reader-content ruby rt{font-size:.55em;letter-spacing:0;line-height:1}
.reader-content .indent-1{padding-left:1em}
.reader-content .indent-2{padding-left:2em}
.reader-content .indent-3{padding-left:3em}
.reader-content .indent-4{padding-left:4em}
.reader-content .indent-5{padding-left:5em}
.reader-content .indent-6{padding-left:6em}
.reader-content .indent-7{padding-left:7em}
.reader-content .indent-8{padding-left:8em}
.reader-content .indent-9{padding-left:9em}
.reader-content .indent-10{padding-left:10em}
.reader-content .boten{font-style:normal;text-emphasis:filled dot;-webkit-text-emphasis:filled dot;}
.reader-content .boten-maru{font-style:normal;text-emphasis:filled circle;-webkit-text-emphasis:filled circle;}
.reader-content .boten-shiromaru{font-style:normal;text-emphasis:open circle;-webkit-text-emphasis:open circle;}
.reader-content .boten-double{font-style:normal;text-emphasis:double-circle;-webkit-text-emphasis:double-circle;}
.reader-content .boten-snake{font-style:normal;text-emphasis:open dot;-webkit-text-emphasis:open dot;}
.reader-content .boten-line{text-decoration:underline;font-style:normal;}
.reader-content .boten-doubleline{text-decoration:underline double;font-style:normal;}
.reader-content .boten-dash{text-decoration:underline dashed;font-style:normal;}
.reader-content .boten-wave{text-decoration:underline wavy;font-style:normal;}
.reader-content .boten-chain{text-decoration:underline dashed;font-style:normal;}
.reader-content .warichu{font-size:.68em;line-height:1;padding:0 .1em;vertical-align:middle;}
.reader-content .keigakomi{border:1px solid currentColor;padding:.4em .9em;margin:.3em 0;border-radius:2px;}
.reader-content .tate-chu-yoko{text-combine-upright:all;-webkit-text-combine:horizontal;}
.reader-content strong{font-weight:bold;}
.reader-content em{font-style:italic;}
.reader-content sup{font-size:.7em;vertical-align:super;line-height:0;}
.reader-content sub{font-size:.7em;vertical-align:sub;line-height:0;}
.reader-content .loading-msg{text-align:center;padding:60px 20px;opacity:.5;font-size:.95rem;}

.settings-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8000}
.settings-backdrop.active{display:block}
.settings-panel{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:90vw;background:var(--card-bg);border-left:1px solid var(--border-color);box-shadow:-4px 0 20px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .25s ease;z-index:8100;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
.settings-panel.active{transform:translateX(0)}
.settings-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border-color);padding-top:calc(16px + env(safe-area-inset-top))}
.settings-header h2{font-size:1.1rem;font-weight:normal}
.settings-close{background:none;border:none;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--text-color);padding:4px 10px;border-radius:4px;min-width:var(--tap-min);min-height:var(--tap-min)}
.settings-close:hover{background:rgba(0,0,0,.05)}
.settings-body{flex:1;overflow-y:auto;padding:20px;overscroll-behavior:contain}
.settings-group{margin-bottom:24px}
.settings-group > label{display:block;font-size:.85rem;font-weight:bold;margin-bottom:8px;opacity:.7}
.settings-options{display:flex;gap:8px;flex-wrap:wrap}
.settings-options button{flex:1;min-width:70px;padding:8px 12px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-color);border-radius:4px;cursor:pointer;font-size:.88rem;min-height:var(--tap-min)}
.settings-options button.active{background:var(--accent-color);color:#fff;border-color:var(--accent-color)}
.settings-select{width:100%;padding:8px 12px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-color);border-radius:4px;font-size:.95rem;min-height:var(--tap-min)}
.settings-info{font-size:.78rem;opacity:.6;margin-top:6px;line-height:1.5}
.settings-btn{background:none;border:1px solid var(--border-color);color:var(--text-color);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:.9rem}

@media (max-width: 1024px){
    #reading-title{font-size:.9rem;max-width:35%}
}

@media (max-width: 768px){
    .view-panel{padding:clamp(10px, 2.5vw, 14px)}
    .search-box{gap:8px;max-width:100%;margin-bottom:14px;}
    .search-box input{flex:1 1 100%;order:-1;min-width:0;}
    .results-table th, .results-table td{padding:9px 10px;font-size:.86rem;}
    #reading-title{order:-1;flex:1 1 100%;margin-left:0;padding:0 0 6px 0;border-bottom:1px solid var(--border-color);font-size:.88rem;max-width:100%}
    .close-reader-btn{margin-left:auto}
    #page-nav{order:2}
    #reader-body.book-mode{padding:20px 14px}
    .bookshelf-filters{flex-direction:column;align-items:stretch;gap:8px;}
    .bookshelf-filters input[type="text"]{min-width:0}
    .reprocess-all-btn{width:100%}
}

@media (max-width: 480px){
    header{flex-direction:column;align-items:stretch;gap:8px}
    .header-title-wrap{justify-content:center;}
    h1{text-align:center}
    .nav-buttons{display:flex;gap:8px}
    .nav-buttons button{flex:1;margin:0;padding:8px 0;font-size:.9rem;}
    .search-box{flex-direction:column;align-items:stretch;gap:8px;}
    .search-box input{width:100%}
    .search-box > button{width:100%}
    .source-toggle, .mode-toggle{align-self:center}
    .results-table th, .results-table td{padding:8px;font-size:.82rem;white-space:normal;}
    .reader-toolbar{gap:6px;}
    #page-nav{gap:6px;font-size:.8rem;}
    #page-nav button{padding:5px 8px;font-size:.78rem;min-height:32px}
    #page-nav #page-indicator{font-size:.78rem}
    #reader-body.book-mode{padding:14px 10px}
    .modal-box{padding:22px 20px}
    .toast-container{top:auto;bottom:calc(16px + env(safe-area-inset-bottom));left:16px;right:16px;max-width:none;}
    #error-banner{font-size:.82rem;padding:10px 40px 10px 12px}
    .settings-panel{width:100%;max-width:100vw}
}

@media (orientation: landscape) and (max-height: 500px){
    header{
        padding-top:calc(6px + env(safe-area-inset-top));
        padding-bottom:6px;
    }
    h1{font-size:.95rem}
    .reader-toolbar{
        padding-top:4px;padding-bottom:4px;gap:4px;
    }
    .reader-toolbar button{padding:4px 8px;font-size:.78rem;min-height:32px}
    #reading-title{font-size:.85rem;max-width:40%}
    .view-panel{padding:10px}
    #reader-body.book-mode{padding:10px}
    .nav-buttons button{min-height:32px;padding:4px 10px}
}

@media (min-width: 1200px){
    .reader-content{line-height:1.9}
    .view-panel{padding:30px}
}
</style>
</head>
<body>

<div id="error-banner">
    <span class="eb-title">エラー:</span>
    <span class="eb-msg"></span>
    <div class="eb-detail"></div>
    <button class="eb-close" onclick="document.getElementById('error-banner').classList.remove('active')">×</button>
</div>

<header>
    <div class="header-title-wrap">
        <h1>ヤマビコ</h1>
        <span id="header-spinner" title="読み込み中"></span>
    </div>
    <div class="nav-buttons">
        <button onclick="switchTab('search')">検索</button>
        <button onclick="switchTab('bookshelf')">本棚</button>
    </div>
</header>

<div class="container">
    <div id="search-view" class="view-panel active">
        <div class="search-box">
            <div class="source-toggle">

    if(window.visualViewport){

async function fetchWithTimeout(url, options, timeoutMs){

function shuffled(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
}

function decodeJapaneseText(buf){
    if(buf.byteLength >= 3){
        const b0 = buf[0], b1 = buf[1], b2 = buf[2];
        if(b0 === 0xEF && b1 === 0xBB && b2 === 0xBF){
            return new TextDecoder('utf-8').decode(buf);
        }
    }
    let sjis = '', utf8 = '';
    try{ sjis = new TextDecoder('shift_jis').decode(buf); }catch(e){ sjis = ''; }
    try{ utf8 = new TextDecoder('utf-8').decode(buf); }catch(e){ utf8 = ''; }
    const sjisBad = (sjis.match(/\uFFFD/g) || []).length;
    const utf8Bad = (utf8.match(/\uFFFD/g) || []).length;
    if(utf8Bad === 0 && sjisBad > 0) return utf8;
    if(sjisBad === 0 && utf8Bad > 0) return sjis;
    return sjisBad <= utf8Bad ? sjis : utf8;
}

/* ============================================================
   IndexedDB
   ============================================================ */
function initDB(){
    return new Promise((resolve, reject)=>{
        const req = indexedDB.open("YamabikoDB", 2);
        req.onupgradeneeded = (e)=>{
            const db = e.target.result;
            if(!db.objectStoreNames.contains("books")) db.createObjectStore("books",{keyPath:"id"});
            if(!db.objectStoreNames.contains("cache")) db.createObjectStore("cache",{keyPath:"key"});
        };
        req.onsuccess = (e)=>{
            maji_de_db = e.target.result;
            db_closing = false;
            maji_de_db.onversionchange = ()=>{ db_closing = true; try{ maji_de_db.close(); }catch(_){} maji_de_db = null; };
            maji_de_db.onclose = ()=>{ db_closing = true; maji_de_db = null; };
            resolve(maji_de_db);
        };
        req.onerror = (e)=>reject(e.target.error);
        req.onblocked = ()=>showToast('他のタブでヤマビコが開かれています。そちらを閉じて再読み込みしてください。', 'warn', 12000);
    });
}
async function ensureDB(){
    if(maji_de_db && !db_closing) return maji_de_db;
    await initDB();
    return maji_de_db;
}
async function safeDBOp(storeNames, mode, fn){
    await ensureDB();
    return new Promise((resolve, reject)=>{
        let tx;
        try{ tx = maji_de_db.transaction(storeNames, mode); }
        catch(e){
            initDB().then(()=>{
                try{ const tx2 = maji_de_db.transaction(storeNames, mode); fn(tx2, resolve, reject); }
                catch(e2){ reject(e2); }
            }).catch(reject);
            return;
        }
        fn(tx, resolve, reject);
    });
}
function getBookFromDB(bookId){
    return safeDBOp(["books"], "readonly", (tx, resolve, reject)=>{
        const rq = tx.objectStore("books").get(bookId);
        rq.onsuccess = ()=>resolve(rq.result || null);
        rq.onerror = ()=>reject(rq.error);
    });
}
function getAllBooksFromDB(){
    return safeDBOp(["books"], "readonly", (tx, resolve, reject)=>{
        const rq = tx.objectStore("books").getAll();
        rq.onsuccess = ()=>resolve(rq.result || []);
        rq.onerror = ()=>reject(rq.error);
    });
}
function saveBookToDB(book){
    return safeDBOp(["books"], "readwrite", (tx, resolve, reject)=>{
        tx.objectStore("books").put(book);
        tx.oncomplete = ()=>resolve();
        tx.onerror = ()=>reject(tx.error);
    });
}
function getCacheFromDB(key){

}
function saveCacheToDB(key, value){

        tx.objectStore("cache").put({key, value, savedAt: new Date().toISOString()});
        tx.oncomplete = ()=>resolve();
        tx.onerror = ()=>reject(tx.error);
    });
}

function buildAozoraParagraphs(rawParas){
    const result = [];
    let indentRange = 0;
    let keigakomiRange = false;

    for(const raw of rawParas){
        let text = raw;
        let tag = 'p';
        let indent = indentRange;
        let alignCenter = false;
        let m;

        let keigakomiHere = keigakomiRange;
        if(text.includes('［＃罫囲み］')){
            keigakomiRange = true;
            keigakomiHere = true;
            text = text.replace(/［＃罫囲み］/g, '');
        }
        let keigakomiEndHere = false;
        if(text.includes('［＃罫囲み終わり］')){
            keigakomiEndHere = true;
            text = text.replace(/［＃罫囲み終わり］/g, '');
        }

        const hm = text.match(/［＃「(.+?)」は(大|中|小)見出し］/);
        if(hm){
            tag = hm[2] === '大' ? 'h2' : hm[2] === '中' ? 'h3' : 'h4';
            text = text.replace(/［＃「.+?」は(?:大|中|小)見出し］/g, '');
        }

        while((m = text.match(/［＃ここから(\d+)字下げ］/))){
            indentRange = parseInt(m[1], 10);
            indent = indentRange;
            text = text.replace(m[0], '');
        }
        while((m = text.match(/［＃ここで字下げ終わり］/))){
            indent = indentRange;
            indentRange = 0;
            text = text.replace(m[0], '');
        }
        while((m = text.match(/［＃(\d+)字下げ］/))){
            indent = Math.max(indent, parseInt(m[1], 10));
            text = text.replace(m[0], '');
        }
        while((m = text.match(/［＃地から(\d+)字上げ］/))){
            indent = Math.max(indent, parseInt(m[1], 10));
            text = text.replace(m[0], '');
        }

        if(/［＃(?:中央寄せ|中央揃え|ページの左右中央)］/.test(text)){
            alignCenter = true;
            text = text.replace(/［＃(?:中央寄せ|中央揃え|ページの左右中央)］/g, '');
        }

        const emphTargets = [];
        while((m = text.match(/［＃「(.+?)」に(二重丸傍点|白丸傍点|丸傍点|蛇の目傍点|二重傍線|傍点|傍線|破線|波線|鎖線)］/))){
            emphTargets.push({text: m[1], type: m[2]});
            text = text.replace(m[0], '');
        }

        text = text.replace(/［＃割[り]?注］([\s\S]*?)［＃割[り]?注終わり］/g, (_, c)=>MK_WARI + c + MK_WARI_E);
        text = text.replace(/［＃太字］([\s\S]*?)［＃太字終わり］/g, (_, c)=>MK_BOLD + c + MK_BOLD_E);
        text = text.replace(/［＃斜体］([\s\S]*?)［＃斜体終わり］/g, (_, c)=>MK_ITAL + c + MK_ITAL_E);
        text = text.replace(/［＃縦中横］([\s\S]*?)［＃縦中横終わり］/g, (_, c)=>MK_TATE + c + MK_TATE_E);
        text = text.replace(/［＃上付き小文字］([\s\S]*?)［＃上付き小文字終わり］/g, (_, c)=>MK_SUP + c + MK_SUP_E);
        text = text.replace(/［＃下付き小文字］([\s\S]*?)［＃下付き小文字終わり］/g, (_, c)=>MK_SUB + c + MK_SUB_E);

        text = text.replace(/［＃(?:改ページ|改丁|改段|本文中改ページ)］/g, '');
        text = text.replace(/［＃改行］/g, MK_BR);
        text = text.replace(/［＃[^］]*］/g, '');

        if(!text.trim()) continue;

        const classes = [];
        if(indent > 0) classes.push('indent-' + Math.min(indent, 10));
        if(alignCenter) classes.push('align-center');
        if(keigakomiHere) classes.push('keigakomi');

        let html = escapeHtml(text);
        html = html.replace(/\x01WARI\x01([\s\S]*?)\x01WARIEND\x01/g, (_, c)=>`<span class="warichu">${c}</span>`);
        html = html.replace(/\x01BOLD\x01([\s\S]*?)\x01BOLDEND\x01/g, (_, c)=>`<strong>${c}</strong>`);
        html = html.replace(/\x01ITAL\x01([\s\S]*?)\x01ITALEND\x01/g, (_, c)=>`<em>${c}</em>`);
        html = html.replace(/\x01TATE\x01([\s\S]*?)\x01TATEEND\x01/g, (_, c)=>`<span class="tate-chu-yoko">${c}</span>`);
        html = html.replace(/\x01SUP\x01([\s\S]*?)\x01SUPEND\x01/g, (_, c)=>`<sup>${c}</sup>`);
        html = html.replace(/\x01SUB\x01([\s\S]*?)\x01SUBEND\x01/g, (_, c)=>`<sub>${c}</sub>`);
        html = html.replace(/\x01BR\x01/g, '<br>');

        html = html.replace(/｜([^｜《》\n]+?)《([^》\n]+)》/g, '<ruby>$1<rt>$2</rt></ruby>');
        html = html.replace(/([一-龥々]+)《([^》\n]+)》/g, '<ruby>$1<rt>$2</rt></ruby>');

        for(const tgt of emphTargets){
            const escTgt = escapeHtml(tgt.text);
            const idx = html.lastIndexOf(escTgt);
            if(idx < 0) continue;
            const cls = emphClassFor(tgt.type);
            html = html.slice(0, idx) + `<em class="${cls}">${escTgt}</em>` + html.slice(idx + escTgt.length);
        }

        const plainText = text.replace(/\x01[A-Z]+\x01/g, '').replace(/\n/g, ' ').trim();
        result.push({tag, text: plainText, classes, html});

        if(keigakomiEndHere) keigakomiRange = false;
    }

    return result;
}

async function reprocessBook(bookId){
    const book = await getBookFromDB(bookId);
    if(!book) return {ok:false, reason:'本が見つかりません'};
    if(!isBookOutdated(book)) return {ok:true, skipped:true};

    const newParas = buildAozoraParagraphs(book.rawParas);
    const newCh = newParas.map(p=>{
        const cls = (p.classes && p.classes.length) ? ` class="${p.classes.join(' ')}"` : '';
        const inner = (p.html != null) ? p.html : escapeHtml(p.text);
        return `<${p.tag}${cls}>${inner}</${p.tag}>`;
    }).join('');

    const oldTexts = Array.isArray(book.translatedTexts) ? book.translatedTexts : [];
    let newTexts = oldTexts.length === newParas.length ? oldTexts.slice() : new Array(newParas.length).fill(null);

    book.paragraphs = newParas;
    book.content = newCh;
    book.translatedTexts = newTexts;
    book.translationTotal = newParas.length;
    if(book.source === 'aozora'){ book.translationStatus = 'done'; book.translationDone = newParas.length; }
    else if(book.translationStatus === 'done'){ book.translationDone = newParas.length; }
    book.formatVersion = BOOK_FORMAT_VERSION;

    await saveBookToDB(book);
    return {ok:true, updated:true, paragraphCount: newParas.length};
}

async function reprocessAllBooks(onProgress){
    const books = await getAllBooksFromDB();
    const outdated = books.filter(b => isBookOutdated(b));
    if(!outdated.length) return {total:0, updated:0, failed:0};
    let updated = 0, failed = 0;
    for(let i=0; i<outdated.length; i++){
        try{
            const r = await reprocessBook(outdated[i].id);
            if(r.ok && r.updated) updated++;
            else if(!r.ok) failed++;
        }catch(e){ failed++; }
        if(typeof onProgress === 'function') onProgress(i+1, outdated.length);
    }
    return {total: outdated.length, updated, failed};
}

async function countOutdatedBooks(){
    const books = await getAllBooksFromDB();
    return books.filter(b => isBookOutdated(b)).length;
}

    closeAllRowMenus();

            loadBookshelf();

}

async function getAuthorEnglishNameFromWikipedia(jpName){
    if(/^[a-zA-Z0-9\s]+$/.test(jpName)) return null;
    try{
        const api = `https://ja.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(jpName)}&gsrlimit=5&prop=langlinks&lllang=en&format=json&origin=*&indexpageids=1`;
        const res = await fetchWithTimeout(CORS_PROXIES.aoi(api), {}, FETCH_TIMEOUT_API);
        const data = await res.json();
        const q = data && data.query;
        if(!q || !q.pages) return null;
        const ids = (q.pageids && q.pageids.length) ? q.pageids : Object.keys(q.pages);
        for(const id of ids){
            const p = q.pages[id];
            if(!p) continue;
            if(p.title && /曖昧さ回避|一覧|の作品|作品一覧/.test(p.title)) continue;
            const ll = p.langlinks;
            if(ll && ll[0] && ll[0]["*"]) return ll[0]["*"];
        }
    }catch(e){}
    return null;
}

async function fetchAozoraCatalog(){
    if(aozora_catalog_loading || aozora_catalog_ready) return;
    aozora_catalog_loading = true;
    showHeaderSpinner();
    try{
        const cached = await getCacheFromDB(CATALOG_CACHE_KEY);
        if(cached && cached.value && cached.value.length > 100 && cached.value[0].zipName !== undefined){
            aozora_catalog = cached.value;
            aozora_catalog_ready = true;
            aozora_catalog_loading = false;
            console.log(`[青空文庫] キャッシュから読み込み (${aozora_catalog.length}件)`);
            hideHeaderSpinner();
            return;
        }
    }catch(e){}

    console.log('[青空文庫] カタログ取得開始...');
    let catalog = null;
    let lastErr = '';

    for(const src of AOZORA_CATALOG_SOURCES){
        if(catalog) break;
        try{
            const fetchUrl = src.proxy ? CORS_PROXIES[src.proxy](src.url) : src.url;
            const res = await fetchWithTimeout(fetchUrl, { cache: 'no-store' }, FETCH_TIMEOUT_BOOK);
            if(!res.ok){ lastErr = `${src.name}: HTTP ${res.status}`; continue; }
            const text = await res.text();
            if(!text || text.length < 10000){ lastErr = `${src.name}: 短すぎる`; continue; }
            const json = JSON.parse(text);
            catalog = parseAozoraCardJson(json);
        }catch(e){
            lastErr = `${src.name}: ${e.message}`;
        }
    }

    if(!catalog || !catalog.length){
        aozora_catalog_loading = false;
        hideHeaderSpinner();
        showErrorBanner('青空文庫カタログの取得に失敗しました。', `最終エラー: ${lastErr}`);
        return;
    }

    aozora_catalog = catalog;
    aozora_catalog_ready = true;
    aozora_catalog_loading = false;
    try{ await saveCacheToDB(CATALOG_CACHE_KEY, catalog); }catch(e){}
    hideHeaderSpinner();
    showToast(`青空文庫カタログ読み込み完了（${catalog.length}件）`, 'success', 5000);
}

function extractZipFilename(card){
    const checks = [
        () => card.download && typeof card.download === 'string' ? card.download : null,
        () => card.download && card.download.filename,
        () => card.download && card.download.file,
        () => card.download && card.download.zip,
        () => card.zip && card.zip.filename,
        () => card.zip_file,
        () => card.filename,
        () => card.file && card.file.filename,
        () => card.title && card.title.download && card.title.download.filename,
        () => card.title && card.title.zip_file,
        () => card.title && card.title.file,
        () => card.title && card.title.zip,
        () => card.files && Array.isArray(card.files) && card.files[0] && (card.files[0].filename || card.files[0].name),
        () => card.text_url,
        () => card.url && typeof card.url === 'string' && card.url.includes('/files/') ? card.url : null
    ];
    for(const c of checks){
        try{
            const v = c();
            if(typeof v === 'string' && v.trim()){
                const s = v.trim();
                if(s.includes('/files/')){
                    const m = s.match(/\/([^\/]+\.zip)(?:[?#].*)?$/i);
                    if(m) return m[1];
                }
                if(/\.zip$/i.test(s)) return s;
            }
        }catch(e){}
    }
    return '';
}

function parseAozoraCardJson(json){
    const catalog = [];
    const arr = Array.isArray(json) ? json : (json.cards || json.data || []);
    for(const card of arr){
        try{
            const t = card.title || {};
            const workId = String(t.work_id || card.work_id || '').trim();
            const title = String(t.title || card.title_str || '').trim();
            const personId = String(t.person_id || t.author_num || card.person_id || card.author_id || '').trim();
            const personName = String(t.person_name || card.person_name || card.author || '').trim();
            if(!workId || !title) continue;
            const zipName = extractZipFilename(card);
            catalog.push({
                workId, title, personId, personName, zipName,
                cardUrl: personId && workId ? `https://www.aozora.gr.jp/cards/${personId}/card${workId}.html` : '',
                htmlUrl: ''
            });
        }catch(e){}
    }
    return catalog;
}

async function searchAozora(query){
    if(!aozora_catalog_ready){
        if(!aozora_catalog_loading) fetchAozoraCatalog();
        let waited = 0;
        while(!aozora_catalog_ready && waited < 90000){ await sleep(300); waited += 300; }
        if(!aozora_catalog_ready) throw new Error('青空文庫カタログの読み込みが完了していません。');
    }
    const q = query.toLowerCase();
    let results;
    if(search_mode_v === "author"){
        results = aozora_catalog.filter(it => (it.personName||'').toLowerCase().includes(q));
    } else {
        results = aozora_catalog.filter(it => (it.title||'').toLowerCase().includes(q));
    }
    return results.slice(0, 100);
}

   翻訳
   ============================================================ */
function splitTextRoughly(text, maxLen){
    const chunks = [];
    let rest = text;
    while(rest.length > maxLen){
        let cut = rest.lastIndexOf(". ", maxLen);
        if(cut < maxLen*0.5) cut = rest.lastIndexOf("。", maxLen);
        if(cut < maxLen*0.5) cut = rest.lastIndexOf("！", maxLen);
        if(cut < maxLen*0.5) cut = rest.lastIndexOf("？", maxLen);
        if(cut < maxLen*0.5) cut = rest.lastIndexOf("! ", maxLen);
        if(cut < maxLen*0.5) cut = rest.lastIndexOf("? ", maxLen);
        if(cut < maxLen*0.5) cut = maxLen;
        chunks.push(rest.slice(0, cut+1));
        rest = rest.slice(cut+1);
    }
    if(rest.length) chunks.push(rest);
    return chunks;
}

async function translateChunk(text, source, target){
    if(!text || !text.trim()) return {ok:true, text};
    for(const inst of shuffled(LINGVA_INSTANCES)){
        try{
            const url = `${inst}/api/v1/${source}/${target}/${encodeURIComponent(text)}`;
            const res = await fetchWithTimeout(url, {cache:'no-store'}, FETCH_TIMEOUT_TRANSLATE);
            if(!res.ok) continue;
            const data = await res.json();
            if(data && data.translation) return {ok:true, text:data.translation, endpoint:'Lingva'};
        }catch(e){}
    }
    for(const inst of shuffled(LIBRETRANSLATE_INSTANCES)){
        try{
            const res = await fetchWithTimeout(`${inst}/translate`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({q:text, source, target})
            }, FETCH_TIMEOUT_TRANSLATE);
            if(!res.ok) continue;
            const data = await res.json();
            if(data && data.translatedText) return {ok:true, text:data.translatedText, endpoint:'LibreTranslate'};
        }catch(e){}
    }
    return {ok:false, error:'全翻訳APIが失敗しました'};
}

async function translateParagraph(text, source, target){
    if(!text || !text.trim()) return {ok:true, text};
    if(text.length <= CHUNK_MAX_LEN) return await translateChunk(text, source, target);
    const chunks = splitTextRoughly(text, CHUNK_MAX_LEN);
    let combined = '';
    for(const c of chunks){
        const r = await translateChunk(c, source, target);
        if(!r.ok) return r;
        combined += r.text;
    }
    return {ok:true, text:combined, endpoint:'chunked'};
}

function buildBidirectionalQueue(total){
    const q = [];
    let f = 0, b = total - 1;
    while(f <= b){
        if(f === b){ q.push(f); break; }
        q.push(f); q.push(b); f++; b--;
    }
    return q;
}

function buildOriginalHtml(book){
    if(book.paragraphs && book.paragraphs.length){
        return book.paragraphs.map((p, i)=>{
            const classes = (p.classes || []).slice();
            const cls = classes.length ? ` class="${classes.join(' ')}"` : '';
            const inner = (p.html != null) ? p.html : escapeHtml(p.text);
            return `<${p.tag}${cls} data-pidx="${i}">${inner}</${p.tag}>`;
        }).join('');
    }
    return book.content || "";
}

function buildTranslatedHtml(book){
    if(book.paragraphs && book.paragraphs.length){
        const texts = book.translatedTexts || [];
        return book.paragraphs.map((p, i)=>{
            const t = texts[i];
            const isUn = (t == null);
            const classes = (p.classes || []).slice();
            if(isUn) classes.push('untranslated');
            const cls = classes.length ? ` class="${classes.join(' ')}"` : '';
            const inner = escapeHtml(isUn ? p.text : t);
            return `<${p.tag}${cls} data-pidx="${i}">${inner}</${p.tag}>`;
        }).join('');
    }
    return book.contentTranslated || book.content || "";
}

/* ============================================================
   翻訳ジョブ
   ============================================================ */
async function startBackgroundTranslation(bookId){
    if(active_translation_jobs[bookId]) return;
    active_translation_jobs[bookId] = true;
    const myGen = (translation_generation[bookId]||0) + 1;
    translation_generation[bookId] = myGen;
    let bookTitleForToast = '';
    try{
        const book = await getBookFromDB(bookId);
        if(!book || !book.paragraphs || !book.paragraphs.length) return;
        bookTitleForToast = book.title;
        const total = book.paragraphs.length;
        if(!Array.isArray(book.translatedTexts) || book.translatedTexts.length !== total){
            const old = Array.isArray(book.translatedTexts) ? book.translatedTexts : [];
            const fixed = new Array(total).fill(null);
            for(let i=0;i<total;i++){ if(old[i] != null) fixed[i] = old[i]; }
            book.translatedTexts = fixed;
        }
        const already = book.translatedTexts.filter(t=>t != null).length;
        if(already >= total){
            book.translationStatus = "done";
            book.translationDone = total;
            await saveBookToDB(book);
            onTranslationTick(book);
            return;
        }
        const srcLang = book.sourceLang || 'en';
        const tgtLang = book.targetLang || 'ja';
        book.translationStatus = "translating";
        book.translationTotal = total;
        book.translationDone = already;
        delete book.lastError;
        const queue = buildBidirectionalQueue(total).filter(i=>book.translatedTexts[i] == null);
        let qi = 0, lastSave = 0, fails = 0, para = INITIAL_PARALLELISM;
        const worker = async (worker_id)=>{
            while(true){
                if(translation_generation[bookId] !== myGen) return;
                if(worker_id >= para) return;
                if(qi >= queue.length) return;
                const idx = queue[qi++];
                if(book.translatedTexts[idx] != null) continue;
                let ok = false, lastErr = '';
                for(let attempt=0; attempt<MAX_RETRY_PER_PARAGRAPH; attempt++){
                    if(translation_generation[bookId] !== myGen) return;
                    const r = await translateParagraph(book.paragraphs[idx].text, srcLang, tgtLang);
                    if(r.ok){
                        book.translatedTexts[idx] = r.text;
                        book.translationDone = (book.translationDone||0) + 1;
                        onTranslationTick(book);
                        if(Date.now() - lastSave > 1500){ lastSave = Date.now(); saveBookToDB(book); }
                        ok = true; break;
                    }
                    lastErr = r.error || 'unknown';
                    await sleep(Math.min(50*(attempt+1), 250));
                }
                if(ok){ fails = 0; }
                else{
                    fails++;
                    book.lastError = `段落${idx}: ${lastErr}`;
                    if(fails >= FAILS_TO_DROP_CONCURRENCY){
                        if(para > MIN_PARALLELISM){ para = para === 32 ? 16 : MIN_PARALLELISM; fails = 0; }
                        else fails = 0;
                    }
                }
                await sleep(WORKER_DELAY_MS);
            }
        };
        const workers = [];
        for(let i=0;i<INITIAL_PARALLELISM;i++) workers.push(worker(i));
        await Promise.all(workers);
        if(translation_generation[bookId] !== myGen) return;
        book.translationDone = book.translatedTexts.filter(t=>t != null).length;
        if(book.translationDone >= total){
            book.translationStatus = "done";
            showToast(`「${bookTitleForToast}」の翻訳が完了しました (${book.translationDone}/${total})`, 'success');
        } else {
            book.translationStatus = "error";
            showToast(`「${bookTitleForToast}」一部の段落が未翻訳です (${book.translationDone}/${total})`, 'warn', 12000);
        }
        await saveBookToDB(book);
        onTranslationTick(book);
    }catch(err){
        showToast('翻訳ジョブがクラッシュ: ' + err.message, 'error');
        try{
            if(translation_generation[bookId] === myGen){
                const b = await getBookFromDB(bookId);
                if(b){ b.translationStatus = "error"; b.lastError = err.message; await saveBookToDB(b); onTranslationTick(b); }
            }
        }catch(e){}
    }finally{
        if(translation_generation[bookId] === myGen) active_translation_jobs[bookId] = false;
    }
}

function onTranslationTick(book){
    if(ima_yonderu_hon && ima_yonderu_hon.id === book.id){
        ima_yonderu_hon.translatedTexts = book.translatedTexts;
        ima_yonderu_hon.translationStatus = book.translationStatus;
        ima_yonderu_hon.translationDone = book.translationDone;
        ima_yonderu_hon.translationTotal = book.translationTotal;
        ima_yonderu_hon.lastError = book.lastError;
        if(!ima_yonderu_hon.paragraphs) ima_yonderu_hon.paragraphs = book.paragraphs;
        readerHtmlCache.translated = null;
        if(is_showing_translation){
            applyTranslationToDom(book);
            if(is_book_mode) schedulePageRecompute();
        }
        updateReaderTranslationLabel();
    }
    updateBookshelfRowStatus(book);
}

function applyTranslationToDom(book){
    if(!ima_yonderu_hon || ima_yonderu_hon.id !== book.id) return;
    if(!is_showing_translation || !book.paragraphs) return;
    const flow = document.getElementById("reader-flow");
    const texts = book.translatedTexts || [];
    const children = flow.children;
    for(let i=0;i<book.paragraphs.length && i<children.length;i++){
        const el = children[i];
        if(texts[i] != null && el.classList.contains("untranslated")){
            el.textContent = texts[i];
            el.classList.remove("untranslated");
        }
    }
}

function updateBookshelfRowStatus(book){
    const el = document.querySelector(`[data-status-for="${book.id}"]`);
    if(!el) return;
    el.textContent = formatTranslationStatus(book);
    el.classList.remove('error','done');
    if(book.translationStatus === "error") el.classList.add('error');
    else if(book.translationStatus === "done") el.classList.add('done');
    if(book.lastError && book.translationStatus === "error") el.title = book.lastError;
}

function formatTranslationStatus(book){
    if(book.translationStatus === "translating"){
        const done = book.translationDone || 0;
        const total = book.translationTotal || (book.paragraphs ? book.paragraphs.length : 0);
        return `翻訳中 ${done}/${total}`;
    }
    if(book.translationStatus === "done") return "翻訳完了";
    if(book.translationStatus === "error"){
        const done = book.translationDone || 0;
        const total = book.translationTotal || (book.paragraphs ? book.paragraphs.length : 0);
        return `翻訳失敗 ${done}/${total}`;
    }
    if(book.contentTranslated) return "翻訳完了";
    return "—";
}

async function resumePendingTranslations(){
    try{
        const books = await getAllBooksFromDB();
        const pending = books.filter(b=>{
            if(!b.paragraphs || !b.paragraphs.length) return false;
            if(b.translationStatus === 'error') return false;
            const total = b.translationTotal || b.paragraphs.length;
            const done = b.translationDone || 0;
            return done < total;
        });
        if(pending.length > 0){
            showToast(`未完了の翻訳 ${pending.length}件 を再開します`, 'info');
            pending.forEach(b=>{ active_translation_jobs[b.id] = false; startBackgroundTranslation(b.id); });
        }
    }catch(e){}
}

    } else {
        setStatus("search-status", `Wikipediaで「${loose}」の英語表記を探り中...`, 'info');
        eng = await getAuthorEnglishNameFromWikipedia(loose);

        const data = await res.json();

async function downloadAndSaveGutenberg(bookId, silent){
    silent = !!silent;
    const rx = v_project_cache[bookId];
    if(!rx){
        if(!silent){ setStatus("search-status", "エラー: キャッシュなし", 'error'); showToast('ダウンロード失敗', 'error'); }
        throw new Error('キャッシュなし');
    }
    if(!silent){ setStatus("search-status", `作品ID:${bookId} をダウンロード中...`, 'info'); showToast(`ダウンロード開始: ${rx.title}`, 'info'); }
    try{
        const urls = [
            rx.formats["text/html; charset=utf-8"], rx.formats["text/html"],
            `https://www.gutenberg.org/cache/epub/${bookId}/pg${bookId}-images.html`,
            rx.formats["text/plain; charset=utf-8"], rx.formats["text/plain"],
            `https://www.gutenberg.org/cache/epub/${bookId}/pg${bookId}.txt.utf8`
        ].filter(Boolean);
        if(!urls.length) throw new Error('読める形式のURLが存在しません');
        let ok = null, rt = "", final_url = "", lastErr = '';
        for(const u of urls){
            try{
                const r = await fetchWithTimeout(CORS_PROXIES.aoi(u), {}, FETCH_TIMEOUT_BOOK);
                if(r.ok){ ok = r; rt = await r.text(); final_url = u; break; }
                else lastErr = `HTTP ${r.status}`;
            }catch(e){ lastErr = e.message; }
        }
        if(!ok) throw new Error(`全URL取得失敗（最後: ${lastErr}）`);
        let paras = [];
        if(final_url.includes("html") || final_url.includes("htm")){
            const d = new DOMParser().parseFromString(rt, "text/html");
            d.querySelectorAll("script, style, header, footer, img").forEach(el=>el.remove());
            const pe = d.querySelectorAll("p, h1, h2, h3");
            if(pe.length){
                pe.forEach(px=>{
                    const tx = px.textContent.trim();
                    if(tx) paras.push({tag: px.tagName.toLowerCase(), text: tx, classes: [], html: escapeHtml(tx)});
                });
            } else {
                const tx = d.body.textContent.trim();
                paras.push({tag:"p", text: tx, classes: [], html: escapeHtml(tx)});
            }
        } else {
            rt.split("\n").forEach(l=>{
                if(l.trim()) paras.push({tag:"p", text: l.trim(), classes: [], html: escapeHtml(l.trim())});
            });
        }
        if(!paras.length) throw new Error('段落0個');
        const ch = paras.map(p=>{
            const cls = (p.classes && p.classes.length) ? ` class="${p.classes.join(' ')}"` : '';
            const inner = (p.html != null) ? p.html : escapeHtml(p.text);
            return `<${p.tag}${cls}>${inner}</${p.tag}>`;
        }).join("");
        const an = rx.authors[0] ? rx.authors[0].name : "不明";
        const srcLang = (Array.isArray(rx.languages) && rx.languages.length) ? rx.languages[0] : 'en';
        const bd = {
            id: 'gutenberg_' + bookId,
            title: rx.title,
            author: an,
            content: ch,
            contentTranslated: "",
            paragraphs: paras,
            translatedTexts: new Array(paras.length).fill(null),
            translationStatus: "translating",
            translationDone: 0,
            translationTotal: paras.length,
            sourceLang: srcLang,
            targetLang: 'ja',
            bookmark: null,
            source: 'gutenberg',
            sourceInfo: { bookId: String(bookId) },
            savedAt: new Date().toISOString(),
            sortOrder: Date.now(),
            favorite: false,
            formatVersion: BOOK_FORMAT_VERSION,
            featureVersion: FEATURE_VERSION
        };
        await saveBookToDB(bd);
        if(!silent){
            setStatus("search-status", "保存完了！裏で翻訳を進めます", 'success');
            showToast(`「${rx.title}」保存完了（${paras.length}段落）`, 'success');
            openReader(bd);
        }
        startBackgroundTranslation(bd.id);
        return bd;
    }catch(err){
        if(!silent){ setStatus("search-status", `ダウンロード失敗: ${err.message}`, 'error'); showToast('ダウンロード失敗: ' + err.message, 'error'); }
        throw err;
    }
}

async function resolveAozoraZipName(workId, personId, initialZipName){
    if(initialZipName) return { zipName: initialZipName, via: 'catalog' };
    const paddedPersonId = String(personId).padStart(6, '0');

    const apiCandidates = [
        `https://api.github.com/repos/aozorahack/aozorabunko_text/contents/cards/${paddedPersonId}/files?ref=master`,
        `https://api.github.com/repos/aozorabunko/aozorabunko/contents/cards/${paddedPersonId}/files?ref=master`
    ];
    for(const apiUrl of apiCandidates){
        try{
            const apiRes = await fetchWithTimeout(apiUrl, {}, FETCH_TIMEOUT_API);
            if(!apiRes.ok){ console.warn('[aozora] GitHub API HTTP', apiRes.status, apiUrl); continue; }
            const files = await apiRes.json();
            if(!Array.isArray(files)){ console.warn('[aozora] GitHub API 非配列応答:', files && files.message); continue; }
            const zipTarget = files.find(f => f.name && f.name.startsWith(String(workId) + '_') && f.name.endsWith('.zip'));
            if(zipTarget) return { zipName: zipTarget.name, via: 'github-api' };
            const dirTarget = files.find(f => f.name && f.name.startsWith(String(workId) + '_'));
            if(dirTarget){
                const base = dirTarget.name.replace(/\.zip$/i, '');
                return { zipName: base + '.zip', via: 'github-api-dir' };
            }
        }catch(e){ console.warn('[aozora] GitHub API 例外:', e.message); }
    }

    try{
        const cardUrl = `https://www.aozora.gr.jp/cards/${paddedPersonId}/card${workId}.html`;
        const res = await fetchWithTimeout(CORS_PROXIES.aoi(cardUrl), {}, FETCH_TIMEOUT_API);
        if(res.ok){
            const html = await res.text();
            const m = html.match(/files\/([^"'#?]+\.zip)/i);
            if(m) return { zipName: m[1], via: 'card-html' };
        } else {
            console.warn('[aozora] card page HTTP', res.status, cardUrl);
        }
    }catch(e){ console.warn('[aozora] card page 例外:', e.message); }

    try{
        const apiUrl = `https://api.github.com/repos/aozorahack/aozorabunko_text/contents/cards/${paddedPersonId}/files?ref=master`;
        const apiRes = await fetchWithTimeout(apiUrl, {}, FETCH_TIMEOUT_API);
        if(apiRes.ok){
            const files = await apiRes.json();
            if(Array.isArray(files)){
                const re = new RegExp('^' + String(workId).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[_\\-]');
                const hit = files.find(f => f.name && re.test(f.name));
                if(hit){
                    const base = hit.name.replace(/\.zip$/i, '').replace(/\.txt$/i, '');
                    return { zipName: base + '.zip', via: 'github-api-loose' };
                }
            }
        }
    }catch(e){ console.warn('[aozora] ゆるマッチ失敗:', e.message); }

    return { zipName: null, via: null };
}

async function checkAozoraSuspended(workId, personId){
    try{
        const paddedPersonId = String(personId).padStart(6, '0');
        const cardUrl = `https://www.aozora.gr.jp/cards/${paddedPersonId}/card${workId}.html`;
        const res = await fetchWithTimeout(CORS_PROXIES.aoi(cardUrl), {}, FETCH_TIMEOUT_API);
        if(!res.ok) return { suspended: false, reason: null };
        const html = await res.text();
        const patterns = [
            /この作品の公開は現在、?一時的に停止されています/,
            /この作品は公開を停止しています/,
            /公開を停止しました/,
            /現在公開していません/,
            /公開停止中/
        ];
        for(const re of patterns){
            if(re.test(html)) return { suspended: true, reason: '公開停止中' };
        }
    }catch(e){
        console.warn('[aozora] 公開状態チェック失敗:', e.message);
    }
    return { suspended: false, reason: null };
}

async function downloadAndSaveAozora(workId, personId, title, personName, zipName, silent){
    silent = !!silent;
    const key = 'aozora_' + workId;
    if(!silent){
        setStatus("search-status", `「${title}」をダウンロード中...`, 'info');
        showToast(`ダウンロード開始: ${title}`, 'info');
    }
    try{
        if(!personId) throw new Error('著者IDが不明です。もう一度検索し直してください。');

        if(!silent) setStatus("search-status", `「${title}」の公開状態を確認中...`, 'info');
        const susp = await checkAozoraSuspended(workId, personId);
        if(susp.suspended){
            if(!silent){
                setStatus("search-status", `「${title}」は${susp.reason}です`, 'warn');
                showToast(`「${title}」は${susp.reason}のため、ダウンロードできません。`, 'warn', 8000);
            }
            throw new Error(susp.reason);
        }

        const paddedPersonId = String(personId).padStart(6, '0');
        if(!silent) setStatus("search-status", `「${title}」のZIP名を解決中...`, 'info');
        const resolved = await resolveAozoraZipName(workId, personId, zipName);
        const finalZipName = resolved.zipName;
        console.log('[aozora] ZIP解決:', finalZipName, '(via', resolved.via + ')');
        if(!finalZipName){
            if(!silent){
                setStatus("search-status", `「${title}」のファイルを取得できませんでした`, 'warn');
                showToast(`「${title}」は公開停止中、またはファイルが公開されていません。`, 'warn', 8000);
            }
            throw new Error('ファイルが公開されていません');
        }
        const baseName = finalZipName.replace(/\.zip$/i, '');

        const candidates = [
            `${AOZORA_TEXT_MIRROR}/${paddedPersonId}/files/${baseName}/${baseName}.txt`,
            `https://raw.githubusercontent.com/aozorahack/aozorabunko_text/master/cards/${paddedPersonId}/files/${baseName}.txt`
        ];

        let txt = null;
        let lastErr = '';
        for(const url of candidates){
            try{
                const res = await fetchWithTimeout(url, {}, FETCH_TIMEOUT_BOOK);
                if(!res.ok){ lastErr = `HTTP ${res.status}`; continue; }
                const buf = await res.arrayBuffer();
                if(buf.byteLength < 100){ lastErr = '空'; continue; }
                txt = decodeJapaneseText(buf);
                break;
            }catch(e){ lastErr = e.message; }
        }
        if(!txt) throw new Error(`テキスト取得失敗: ${lastErr}`);

        const chunks = txt.split(/^-{5,}\s*$/m).map(s=>s.trim()).filter(s=>s.length > 0);
        let body = '';
        for(const c of chunks){ if(c.length > body.length) body = c; }
        if(!body) body = txt;

        const rawParas = body.split(/\n\n+/).map(s=>s.trim()).filter(s=>s.length > 0);
        if(!rawParas.length) throw new Error('本文の段落が0個でした');

        const paras = buildAozoraParagraphs(rawParas);
        const ch = paras.map(p=>{
            const cls = (p.classes && p.classes.length) ? ` class="${p.classes.join(' ')}"` : '';
            const inner = (p.html != null) ? p.html : escapeHtml(p.text);
            return `<${p.tag}${cls}>${inner}</${p.tag}>`;
        }).join("");

        const bd = {
            id: key,
            title,
            author: personName,
            content: ch,
            contentTranslated: "",
            paragraphs: paras,
            rawParas: rawParas,
            translatedTexts: new Array(paras.length).fill(null),
            translationStatus: "done",
            translationDone: paras.length,
            translationTotal: paras.length,
            sourceLang: 'ja',
            targetLang: 'ja',

async function resolveIATextUrl(identifier){
    const res = await fetchWithTimeout(
        CORS_PROXIES.aoi(`${IA_METADATA_ENDPOINT}/${identifier}`),
        {}, FETCH_TIMEOUT_API
    );
    if(!res.ok) throw new Error(`IA metadata HTTP ${res.status}`);
    const meta = await res.json();
    const files = meta.files || [];
    const txt = files.find(f =>
        f.format === 'DjVuTXT' || f.format === 'Text' ||
        (f.name && f.name.endsWith('_djvu.txt'))
    );
    if(txt) return { url: `https://archive.org/download/${identifier}/${txt.name}`, meta };
    const plain = files.find(f => f.name && f.name.endsWith('.txt'));
    if(plain) return { url: `https://archive.org/download/${identifier}/${plain.name}`, meta };
    throw new Error('テキスト形式のファイルがありません');
}

async function downloadAndSaveInternetArchive(identifier, titleHint, silent){
    silent = !!silent;
    const key = 'ia_' + identifier;
    if(!silent){
        setStatus("search-status", `「${titleHint || identifier}」をダウンロード中...`, 'info');
        showToast(`ダウンロード開始: ${titleHint || identifier}`, 'info');
    }
    try{
        const { url, meta } = await resolveIATextUrl(identifier);
        const res = await fetchWithTimeout(CORS_PROXIES.aoi(url), {}, FETCH_TIMEOUT_BOOK);
        if(!res.ok) throw new Error(`本文HTTP ${res.status}`);
        const raw = await res.text();
        if(!raw || raw.length < 100) throw new Error('本文が短すぎます');

        const rawParas = raw.split(/\n\s*\n+/).map(s=>s.trim()).filter(s=>s.length > 0);
        if(!rawParas.length) throw new Error('段落が0個でした');

        const paras = rawParas.map(t=>({tag:'p', text:t, classes:[], html: escapeHtml(t)}));
        const ch = paras.map(p=>`<p>${p.html}</p>`).join('');

        const md = meta.metadata || {};
        const srcLang = normalizeIALang(md.language);
        const title = md.title || titleHint || identifier;
        const author = Array.isArray(md.creator) ? md.creator.join(', ') : (md.creator || '不明');

        const bd = {
            id: key,
            title,
            author,
            content: ch,
            contentTranslated: "",
            paragraphs: paras,
            translatedTexts: new Array(paras.length).fill(null),
            translationStatus: (srcLang === 'ja') ? "done" : "translating",
            translationDone: (srcLang === 'ja') ? paras.length : 0,
            translationTotal: paras.length,
            sourceLang: srcLang,
            targetLang: 'ja',
            bookmark: null,
            source: 'internetarchive',
            sourceInfo: { identifier },
            savedAt: new Date().toISOString(),
            sortOrder: Date.now(),
            favorite: false,
            formatVersion: BOOK_FORMAT_VERSION,
            featureVersion: FEATURE_VERSION
        };

        await saveBookToDB(bd);
        if(!silent){
            setStatus("search-status", "保存完了！裏で翻訳を進めます", 'success');
            showToast(`「${title}」保存完了（${paras.length}段落）`, 'success');
            openReader(bd);
        }
        if(srcLang !== 'ja') startBackgroundTranslation(bd.id);
        return bd;
    }catch(err){
        if(!silent){
            setStatus("search-status", `ダウンロード失敗: ${err.message}`, 'error');
            showToast('IAダウンロード失敗: ' + err.message, 'error');
        }
        throw err;
    }
}

async function fetchWikisourceHtml(pageId, lang){

async function searchNDL(query, startRecord, maximumRecords){
    startRecord = startRecord || 1;
    maximumRecords = maximumRecords || 50;
    const cql = `title="${query}" OR creator="${query}"`;
    const params = new URLSearchParams({
        operation: 'searchRetrieve',
        query: cql,
        startRecord: String(startRecord),
        maximumRecords: String(maximumRecords),
        recordSchema: 'info:srw/schema/1/dc-v1.1'
    });
    const res = await fetchWithTimeout(
        CORS_PROXIES.aoi(`${NDL_SRU_ENDPOINT}?${params}`),
        {}, FETCH_TIMEOUT_API
    );
    if(!res.ok) throw new Error(`NDL SRU HTTP ${res.status}`);
    const xml = await res.text();
    const doc = new DOMParser().parseFromString(xml, 'text/xml');

    const records = [];
    doc.querySelectorAll('record').forEach(rec => {
        const get = (tag) => {
            const el = rec.querySelector(tag);
            return el ? el.textContent.trim() : '';
        };
        const identifier = get('identifier');
        const pidMatch = identifier.match(/(\d{6,})/);
        records.push({
            title: get('title'),
            creator: get('creator'),
            date: get('date'),
            identifier,
            pid: pidMatch ? pidMatch[1] : null,
            description: get('description'),
            type: get('type')
        });
    });
    return records.filter(r => r.pid);
}

async function fetchNDLOcrFullText(pid){
    const url = `${NDL_BOOK_API}/${pid}/text`;
    try{
        const res = await fetchWithTimeout(CORS_PROXIES.aoi(url), {}, FETCH_TIMEOUT_BOOK);
        if(!res.ok){
            console.warn('[NDL] OCR API HTTP', res.status, url);
            return null;
        }
        const data = await res.json();
        if(!data || !data.pages || !data.pages.length) return null;

        const pages = [];
        for(const p of data.pages){
            const text = p.contents || p.text || '';
            if(text && text.trim()){
                pages.push({ page: p.page || pages.length + 1, text: text.trim() });
            }
        }
        return pages.length ? pages : null;
    }catch(e){
        console.warn('[NDL] OCR全文取得失敗:', e.message);
        return null;
    }
}

async function fetchNDLIIIFManifest(pid){
    const url = `${NDL_IIIF_BASE}/${pid}/manifest.json`;
    const res = await fetchWithTimeout(CORS_PROXIES.aoi(url), {}, FETCH_TIMEOUT_API);
    if(!res.ok) throw new Error(`IIIF HTTP ${res.status}`);
    return await res.json();
}

function extractNDLImageUrls(manifest){
    const urls = [];
    const sequences = manifest.sequences || (manifest.items ? [manifest] : []);
    for(const seq of sequences){
        const canvases = seq.canvases || seq.items || [];
        for(const c of canvases){
            const images = c.images || [];
            for(const img of images){
                const res = img.resource || img;
                const id = res['@id'] || res.id;
                if(id) urls.push(id);
            }
        }
    }
    return urls;
}

        await saveBookToDB(bd);

            showToast(`「${titleHint || pid}」はOCR全文がないため、NDLビューアで開きます`, 'warn');

/* ============================================================
   バージョン差分による自動再取得
   ============================================================ */
async function redownloadOutdatedBooks(){
    let books;
    try { books = await getAllBooksFromDB(); }
    catch(e){ console.warn('[再DL] DB取得失敗:', e.message); return; }

    const outdated = books.filter(b => b.featureVersion !== FEATURE_VERSION);
    if(!outdated.length) return;

    console.log(`[再DL] ${outdated.length}件を再取得します`);
    showToast(`古いデータ ${outdated.length}件 をバックグラウンドで再取得します`, 'info', 8000);

    if(outdated.some(b => b.source === 'aozora' && !b.sourceInfo)){
        try { await fetchAozoraCatalog(); } catch(e){}
    }

    let ok = 0, failed = 0;
    for(const book of outdated){
        try{
            let si = book.sourceInfo;
            if(!si && book.source === 'aozora'){
                const workId = book.id.replace(/^aozora_/, '');
                if(aozora_catalog_ready){
                    const cat = aozora_catalog.find(c => c.workId === workId);
                    if(cat){
                        si = { workId: cat.workId, personId: cat.personId, title: cat.title, personName: cat.personName, zipName: cat.zipName };
                    }
                }
            }
            if(!si && book.source === 'gutenberg'){
                const gid = book.id.replace(/^gutenberg_/, '');
                si = { bookId: gid };
            }
            if(!si && book.source === 'internetarchive'){
                si = { identifier: book.id.replace(/^ia_/, '') };
            }
            if(!si && book.source === 'wikisource'){
                const m = book.id.match(/^wikisource_([a-z]+)_(\d+)$/);
                if(m) si = { lang: m[1], pageId: m[2] };
            }
            if(!si && book.source === 'ndl'){
                si = { pid: book.id.replace(/^ndl_/, '') };
            }

            if(book.source === 'aozora' && si){
                await downloadAndSaveAozora(si.workId, si.personId, si.title, si.personName, si.zipName || '', true);
                ok++;
            } else if(book.source === 'gutenberg' && si){
                const rx = await fetchGutenbergBookById(si.bookId);
                v_project_cache[si.bookId] = rx;
                await downloadAndSaveGutenberg(si.bookId, true);
                ok++;
            } else if(book.source === 'internetarchive' && si){
                await downloadAndSaveInternetArchive(si.identifier, book.title, true);
                ok++;
            } else if(book.source === 'wikisource' && si){
                await downloadAndSaveWikisource(si.pageId, book.title, si.lang, true);
                ok++;
            } else if(book.source === 'ndl' && si){
                await downloadAndSaveNDL(si.pid, book.title, true);
                ok++;
            } else {
                console.warn('[再DL] 情報不足のため削除:', book.id);
                await safeDBOp(["books"], "readwrite", (tx, resolve, reject)=>{
                    tx.objectStore("books").delete(book.id);
                    tx.oncomplete = ()=>resolve();
                    tx.onerror = ()=>reject(tx.error);
                });
            }
        }catch(e){
            console.warn('[再DL] 失敗:', book.id, e.message);
            failed++;
            try{
                const b = await getBookFromDB(book.id);
                if(b){
                    b.featureVersion = FEATURE_VERSION;
                    b.lastRedownloadError = e.message;
                    await saveBookToDB(b);
                }
            }catch(_){}
        }
        await sleep(300);
    }

    console.log(`[再DL] 完了: 成功 ${ok} / 失敗 ${failed}`);
    if(ok > 0) showToast(`${ok}件の再取得が完了しました`, 'success', 5000);
    if(failed > 0) showToast(`${failed}件は再取得できませんでした`, 'warn', 6000);
    loadBookshelf();
}

function loadBookshelf(){
    const s = document.getElementById("bookshelf-status");
    const t = document.getElementById("bookshelf-table");
    const tb = document.getElementById("bookshelf-tbody");
    tb.innerHTML = "";
    s.textContent = "読み込み中...";
    s.classList.remove('error','success','info');

    const filter = (document.getElementById("bookshelf-search").value || '').trim().toLowerCase();
    const favOnly = document.getElementById("bookshelf-fav-only").checked;

    safeDBOp(["books"], "readonly", (tx, resolve, reject)=>{
        const rq = tx.objectStore("books").getAll();
        rq.onsuccess = ()=>{
            const bks = rq.result;
            if(!bks.length){ setStatus("bookshelf-status", "本棚は空っぽです", 'info'); t.style.display = "none"; updateReprocessButton(0); resolve(); return; }
            let filtered = bks;
            if(favOnly) filtered = filtered.filter(b=>b.favorite);
            if(filter) filtered = filtered.filter(b=>{ const tt = (b.title || '').toLowerCase(); const aa = (b.author || '').toLowerCase(); return tt.includes(filter) || aa.includes(filter); });
            if(!filtered.length){ setStatus("bookshelf-status", "条件に一致する本がありません", 'info'); t.style.display = "none"; updateReprocessButton(0); resolve(); return; }
            filtered.sort((a,b)=>(a.sortOrder ?? Infinity) - (b.sortOrder ?? Infinity));

            const outdatedCount = filtered.filter(b => isBookOutdated(b)).length;
            updateReprocessButton(outdatedCount);

            s.textContent = "";
            t.style.display = "table";

            filtered.forEach(b=>{
                const outdated = isBookOutdated(b);
                const tr = document.createElement("tr");
                tr.draggable = true;
                tr.ondragstart = (e)=>handleDragStart(e, b.id);
                tr.ondragover = (e)=>handleDragOver(e, tr);
                tr.ondragleave = ()=>tr.classList.remove("drag-over-row");
                tr.ondrop = (e)=>handleRowDrop(e, b.id, tr);
                tr.style.cursor = "pointer";
                tr.onclick = ()=>readSavedBook(b.id);

                const fav = b.favorite ? "[お気に入り] " : "";
                const st = formatTranslationStatus(b);
                const stCls = b.translationStatus === "error" ? "error" : b.translationStatus === "done" ? "done" : "";
                const errTitle = b.lastError ? ` title="${escapeHtml(b.lastError)}"` : "";
                const total = b.translationTotal || (b.paragraphs ? b.paragraphs.length : 0);
                const done = b.translationDone || 0;
                const incomplete = b.paragraphs && b.paragraphs.length && done < total;
                const retryBtn = incomplete ? `<button onclick="event.stopPropagation(); retryTranslation('${escapeHtml(b.id)}')">翻訳を再開</button>` : "";
                const updateBadge = outdated ? `<span class="update-badge" title="新しい処理形式で読み直せます">要更新</span>` : "";
                const reprocessBtn = outdated ? `<button onclick="event.stopPropagation(); handleReprocessOne('${escapeHtml(b.id)}')">新形式で再処理</button>` : "";
                const isNDLViewerOnly = (b.source === 'ndl' && b.sourceInfo && b.sourceInfo.hasOcr === false);
                const ndlBtn = isNDLViewerOnly ? `<button onclick="event.stopPropagation(); window.open('${escapeHtml(b.sourceInfo.viewerUrl)}','_blank')">NDLで開く</button>` : "";

                tr.innerHTML = `
                    <td class="id-cell">
                        <span class="drag-handle" title="ドラッグで並べ替え" onclick="event.stopPropagation()">
                            <span class="bar"></span><span class="bar"></span>
                        </span>
                        ${escapeHtml(b.id)}
                    </td>
                    <td>${fav}${escapeHtml(b.title)}</td>
                    <td>${escapeHtml(b.author)}</td>
                    <td>${updateBadge}<span class="trans-badge ${stCls}" data-status-for="${escapeHtml(b.id)}"${errTitle}>${st}</span></td>
                    <td onclick="event.stopPropagation()">
                        <div class="menu-wrap">
                            <button class="dots-btn" onclick="toggleRowMenu(event, '${escapeHtml(b.id)}')">...</button>
                            <div class="row-menu" id="menu-${escapeHtml(b.id)}">
                                ${ndlBtn}
                                ${reprocessBtn}
                                ${retryBtn}
                                <button onclick="toggleFavorite('${escapeHtml(b.id)}')">${b.favorite ? "お気に入り解除" : "お気に入りに追加"}</button>
                                <button onclick="confirmDeleteBook('${escapeHtml(b.id)}')" style="color:#d9534f;">削除</button>
                            </div>
                        </div>
                    </td>
                `;
                tb.appendChild(tr);
            });
            resolve();
        };
        rq.onerror = ()=>reject(rq.error);
    }).catch(e=>{ setStatus("bookshelf-status", "本棚読み込みエラー: " + e.message, 'error'); });
}

function handleDragStart(ev, bookId){ drag_zaku_id = bookId; ev.dataTransfer.effectAllowed = "move"; }
function handleDragOver(ev, rowEl){ ev.preventDefault(); rowEl.classList.add("drag-over-row"); }
function handleRowDrop(ev, targetId, rowEl){
    ev.preventDefault();
    rowEl.classList.remove("drag-over-row");
    if(drag_zaku_id === null || drag_zaku_id === targetId) return;
    swapBookOrder(drag_zaku_id, targetId);
    drag_zaku_id = null;
}

function swapBookOrder(idA, idB){
    safeDBOp(["books"], "readwrite", (tx, resolve)=>{
        const st = tx.objectStore("books");
        const rqA = st.get(idA);
        rqA.onsuccess = ()=>{
            const a = rqA.result;
            const rqB = st.get(idB);
            rqB.onsuccess = ()=>{
                const b = rqB.result;
                if(!a || !b){ resolve(); return; }
                const orderA = (a.sortOrder != null) ? a.sortOrder : Infinity;
                const orderB = (b.sortOrder != null) ? b.sortOrder : Infinity;
                if(orderA === orderB){
                    const base = Date.now();
                    a.sortOrder = base;
                    b.sortOrder = base + 1;
                } else {
                    a.sortOrder = orderB;
                    b.sortOrder = orderA;
                }
                st.put(a); st.put(b);
            };
        };
        tx.oncomplete = ()=>{ loadBookshelf(); resolve(); };
    }).catch(()=>{});
}

async function executeConfirmedDelete(){

    const modal = document.getElementById("confirm-modal");
    if(modal) modal.classList.remove("active");

        await ensureDB();
        await new Promise((resolve, reject)=>{
            let tx;
            try { tx = maji_de_db.transaction(["books"], "readwrite"); }
            catch(err){ reject(err); return; }
            const store = tx.objectStore("books");
            const req = store.delete(id);
            req.onsuccess = ()=>{ console.log("[削除] request success:", id); };
            req.onerror = ()=>{ console.error("[削除] request error:", req.error); reject(req.error || new Error("delete failed")); };
            tx.oncomplete = ()=>{ console.log("[削除] tx complete"); resolve(); };
            tx.onerror = ()=>{ console.error("[削除] tx error:", tx.error); reject(tx.error); };
            tx.onabort = ()=>{ console.error("[削除] tx abort"); reject(new Error("aborted")); };
        });
