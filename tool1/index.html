<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gutenberg Solari Reader</title>
    <style>
        :root {
            --bg-color: #f7f6f2;
            --text-color: #2b2b2b;
            --accent-color: #4a6fa5;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --font-family: 'Georgia', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
        }

        body.dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #d1d1d1;
            --accent-color: #6b8cce;
            --card-bg: #282828;
            --border-color: #404040;
        }

        body.sepia-mode {
            --bg-color: #f4ecd8;
            --text-color: #5b4636;
            --accent-color: #8c6d53;
            --card-bg: #fbf0d9;
            --border-color: #e2d7c0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            transition: background-color 0.3s, color 0.3s;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 12px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .nav-buttons button {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            margin-left: 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 検索・一覧画面 */
        .view-panel {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: none;
        }

        .view-panel.active {
            display: block;
        }

        .search-box {
            display: flex;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto 20px auto;
        }

        .search-box input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
        }

        .search-box button {
            padding: 10px 20px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* テーブル装飾 */
        .results-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .results-table th, .results-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .results-table th {
            background-color: rgba(0,0,0,0.03);
            font-weight: bold;
        }

        .results-table tr:hover {
            background-color: rgba(0,0,0,0.02);
            cursor: pointer;
        }

        /* 読書画面（ソラリ風） */
        #reader-view {
            flex: 1;
            display: none;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        #reader-view.active {
            display: flex;
        }

        .reader-toolbar {
            padding: 8px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 0.9rem;
        }

        .reader-content {
            flex: 1;
            padding: 40px;
            overflow: auto;
            line-height: 1.8;
            font-size: 1.1rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        /* 縦書きモード設定 */
        .reader-content.vertical {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            max-width: none;
            height: 100%;
            padding: 40px 60px;
        }

        .status-msg {
            text-align: center;
            padding: 20px;
            font-size: 0.95rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header>
        <h1>Solari Gutenberg Reader</h1>
        <div class="nav-buttons">
            <button onclick="switchTab('search')">検索 ( ﾟдpx)</button>
            <button onclick="switchTab('bookshelf')">本棚 ( ˘ω˘ )</button>
        </div>
    </header>

    <div class="container">
        <!-- 検索タブ -->
        <div id="search-view" class="view-panel active">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="作品名や著者名（日本語OK）">
                <button onclick="execSearch()">検索実行</button>
            </div>
            <div id="search-status" class="status-msg"></div>
            <table class="results-table" id="results-table" style="display:none;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>タイトル</th>
                        <th>著者</th>
                        <th>没年</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="results-tbody"></tbody>
            </table>
        </div>

        <!-- 本棚タブ -->
        <div id="bookshelf-view" class="view-panel">
            <h2>保存済み作品</h2>
            <div id="bookshelf-status" class="status-msg"></div>
            <table class="results-table" id="bookshelf-table" style="display:none;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>タイトル</th>
                        <th>著者</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="bookshelf-tbody"></tbody>
            </table>
        </div>

        <!-- 読書画面 -->
        <div id="reader-view">
            <div class="reader-toolbar">
                <button onclick="toggleWritingMode()">縦横切替</button>
                <button onclick="changeFontSize(1)">拡大</button>
                <button onclick="changeFontSize(-1)">縮小</button>
                <button onclick="setTheme('light')">Light</button>
                <button onclick="setTheme('sepia')">Sepia</button>
                <button onclick="setTheme('dark')">Dark</button>
                <span id="reading-title" style="margin-left:auto; font-weight:bold;"></span>
            </div>
            <div id="reader-body" class="reader-content"></div>
        </div>
    </div>

<script>
// 自作プロキシURL（これマジで神。CORSエラーぶち壊すやつ）
const maji_de_proxy_base = "https://aoi-box-lab.idosenpai.workers.dev/?";

let maji_de_db = null;
let current_font_size = 18;
let is_vertical_mode = false;

// データベースの初期化処理
function initDB()
{
    return new Promise((resolve, reject) => 
    {
        // IndexedDB起動！頼むからエラー吐かないでくれよ…
        const req = indexedDB.open("SolariGutenbergDB", 1);
        
        req.onupgradeneeded = (e) => 
        {
            const db = e.target.result;
            if (!db.objectStoreNames.contains("books")) 
            {
                db.createObjectStore("books", { keyPath: "id" });
            }
        };

        req.onsuccess = (e) => 
        {
            maji_de_db = e.target.result;
            resolve(maji_de_db);
        };

        req.onerror = (e) => 
        {
            console.error("IndexedDB開くの失敗したんだけど何事？", e);
            reject(e);
        };
    });
}

// 著作権チェック（没後80年ルール）
function checkChosakukenSafe(authorDeathYear)
{
    if (!authorDeathYear)
    {
        // 没年不明とか一番困るやつ。安全側に倒して弾いておく
        return false;
    }
    const genzaiNen = 2026; // 現在の年
    const maji_de_elapsed = genzaiNen - authorDeathYear;
    
    // 現在の年 - 著者の没年 >= 80
    return maji_de_elapsed >= 80;
}

// 日本語から英語への簡易変換（MyMemory翻訳APIを使用）
async function translateToEnglish(jpText)
{
    // 英数字のみなら翻訳をスキップする無駄回避ロジック
    if (/^[a-zA-Z0-9\s]+$/.test(jpText)) 
    {
        return jpText;
    }

    try 
    {
        const transApi = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(jpText)}&langpair=ja|en`;
        const res = await fetch(maji_de_proxy_base + encodeURIComponent(transApi));
        const data = await res.json();
        
        if (data && data.responseData && data.responseData.translatedText) 
        {
            return data.responseData.translatedText;
        }
    } 
    catch (err) 
    {
        // 翻訳失敗したらそのままの検索語で突撃する覚悟( ﾟдpx)
        console.warn("英訳失敗したからそのまま行くわ:", err);
    }
    return jpText;
}

// グーテンベルク検索処理
async function execSearch()
{
    const inputEre = document.getElementById("search-input");
    const queryVal = inputEre.value.trim();
    const statusEre = document.getElementById("search-status");
    const tableEre = document.getElementById("results-table");
    const tbodyEre = document.getElementById("results-tbody");

    if (!queryVal) return;

    statusEre.textContent = "翻訳＆検索中...少々お待ちを ( ｀・ω・´)";
    tbodyEre.innerHTML = "";
    tableEre.style.display = "none";

    try 
    {
        // まずHTML側で日本語を英語名に変換
        const englishQuery = await translateToEnglish(queryVal);
        statusEre.textContent = `「${englishQuery}」でGutendexを検索中...`;

        // Gutendex API叩く（プロキシ経由）
        const gutendexApi = `https://gutendex.com/books/?search=${encodeURIComponent(englishQuery)}`;
        const res = await fetch(maji_de_proxy_base + encodeURIComponent(gutendexApi));
        const data = await res.json();

        if (!data.results || data.results.length === 0) 
        {
            statusEre.textContent = "該当する作品が見つからなかったお… ＼(^o^)／";
            return;
        }

        statusEre.textContent = "";
        tableEre.style.display = "table";

        data.results.forEach((book) => 
        {
            const author = book.authors[0] || { name: "不明", death_year: null };
            const deathYear = author.death_year;
            
            // 著作権判定
            const isSafe = checkChosakukenSafe(deathYear);

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${book.id}</td>
                <td>${book.title}</td>
                <td>${author.name}</td>
                <td>${deathYear ? deathYear : "不明"}</td>
                <td>
                    ${isSafe 
                        ? `<button onclick="downloadAndSaveBook(${book.id}, '${escapeHtml(book.title)}', '${escapeHtml(author.name)}')">保存・読む</button>`
                        : `<span style="color:red; font-size:0.8rem;">保護期間内(不可)</span>`
                    }
                </td>
            `;
            tbodyEre.appendChild(tr);
        });

    } 
    catch (err) 
    {
        console.error("検索中にエラー吐いたわマジキレそう:", err);
        statusEre.textContent = "エラーが発生しました。プロキシか通信環境を確認してね";
    }
}

// 作品HTMLのダウンロード・分解・テキスト再構築・IndexedDB保存
async function downloadAndSaveBook(bookId, title, author)
{
    const statusEre = document.getElementById("search-status");
    statusEre.textContent = `作品ID:${bookId} をダウンロード＆分解構築中... (｀・ω・´)`;

    try 
    {
        // GutenbergのHTML取得（プロキシ経由）
        const bookHtmlUrl = `https://www.gutenberg.org/files/${bookId}/${bookId}-h/${bookId}-h.htm`;
        let htmlText = "";

        try 
        {
            const res = await fetch(maji_de_proxy_base + encodeURIComponent(bookHtmlUrl));
            if (!res.ok) throw new Error("1st HTML url failed");
            htmlText = await res.text();
        } 
        catch (e) 
        {
            // パターン2: 新しめのURL構造を試す
            const fallbackUrl = `https://www.gutenberg.org/cache/epub/${bookId}/pg${bookId}.html`;
            const res2 = await fetch(maji_de_proxy_base + encodeURIComponent(fallbackUrl));
            htmlText = await res2.text();
        }

        // HTMLを分解して純粋なテキスト/段落構造だけに打ち直す処理
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, "text/html");

        // 余計なCSSやスクリプトを削除するデストロイ処理
        doc.querySelectorAll("script, style, header, footer").forEach(el => el.remove());

        // 段落要素(<p>)を中心にテキスト抽出し再構築
        const pElements = doc.querySelectorAll("p, h1, h2, h3");
        let maji_clean_html = "";

        if (pElements.length > 0) 
        {
            pElements.forEach(p => 
            {
                const txt = p.textContent.trim();
                if (txt.length > 0) 
                {
                    const tagName = p.tagName.toLowerCase();
                    maji_clean_html += `<${tagName}>${escapeHtml(txt)}</${tagName}>`;
                }
            });
        } 
        else 
        {
            // <p>が無ければbody直下からぶっこ抜く
            maji_clean_html = `<p>${escapeHtml(doc.body.textContent)}</p>`;
        }

        // IndexedDBに保存
        const transaction = maji_de_db.transaction(["books"], "readwrite");
        const store = transaction.objectStore("books");
        
        const bookData = {
            id: bookId,
            title: title,
            author: author,
            content: maji_clean_html,
            savedAt: new Date().toISOString()
        };

        store.put(bookData);

        transaction.oncomplete = () => 
        {
            statusEre.textContent = "保存完了！読書画面へ移行します ( ﾟ∀ﾟ)o彡";
            openReader(bookData);
        };

    } 
    catch (err) 
    {
        console.error("ダウンロード分解中にクラッシュ:", err);
        statusEre.textContent = "ダウンロード・解析に失敗しちゃった…ごめんね";
    }
}

// 本棚の表示更新
function loadBookshelf()
{
    const statusEre = document.getElementById("bookshelf-status");
    const tableEre = document.getElementById("bookshelf-table");
    const tbodyEre = document.getElementById("bookshelf-tbody");

    tbodyEre.innerHTML = "";
    statusEre.textContent = "読み込み中...";

    const tx = maji_de_db.transaction(["books"], "readonly");
    const store = tx.objectStore("books");
    const req = store.getAll();

    req.onsuccess = () => 
    {
        const books = req.result;
        if (books.length === 0) 
        {
            statusEre.textContent = "本棚は空っぽだよ ( ˘ω˘ ) 作品を検索して保存してね";
            tableEre.style.display = "none";
            return;
        }

        statusEre.textContent = "";
        tableEre.style.display = "table";

        books.forEach(b => 
        {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${b.id}</td>
                <td>${b.title}</td>
                <td>${b.author}</td>
                <td>
                    <button onclick='readSavedBook(${b.id})'>読む</button>
                    <button onclick='deleteBook(${b.id})' style='color:red;'>削除</button>
                </td>
            `;
            tbodyEre.appendChild(tr);
        });
    };
}

// 保存済み本を読む
function readSavedBook(bookId)
{
    const tx = maji_de_db.transaction(["books"], "readonly");
    const store = tx.objectStore("books");
    const req = store.get(bookId);

    req.onsuccess = () => 
    {
        if (req.result) 
        {
            openReader(req.result);
        }
    };
}

// 作品削除
function deleteBook(bookId)
{
    const tx = maji_de_db.transaction(["books"], "readwrite");
    const store = tx.objectStore("books");
    store.delete(bookId);
    tx.oncomplete = () => 
    {
        loadBookshelf();
    };
}

// 読書画面を開く（ソラリ風）
function openReader(bookObj)
{
    document.querySelectorAll(".view-panel").forEach(p => p.classList.remove("active"));
    const readerView = document.getElementById("reader-view");
    readerView.classList.add("active");

    document.getElementById("reading-title").textContent = bookObj.title;
    const readerBody = document.getElementById("reader-body");
    readerBody.innerHTML = bookObj.content;
    readerBody.scrollTop = 0;
}

// タブ切り替え
function switchTab(tabName)
{
    document.getElementById("reader-view").classList.remove("active");
    document.querySelectorAll(".view-panel").forEach(p => p.classList.remove("active"));

    if (tabName === "search") 
    {
        document.getElementById("search-view").classList.add("active");
    } 
    else if (tabName === "bookshelf") 
    {
        document.getElementById("bookshelf-view").classList.add("active");
        loadBookshelf();
    }
}

// ソラリ風読書カスタマイズ機能
function toggleWritingMode()
{
    const readerBody = document.getElementById("reader-body");
    is_vertical_mode = !is_vertical_mode;
    if (is_vertical_mode) 
    {
        readerBody.classList.add("vertical");
    } 
    else 
    {
        readerBody.classList.remove("vertical");
    }
}

function changeFontSize(delta)
{
    current_font_size = Math.max(12, Math.min(36, current_font_size + delta));
    document.getElementById("reader-body").style.fontSize = `${current_font_size}px`;
}

function setTheme(theme)
{
    document.body.classList.remove("dark-mode", "sepia-mode");
    if (theme === "dark") document.body.classList.add("dark-mode");
    if (theme === "sepia") document.body.classList.add("sepia-mode");
}

function escapeHtml(str)
{
    if (!str) return "";
    return str.replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
}

// アプリ初期起動
window.onload = async () => 
{
    await initDB();
    // 後でリファクタリングする（絶対しないやつ）
};
</script>
</body>
</html>
