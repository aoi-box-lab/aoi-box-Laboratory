<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gutenberg Book Reader</title>
  <style>
    /* 簡易レイアウト整形 */
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
    }
    #status {
      font-weight: bold;
      color: #333;
      margin: 10px 0;
    }
    #reader {
      border: 1px solid #ccc;
      padding: 15px;
      min-height: 300px;
      max-height: 600px;
      overflow-y: auto;
      background: #fafafa;
      margin-top: 15px;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 8px;
    }
    button {
      padding: 8px 16px;
    }
  </style>
</head>
<body>

  <h1>Gutenberg Book Reader</h1>

  <div class="search-box">
    <input type="text" id="search_input" placeholder="書名や著者名を入力 (例: Alice in Wonderland)">
    <button id="search_btn">検索</button>
  </div>

  <div id="status">検索キーワードを入力してください ( 'ω' )</div>
  
  <div>
    <a id="download_link" href="#" style="display: none;">[ HTML版を別タブで開く ]</a>
  </div>

  <!-- 1. 本文表示エリア -->
  <div id="reader"></div>

  <script>
    // ==========================================
    // キャッシュ（6. 直列API・パフォーマンス対策）
    // ==========================================
    const author_cache = new Map();

    // UI要素の参照取得
    const status_el = document.getElementById("status");
    const reader_el = document.getElementById("reader");
    const download_link = document.getElementById("download_link");
    const search_input = document.getElementById("search_input");
    const search_btn = document.getElementById("search_btn");

    // 3. セキュリティ対策：外部リンクのタブナッピング対策
    if (download_link) {
      download_link.setAttribute("target", "_blank");
      download_link.setAttribute("rel", "noopener noreferrer");
    }

    // イベントリスナーの登録
    search_btn.addEventListener("click", () => {
      const q = search_input.value.trim();
      if (q) search_books(q);
    });

    search_input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        const q = search_input.value.trim();
        if (q) search_books(q);
      }
    });

    /**
     * メインの検索・処理エントリーポイント
     * @param {string} search_query - 検索キーワード
     */
    async function search_books(search_query) {
      // UIリセット＆初期化
      status_el.innerText = "検索中...";
      if (reader_el) reader_el.innerHTML = "";
      if (download_link) download_link.style.display = "none";

      // 2. エラーハンドリング：全体を try-catch で囲みUIへ反映
      try {
        const meta_data = await search_open_library(search_query);

        if (!meta_data) {
          status_el.innerText = "該当する書籍が見つかりませんでした (;´･ω･)";
          return;
        }

        // Gutendexから本データを取得
        const gutenberg_data = await fetch_from_gutendex(meta_data);

        if (!gutenberg_data) {
          status_el.innerText = "Gutenbergで該当するテキストが見つかりませんでした。";
          return;
        }

        status_el.innerText = `「${gutenberg_data.title}」のデータ取得完了！`;

        // 1. #reader への本文レンダリング処理の呼び出し
        await render_book_content(gutenberg_data);

      } catch (err_maji_damedawa) {
        // 後で修正ログ見る用
        console.error("Fatal search error:", err_maji_damedawa);
        status_el.innerText = "通信エラーが発生しました... 再度お試しください (;_ acoustics )";
      }
    }

    /**
     * Open Library 検索 API
     */
    async function search_open_library(query) {
      const res = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}`);
      if (!res.ok) throw new Error("Open Library search network error");

      const data = await res.json();
      if (!data.docs || data.docs.length === 0) return null;

      // 4. あいまい性対策：Gutenberg IDを持っている候補を優先探索
      let selected_doc = data.docs.find(doc => doc.gutenberg_id && doc.gutenberg_id.length > 0);
      
      if (!selected_doc) {
        selected_doc = data.docs[0];
      }

      const author_key = (selected_doc.author_key && selected_doc.author_key[0]) 
        ? selected_doc.author_key[0] 
        : null;

      // 6. 著者没年取得（キャッシュ適用）
      let death_year = null;
      if (author_key) {
        death_year = await fetch_author_death_year_cached(author_key);
      }

      const gutenberg_id = (selected_doc.gutenberg_id && selected_doc.gutenberg_id[0]) 
        ? selected_doc.gutenberg_id[0] 
        : null;

      return {
        title: selected_doc.title,
        author_name: selected_doc.author_name ? selected_doc.author_name[0] : "Unknown",
        author_key: author_key,
        death_year: death_year,
        gutenberg_id: gutenberg_id
      };
    }

    /**
     * 6. キャッシュ付き著者没年取得関数
     */
    async function fetch_author_death_year_cached(author_key) {
      if (author_cache.has(author_key)) {
        return author_cache.get(author_key);
      }

      try {
        const res = await fetch(`https://openlibrary.org/authors/${author_key}.json`);
        if (!res.ok) return null;

        const author_data = await res.json();
        const death_date_str = author_data.death_date;

        let death_year = null;
        if (death_date_str) {
          // 5. 正規表現抽出
          const match_year = death_date_str.match(/\b\d{4}\b/);
          if (match_year) {
            death_year = parseInt(match_year[0], 10);
          }
        }

        author_cache.set(author_key, death_year);
        return death_year;

      } catch (err_author_api) {
        console.warn("Author API error:", err_author_api);
        return null;
      }
    }

    /**
     * Gutendex API からデータ取得
     */
    async function fetch_from_gutendex(meta_data) {
      let url = "";
      if (meta_data.gutenberg_id) {
        url = `https://gutendex.com/books/?ids=${meta_data.gutenberg_id}`;
      } else {
        url = `https://gutendex.com/books/?search=${encodeURIComponent(meta_data.author_name + " " + meta_data.title)}`;
      }

      const res = await fetch(url);
      if (!res.ok) throw new Error("Gutendex API network error");

      const data = await res.json();
      return (data.results && data.results.length > 0) ? data.results[0] : null;
    }

    /**
     * 1. 本文フェッチ＆#readerへのレンダリング
     */
    async function render_book_content(gutenberg_book) {
      if (!reader_el) return;

      const formats = gutenberg_book.formats || {};
      
      const content_url = formats["text/html"] || 
                          formats["text/html; charset=utf-8"] || 
                          formats["text/plain; charset=utf-8"] || 
                          formats["text/plain"];

      if (!content_url) {
        reader_el.innerText = "表示可能なテキストフォーマットが見つかりませんでした。";
        return;
      }

      // 外部リンクの更新表示
      if (download_link && formats["text/html"]) {
        download_link.href = formats["text/html"];
        download_link.style.display = "inline";
      }

      status_el.innerText = "本文を取得中...";

      try {
        const text_res = await fetch(content_url);
        if (!text_res.ok) throw new Error("Failed to fetch book content text");

        const raw_text = await text_res.text();

        if (content_url.includes("text/html")) {
          const parser = new DOMParser();
          const doc = parser.parseFromString(raw_text, "text/html");
          reader_el.innerHTML = doc.body ? doc.body.innerHTML : raw_text;
        } else {
          reader_el.innerHTML = `<pre style="white-space: pre-wrap; word-break: break-all; font-family: inherit;">${escape_html(raw_text)}</pre>`;
        }

        status_el.innerText = "読み込み完了！ ( `•̀ω•́` )b";

      } catch (err_text_fetch) {
        console.error("Text fetch error:", err_text_fetch);
        reader_el.innerText = "本文の取得中にエラーが発生しました（CORS制限等の可能性があります）。";
      }
    }

    // XSS対策用
    function escape_html(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
